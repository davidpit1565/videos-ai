<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
body{width:1080px;height:1350px;background:#0e1422;font-family:"Inter Display","Inter",sans-serif;color:#fff;position:relative;overflow:hidden}
.title{position:absolute;top:56px;left:0;right:0;text-align:center;font-size:74px;font-weight:800;line-height:1.05;letter-spacing:-1px}
.title b{color:#ffd21f}
.col{position:absolute;top:290px;width:490px;height:960px;border-radius:34px;overflow:hidden;background:#fff}
.l{left:40px}.r{left:550px}
.hd{height:110px;display:flex;align-items:center;justify-content:center;gap:18px;font-size:54px;font-weight:800;color:#fff}
.l .hd{background:#10a37f}.r .hd{background:#d97757}
.hd img{height:64px}
.badge{width:70px;height:70px;border-radius:18px;background:#fff;display:flex;align-items:center;justify-content:center}
.badge img{height:46px}
.scene{height:850px;background:#eef1f6;position:relative}
.l .scene{background:#e6f5ef}.r .scene{background:#fbebe3}
.bub{position:absolute;left:22px;right:22px;bottom:30px;height:230px;background:#fff;border:7px solid;border-radius:34px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:60px;font-weight:800;line-height:1.1;color:#111;padding:14px}
.l .bub{border-color:#10a37f}.r .bub{border-color:#d97757}
.bub:before{content:"";position:absolute;top:-34px;left:60px;width:50px;height:50px;background:#fff;border-left:7px solid;border-top:7px solid;transform:rotate(45deg)}
.l .bub:before{border-color:#10a37f}.r .bub:before{border-color:#d97757}
.tag{position:absolute;bottom:34px;left:0;right:0;text-align:center;font-size:36px;color:#8a93a8;font-weight:600}
svg{position:absolute;left:0;top:0}
</style></head><body>
<div class="title">I show AI<br>my <b>idea</b></div>
<div class="col l"><div class="hd"><div class="badge"><img src="openai.svg" style="height:50px"></div>ChatGPT</div>
<div class="scene">
<svg width="490" height="560" viewBox="0 0 490 560">
 <!-- body -->
 <path d="M70 560 C70 450 130 400 245 400 C360 400 420 450 420 560 Z" fill="#2f6fd6"/>
 <rect x="215" y="360" width="60" height="60" rx="14" fill="#e8b48a"/>
 <!-- head -->
 <circle cx="245" cy="250" r="140" fill="#f2c39b"/>
 <path d="M105 235 C100 120 170 95 250 100 C330 95 395 125 385 235 C360 175 320 160 245 160 C170 160 130 175 105 235Z" fill="#3a2a22"/>
 <!-- eyes wide -->
 <ellipse cx="195" cy="250" rx="30" ry="36" fill="#fff"/><ellipse cx="295" cy="250" rx="30" ry="36" fill="#fff"/>
 <circle cx="200" cy="254" r="14" fill="#1b1b1b"/><circle cx="290" cy="254" r="14" fill="#1b1b1b"/>
 <path d="M160 200 Q195 178 228 196" stroke="#3a2a22" stroke-width="10" fill="none" stroke-linecap="round"/>
 <path d="M262 196 Q295 178 330 200" stroke="#3a2a22" stroke-width="10" fill="none" stroke-linecap="round"/>
 <!-- big smile -->
 <path d="M170 315 Q245 395 320 315 Q245 340 170 315Z" fill="#7a2a2a" stroke="#7a2a2a" stroke-width="6" stroke-linejoin="round"/>
 <path d="M190 322 Q245 345 300 322 L296 335 Q245 352 194 335Z" fill="#fff"/>
 <!-- thumbs up -->
 <g transform="translate(335 360)"><rect x="0" y="40" width="120" height="110" rx="26" fill="#f2c39b" stroke="#c9946a" stroke-width="5"/>
 <rect x="22" y="-45" width="42" height="110" rx="21" fill="#f2c39b" stroke="#c9946a" stroke-width="5"/>
 <path d="M18 85H112M18 108H112M18 130H112" stroke="#c9946a" stroke-width="4"/></g>
</svg>
<div class="bub" style="bottom:20px">Perfect idea!<br>😊</div>
</div></div>
<div class="col r"><div class="hd"><div class="badge"><img src="claude.svg"></div>Claude</div>
<div class="scene">
<svg width="490" height="560" viewBox="0 0 490 560">
 <path d="M70 560 C70 450 130 400 245 400 C360 400 420 450 420 560 Z" fill="#2f6fd6"/>
 <rect x="215" y="360" width="60" height="60" rx="14" fill="#e8b48a"/>
 <circle cx="245" cy="250" r="140" fill="#f2c39b"/>
 <path d="M105 235 C100 120 170 95 250 100 C330 95 395 125 385 235 C360 175 320 160 245 160 C170 160 130 175 105 235Z" fill="#3a2a22"/>
 <!-- eyes looking down at paper -->
 <ellipse cx="195" cy="255" rx="30" ry="24" fill="#fff"/><ellipse cx="295" cy="255" rx="30" ry="24" fill="#fff"/>
 <circle cx="200" cy="262" r="13" fill="#1b1b1b"/><circle cx="292" cy="262" r="13" fill="#1b1b1b"/>
 <path d="M160 224 L228 214" stroke="#3a2a22" stroke-width="11" stroke-linecap="round"/>
 <path d="M262 214 L330 226" stroke="#3a2a22" stroke-width="11" stroke-linecap="round"/>
 <!-- flat worried mouth -->
 <path d="M200 340 Q245 322 290 340" stroke="#7a2a2a" stroke-width="10" fill="none" stroke-linecap="round"/>
 <!-- sweat drop -->
 <path d="M385 215 q18 28 0 44 q-18 -16 0 -44Z" fill="#7cc4f5"/>
 <!-- paper with red marks -->
 <g transform="translate(120 395) rotate(-4)"><rect width="250" height="150" rx="10" fill="#fff" stroke="#c9ccd6" stroke-width="5"/>
 <path d="M24 34H226M24 62H200M24 90H226M24 118H170" stroke="#d9dde6" stroke-width="9" stroke-linecap="round"/>
 <path d="M24 62H200" stroke="#e5484d" stroke-width="9" stroke-linecap="round"/><path d="M24 118H170" stroke="#e5484d" stroke-width="9" stroke-linecap="round"/>
 <circle cx="228" cy="26" r="22" fill="#e5484d"/><text x="228" y="38" font-size="32" font-weight="800" text-anchor="middle" fill="#fff">!</text></g>
</svg>
<div class="bub" style="bottom:20px;font-size:56px">3 problems.<br>Fix #1 first.</div>
</div></div>
<div class="tag">tag someone who needs the second one</div>
</body></html>
