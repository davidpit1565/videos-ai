<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
body{width:1080px;height:1350px;background:#0e1422;font-family:"Inter Display","Inter",sans-serif;color:#fff;position:relative;overflow:hidden}
.title{position:absolute;top:46px;left:0;right:0;text-align:center;font-size:66px;font-weight:800;line-height:1.08;letter-spacing:-1px}
.title b{color:#ffd21f}
.col{position:absolute;top:270px;width:490px;height:980px;border-radius:30px;overflow:hidden}
.l{left:40px;background:#10a37f}.r{left:550px;background:#d97757}
.hd{height:110px;display:flex;align-items:center;justify-content:center;gap:16px;font-size:54px;font-weight:800;color:#fff}
.badge{width:68px;height:68px;border-radius:17px;background:#fff;display:flex;align-items:center;justify-content:center}
.badge img{height:44px}
.photo{position:absolute;left:0;right:0;top:110px;bottom:0;background-size:cover}
.l .photo{background-image:url(thumbs.jpg);background-position:46% 20%;background-size:auto 150%}
.r .photo{background-image:url(c7534752.jpg);background-position:50% 25%;background-size:cover}
.bub{position:absolute;left:18px;right:18px;bottom:22px;height:210px;background:#fff;border:7px solid;border-radius:32px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:62px;font-weight:800;line-height:1.08;color:#111;padding:12px}
.l .bub{border-color:#10a37f}.r .bub{border-color:#d97757;font-size:56px}
.chip{position:absolute;top:122px;right:14px;white-space:nowrap;padding:6px 20px;border-radius:99px;font-size:34px;font-weight:800;color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.35)}.chip.no{background:#e5484d}.chip.yes{background:#1f9d55}.tag{position:absolute;bottom:34px;left:0;right:0;text-align:center;font-size:34px;color:#8a93a8;font-weight:600}
</style></head><body>
<div class="title">My idea has <b>3 flaws</b>.<br>I show AI.</div>
<div class="col l"><div class="hd"><div class="badge"><img src="openai.svg"></div>ChatGPT</div><div class="photo"></div><div class="chip no">✗ WRONG</div><div class="bub">Perfect idea! 😊</div></div>
<div class="col r"><div class="hd"><div class="badge"><img src="claude.svg"></div>Claude</div><div class="photo"></div><div class="chip yes">✓ RIGHT</div><div class="bub">3 problems.<br>Fix #1 first.</div></div>
<div class="tag">tag someone who needs the second one</div>
</body></html>
