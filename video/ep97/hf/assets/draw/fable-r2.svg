<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe6f7"/>
      <stop offset="1" stop-color="#fdf3d8"/>
    </linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6a623"/>
      <stop offset="1" stop-color="#ef7d1a"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="660" cy="110" r="46" fill="#ffe08a"/>
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="150" cy="110" rx="60" ry="20"/>
    <ellipse cx="190" cy="95" rx="40" ry="18"/>
    <ellipse cx="480" cy="70" rx="50" ry="16"/>
  </g>
  <rect y="500" width="800" height="100" fill="#8ccf7e"/>
  <rect y="492" width="800" height="16" fill="#6f6a66"/>
  <ellipse cx="400" cy="504" rx="250" ry="10" fill="#000" opacity="0.15"/>

  <!-- speed lines -->
  <g stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.8">
    <line x1="40" y1="300" x2="110" y2="300"/>
    <line x1="20" y1="350" x2="120" y2="350"/>
    <line x1="60" y1="400" x2="130" y2="400"/>
  </g>

  <!-- wheels -->
  <g fill="none" stroke="#2b2b2b" stroke-width="10">
    <circle cx="250" cy="410" r="85"/>
    <circle cx="560" cy="410" r="85"/>
  </g>
  <g stroke="#9a9a9a" stroke-width="2">
    <g id="spokes">
      <line x1="250" y1="330" x2="250" y2="490"/>
      <line x1="170" y1="410" x2="330" y2="410"/>
      <line x1="193" y1="353" x2="307" y2="467"/>
      <line x1="193" y1="467" x2="307" y2="353"/>
    </g>
    <use href="#spokes" x="310"/>
  </g>
  <circle cx="250" cy="410" r="8" fill="#2b2b2b"/>
  <circle cx="560" cy="410" r="8" fill="#2b2b2b"/>

  <!-- frame -->
  <g fill="none" stroke="#d6336c" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M250 410 L340 290 L500 290 L400 410 Z"/>
    <path d="M340 290 L400 410"/>
    <path d="M330 275 L340 290"/>
    <path d="M560 410 L510 265"/>
    <path d="M500 290 L510 265"/>
  </g>
  <!-- handlebar -->
  <path d="M510 265 L505 245 L540 238" fill="none" stroke="#2b2b2b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- seat -->
  <path d="M295 272 Q330 262 365 272 Q345 284 310 282 Z" fill="#2b2b2b"/>

  <!-- chainring and far pedal -->
  <circle cx="400" cy="410" r="24" fill="none" stroke="#555" stroke-width="6"/>
  <line x1="400" y1="410" x2="378" y2="445" stroke="#555" stroke-width="7" stroke-linecap="round"/>
  <rect x="362" y="442" width="32" height="9" rx="4" fill="#2b2b2b"/>

  <!-- far leg -->
  <path d="M345 300 L395 365 L380 440" fill="none" stroke="#d98a1c" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M362 438 L400 436 L404 446 L364 448 Z" fill="#d98a1c"/>

  <!-- tail -->
  <path d="M265 235 L205 215 L225 245 L200 262 L270 268 Z" fill="#e9e4dc"/>

  <!-- body -->
  <ellipse cx="345" cy="232" rx="95" ry="62" fill="#ffffff" stroke="#cfc8bd" stroke-width="3" transform="rotate(-12 345 232)"/>

  <!-- neck -->
  <path d="M400 215 Q440 190 425 140 Q418 110 445 100 L475 118 Q455 135 462 165 Q470 215 420 250 Z" fill="#ffffff" stroke="#cfc8bd" stroke-width="3" stroke-linejoin="round"/>

  <!-- wing reaching to handlebar -->
  <path d="M300 205 Q360 175 420 215 Q470 235 525 240 Q480 262 430 262 Q360 285 300 250 Z" fill="#f1ece4" stroke="#cfc8bd" stroke-width="3" stroke-linejoin="round"/>
  <path d="M330 238 Q380 255 430 245 M320 222 Q370 235 415 228" fill="none" stroke="#cfc8bd" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M500 232 L530 232 L528 248 L502 250 Z" fill="#3a3a3a"/>

  <!-- head -->
  <circle cx="462" cy="102" r="34" fill="#ffffff" stroke="#cfc8bd" stroke-width="3"/>
  <path d="M440 76 Q430 52 448 62 Q452 46 464 66" fill="#ffffff" stroke="#cfc8bd" stroke-width="3" stroke-linejoin="round"/>

  <!-- beak with pouch -->
  <path d="M488 92 L640 112 L490 118 Z" fill="url(#beak)" stroke="#c9650f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M490 118 L640 112 Q590 178 520 168 Q488 158 484 126 Z" fill="#ffc94d" stroke="#c9650f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M632 111 Q646 114 640 126" fill="none" stroke="#c9650f" stroke-width="3" stroke-linecap="round"/>

  <!-- eye -->
  <circle cx="472" cy="94" r="9" fill="#fff" stroke="#2b2b2b" stroke-width="2"/>
  <circle cx="475" cy="94" r="4.5" fill="#2b2b2b"/>
  <circle cx="476.5" cy="92.500" r="1.5" fill="#fff"/>

  <!-- near leg -->
  <path d="M360 285 L425 330 L422 372" fill="none" stroke="#f6a623" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- near crank and pedal -->
  <line x1="400" y1="410" x2="422" y2="378" stroke="#555" stroke-width="7" stroke-linecap="round"/>
  <circle cx="400" cy="410" r="6" fill="#2b2b2b"/>
  <rect x="406" y="374" width="34" height="9" rx="4" fill="#2b2b2b"/>
  <path d="M404 364 L448 362 L454 374 L406 376 Z" fill="#f6a623" stroke="#c9650f" stroke-width="2" stroke-linejoin="round"/>
</svg>
