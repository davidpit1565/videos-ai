<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 350" width="450" height="350">
  <rect width="450" height="350" fill="#dff1fb"/>
  <rect y="320" width="450" height="30" fill="#8fc67a"/>
  <!-- bicycle -->
  <g fill="none" stroke="#333" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="120" cy="260" r="58"/>
    <circle cx="330" cy="260" r="58"/>
    <path d="M120 260 L195 175 L210 260 Z"/>
    <path d="M195 175 L290 168 L210 260"/>
    <path d="M290 168 L330 260"/>
    <path d="M290 168 L282 148 L308 142"/>
    <path d="M178 166 L214 166"/>
  </g>
  <g fill="none" stroke="#999" stroke-width="1.5">
    <circle cx="120" cy="260" r="52"/>
    <circle cx="330" cy="260" r="52"/>
  </g>
  <circle cx="210" cy="260" r="10" fill="#555"/>
  <circle cx="120" cy="260" r="5" fill="#333"/>
  <circle cx="330" cy="260" r="5" fill="#333"/>
