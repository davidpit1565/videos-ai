<script>
window.buildScene_4=function(tl,T0,DUR){
 const E1="power3.out",E2="power2.inOut",ED="sine.inOut";
 const at=f=>T0+DUR*f;
 tl.set('#s4',{opacity:1,visibility:'visible'},T0);
 tl.set('#s4 .w',{opacity:0},T0);
 tl.set('#tag4',{opacity:0},T0);
 tl.set('#pan4',{opacity:1,left:65,width:950,height:610,top:640,backgroundColor:'#E6E8F0',borderRadius:44},T0);
 tl.set('#rob4',{opacity:1},T0);tl.set('#per4',{opacity:0},T0);
 tl.set('#scr4',{strokeDashoffset:1},T0);
 tl.set('#rg4',{transformOrigin:'475px 330px',scale:1.2},T0);
 tl.set('#ps4',{transformOrigin:'475px 610px',scale:.8},T0);
 tl.set('#bub4',{y:0},T0);
 // camera drift all scene
 tl.fromTo('#cam4',{scale:1,x:-8,y:6},{scale:1.04,x:8,y:-8,duration:DUR,ease:ED},T0);
 // robot is already visible at frame 0 and bobs
 tl.fromTo('#rg4',{scale:1.12,rotation:-3},{scale:1.26,rotation:3,duration:DUR*.5,ease:ED},T0);
 // headline: NOT A ROBOT
 const ws=[...document.querySelectorAll('#s4 .w')];
 const ts=[0.02,0.1,0.16,0.48,0.56];
 ws.forEach((el,i)=>{
  const t=at(ts[i]);
  if(i==4) tl.fromTo(el,{opacity:0,y:50,scale:1.2},{opacity:1,y:0,scale:1,duration:DUR*.22,ease:"expo.out"},t);
  else tl.fromTo(el,{opacity:0,y:34},{opacity:1,y:0,duration:DUR*.14,ease:E1},t);
 });
 // red scribble over the robot
 tl.to('#scr4',{strokeDashoffset:0,duration:DUR*.28,ease:E2},at(0.2));
 // robot flips away, person takes over
 tl.to('#rg4',{scaleX:0,scaleY:.9,rotation:0,duration:DUR*.2,ease:"power2.in"},at(0.5));
 tl.to('#scr4',{opacity:0,duration:DUR*.12,ease:ED},at(0.5));
 tl.to('#rob4',{opacity:0,duration:DUR*.1,ease:ED},at(0.62));
 // panel turns dark, grows heavy (bleeds sideways and down)
 tl.to('#pan4',{backgroundColor:'#0D0E13',left:-20,width:1120,height:1300,borderRadius:0,duration:DUR*.4,ease:E2},at(0.5));
 tl.to('#vig4',{opacity:1,duration:DUR*.35,ease:ED},at(0.6));
 tl.fromTo('#per4',{opacity:0},{opacity:1,duration:DUR*.2,ease:ED},at(0.56));
 tl.to('#ps4',{scale:1.3,duration:DUR*.46,ease:"expo.out"},at(0.56));
 tl.to('#ps4',{scale:1.33,duration:DUR*.4,ease:ED},at(0.8));
 tl.fromTo('#per4',{scale:1,transformOrigin:'475px 420px'},{scale:1.1,duration:DUR*.5,ease:ED},at(0.5));
 tl.fromTo('#gw4',{opacity:.3},{opacity:1,duration:DUR*.3,ease:ED},at(0.56));
 // chat bubbles scroll on the screen continuously
 tl.fromTo('#bub4',{y:0},{y:-330,duration:DUR*.5,ease:"none"},at(0.5));
 // soft red tag on robot at the start
 tl.fromTo('#tag4',{opacity:0,x:520,y:70,scale:.8,rotation:-8},{opacity:1,x:520,y:70,scale:1,rotation:-6,duration:DUR*.16,ease:"back.out(1.2)"},at(0.26));
 tl.to('#tag4',{opacity:0,duration:DUR*.1,ease:ED},at(0.5));
};
</script>
