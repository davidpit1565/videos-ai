<script>
window.buildScene_5=function(tl,T0,DUR){
 const E1="power3.out",E2="power2.inOut",ED="sine.inOut",EB="back.out(1.2)";
 const at=f=>T0+DUR*f;
 tl.set('#s5',{opacity:1,visibility:'visible'},T0);
 tl.set('#s5 .w',{opacity:0},T0);
 tl.set('#bb5,#cp5,#tr5,#dr5,#cl5,#cu5',{opacity:0},T0);
 tl.fromTo('#cam5',{scale:1,x:-10,y:8},{scale:1.035,x:10,y:-8,duration:DUR,ease:ED},T0);
 const ws=[...document.querySelectorAll('#s5 .w')];
 ws.forEach((el,i)=>{
  const t=at(0.02+i*0.1), big=i==0;
  if(big) tl.fromTo(el,{opacity:0,y:40,scale:1.18},{opacity:1,y:0,scale:1,duration:DUR*0.2,ease:"expo.out"},t);
  else tl.fromTo(el,{opacity:0,y:36},{opacity:1,y:0,duration:DUR*0.14,ease:E1},t);
 });
 // proof in first second: red bubble, trash, drawer already arriving
 tl.fromTo('#bb5',{opacity:0,y:40,scale:.9},{opacity:1,y:0,scale:1,duration:DUR*0.14,ease:E1},at(0));
 tl.fromTo('#tr5',{opacity:0,y:40},{opacity:1,y:0,duration:DUR*0.16,ease:E1},at(0.03));
 tl.fromTo('#dr5',{opacity:0,y:60},{opacity:1,y:0,duration:DUR*0.18,ease:E1},at(0.08));
 // red bubble pulses while waiting
 tl.to('#bb5',{scale:1.04,duration:DUR*0.08,ease:ED,yoyo:true,repeat:1},at(0.12));
 // cursor comes in, grabs
 tl.fromTo('#cu5',{opacity:0,left:640,top:1000},{opacity:1,left:470,top:800,duration:DUR*0.16,ease:E2},at(0.12));
 // copy peels off and drops into the drawer (stays, glows)
 const c0=at(0.26), cd=DUR*0.26;
 tl.set('#cp5',{opacity:1,left:95,top:715},c0-0.01);
 tl.to('#cp5',{left:80,top:985,scale:.62,duration:cd,ease:E2},c0);
 tl.to('#cp5',{top:965,duration:DUR*0.08,ease:ED},c0+cd);
 // original dragged to trash
 const d0=at(0.28), dd=DUR*0.26;
 tl.to('#bb5',{left:690,top:720,duration:dd,ease:E2},d0);
 tl.to('#cu5',{left:900,top:800,duration:dd,ease:E2},d0);
 tl.to('#ld5',{rotation:-24,duration:DUR*0.08,ease:ED},d0+dd*0.5);
 tl.to('#bb5',{scale:.2,opacity:0,duration:DUR*0.1,ease:"power2.in"},d0+dd);
 tl.to('#ld5',{rotation:0,duration:DUR*0.1,ease:ED},d0+dd+DUR*0.04);
 tl.to('#tr5',{y:6,duration:DUR*0.05,ease:ED,yoyo:true,repeat:1},d0+dd+DUR*0.04);
 tl.to('#cu5',{opacity:0,y:20,duration:DUR*0.1,ease:E2},d0+dd+DUR*0.03);
 // copy glows after the delete
 const g=at(0.56);
 tl.to('#gl5',{opacity:.8,duration:DUR*0.14,ease:ED},g);
 tl.to('#cp5',{backgroundColor:'#4C7BF4',duration:DUR*0.1,ease:ED},g);
 tl.to('#gl5',{opacity:.4,duration:DUR*0.18,ease:ED,yoyo:true,repeat:1},at(0.7));
 // calendar flips, big counter
 tl.fromTo('#cl5',{opacity:0,y:50,scale:.94},{opacity:1,y:0,scale:1,duration:DUR*0.16,ease:E1},at(0.52));
 tl.fromTo('#pg5',{rotationX:0},{rotationX:-95,duration:DUR*0.2,ease:E2},at(0.62));
 tl.fromTo('#pg5',{opacity:1},{opacity:0,duration:DUR*0.04,ease:ED},at(0.62)+DUR*0.17);
 tl.fromTo('#s5 .yr span',{scale:1.25,opacity:0},{scale:1,opacity:1,duration:DUR*0.2,ease:"expo.out"},at(0.68));
 tl.to('#s5 .yr span',{scale:1.05,duration:DUR*0.2,ease:ED,yoyo:true,repeat:1},at(0.84));
 tl.to('#cl5',{y:-6,duration:DUR*0.3,ease:ED,yoyo:true,repeat:1},at(0.4));
};
</script>
