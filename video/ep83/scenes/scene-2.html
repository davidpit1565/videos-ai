<div class="scn clip" id="s2" data-start="0" data-duration="__D2__" data-track-index="1"><div class="cam" id="cam2">

</div></div>
<script>
window.buildScene_2=function(tl,T0,DUR){
 const E1="power3.out",ED="sine.inOut";
 const at=f=>T0+DUR*f;
 tl.set('#s2',{opacity:1,visibility:'visible'},T0);
 tl.set('#s2 .w',{opacity:0},T0);
 tl.fromTo('#cam2',{scale:1,x:-12,y:8},{scale:1.035,x:12,y:-10,duration:DUR,ease:ED},T0);
 const ws=[...document.querySelectorAll('#s2 .w')];
 ws.forEach((el,i)=>{
  const t=at(0.02+i*0.11), slam=el.classList.contains('pill');
  if(slam) tl.fromTo(el,{opacity:0,y:40,scale:1.2},{opacity:1,y:0,scale:1,duration:DUR*0.22,ease:"expo.out"},t);
  else tl.fromTo(el,{opacity:0,y:36},{opacity:1,y:0,duration:DUR*0.16,ease:E1},t);
 });
 tl.fromTo('#c2',{opacity:0,y:70,rotation:1.5},{opacity:1,y:0,rotation:0,duration:DUR*0.22,ease:"expo.out"},T0);
 tl.fromTo('#tri',{opacity:0,scale:.3,rotation:-20},{opacity:1,scale:1,rotation:6,duration:DUR*0.2,ease:"back.out(1.6)"},at(0.1));
 tl.to('#tri',{scale:1.14,rotation:-4,duration:DUR*0.12,ease:ED,yoyo:true,repeat:4},at(0.32));
 tl.fromTo('#ring',{opacity:.9,scale:.8},{opacity:0,scale:1.9,duration:DUR*0.22,ease:"sine.out",repeat:3,repeatDelay:0},at(0.3));
 tl.fromTo('#bar2',{opacity:0},{opacity:1,duration:DUR*0.12,ease:ED},at(0.15));
 // word-by-word selection bar
 const hs=[...document.querySelectorAll('#s2 .hw')], n=hs.length;
 hs.forEach((el,i)=>{
  const t=at(0.2+i*(0.62/n));
  tl.to(el,{backgroundColor:'rgba(76,123,244,0.38)',duration:DUR*0.07,ease:ED},t);
  if(el.classList.contains('k')) tl.to(el,{backgroundColor:'rgba(229,72,77,0.28)',duration:DUR*0.1,ease:ED},t+DUR*0.08);
 });
 tl.to('#bar2',{opacity:.35,duration:DUR*0.1,yoyo:true,repeat:3,ease:ED},at(0.4));
 tl.to('#tx',{y:-6,duration:DUR*0.8,ease:ED},at(0.2));
};
</script>
