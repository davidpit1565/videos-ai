 <div id="st">SOME CHATS</div>
 <div id="mg"><b></b><u></u></div>
</div></div>
<script>
window.buildScene_3=function(tl,T0,DUR){
 const E1="power3.out",E2="power2.inOut",ED="sine.inOut";
 const at=f=>T0+DUR*f;
 tl.set('#s3',{opacity:1,visibility:'visible'},T0);
 tl.set('#s3 .w',{opacity:0},T0);
 tl.set('#ph,#st,#mg,#ey,#sh,#s3 .bb',{opacity:0},T0);
 tl.fromTo('#cam3',{scale:1,x:-12,y:8},{scale:1.035,x:12,y:-8,duration:DUR,ease:ED},T0);
 const ws=[...document.querySelectorAll('#s3 .w')];
 ws.forEach((el,i)=>{
  const t=at(0.02+i*0.09),slam=el.classList.contains('pill');
  if(slam) tl.fromTo(el,{opacity:0,y:44,scale:1.18},{opacity:1,y:0,scale:1,duration:DUR*0.22,ease:"expo.out"},t);
  else tl.fromTo(el,{opacity:0,y:36},{opacity:1,y:0,duration:DUR*0.16,ease:E1},t);
 });
 // phone and bubbles
 tl.fromTo('#ph',{opacity:0,y:70,rotation:1.5},{opacity:1,y:0,rotation:0,duration:DUR*0.24,ease:"expo.out"},at(0.0));
 ['b1','b2','b3','b4','b5'].forEach((id,i)=>{
  tl.fromTo('#'+id,{opacity:0,y:24,scale:.94},{opacity:1,y:0,scale:1,duration:DUR*0.16,ease:E1},at(id=='b3'?0.02:0.07+i*0.04));
 });
 // magnifier slides b1 -> b2 -> b4 -> settles on b3 (abs. coords: phone at 150,690)
 tl.set('#mg',{x:260,y:760},T0);
 tl.to('#mg',{opacity:1,duration:DUR*0.1,ease:E1},at(0.18));
 tl.to('#mg',{x:600,y:850,duration:DUR*0.2,ease:ED},at(0.2));
 tl.to('#mg',{x:660,y:1030,duration:DUR*0.18,ease:ED},at(0.37));
 tl.to('#mg',{x:640,y:936,duration:DUR*0.25,ease:E2},at(0.53));
 tl.to('#mg',{y:944,x:647,duration:DUR*0.2,ease:ED,yoyo:true,repeat:1},at(0.8));
 // spotlight: other bubbles dim, target grows, tag appears
 tl.to('#sh',{opacity:1,duration:DUR*0.3,ease:ED},at(0.55));
 tl.to('#b1,#b2,#b4,#b5',{opacity:.35,duration:DUR*0.25,ease:ED},at(0.6));
 tl.to('#b3',{scale:1.06,backgroundColor:'#FFE9EA',duration:DUR*0.25,ease:E1,transformOrigin:'0% 50%'},at(0.66));
 tl.fromTo('#st',{opacity:0,scale:.6,rotation:-6,y:20},{opacity:1,scale:1,rotation:-4,y:0,duration:DUR*0.2,ease:"back.out(1.4)"},at(0.74));
 tl.to('#st',{y:-6,duration:DUR*0.18,ease:ED,yoyo:true,repeat:1},at(0.9));
 // watching eye, drifts and looks toward the bubble
 tl.fromTo('#ey',{opacity:0,scale:.6,y:20},{opacity:1,scale:1,y:0,duration:DUR*0.22,ease:"expo.out"},at(0.3));
 tl.to('#ir',{attr:{cx:60,cy:58},duration:DUR*0.3,ease:ED},at(0.45));
 tl.to('#ir',{attr:{cx:56,cy:62},duration:DUR*0.25,ease:ED},at(0.8));
 tl.to('#ey',{y:-8,duration:DUR*0.35,ease:ED,yoyo:true,repeat:1},at(0.4));
};
</script>
