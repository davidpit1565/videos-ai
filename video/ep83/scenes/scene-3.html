<script>
window.buildScene_3=function(tl,T0,DUR){
 const E1="power3.out",E2="power2.inOut",ED="sine.inOut";
 const at=f=>T0+DUR*f;
 tl.set('#s3',{opacity:1,visibility:'visible'},T0);
 tl.set('#s3 .w',{opacity:0},T0);
 tl.set('#ph,#st,#cn,#gm,#s3 .ey,#sh,#s3 .bb',{opacity:0},T0);
 tl.set('#cn',{rotation:-24},T0);
 tl.fromTo('#cam3',{scale:1,x:-12,y:8},{scale:1.03,x:10,y:-8,duration:DUR,ease:ED},T0);
 [...document.querySelectorAll('#s3 .w')].forEach((el,i)=>{
  const t=at(0.02+i*0.08),slam=el.classList.contains('pill');
  if(slam) tl.fromTo(el,{opacity:0,y:44,scale:1.18},{opacity:1,y:0,scale:1,duration:DUR*0.22,ease:"expo.out"},t);
  else tl.fromTo(el,{opacity:0,y:36},{opacity:1,y:0,duration:DUR*0.16,ease:E1},t);
 });
 tl.fromTo('#ph',{opacity:0,y:80},{opacity:1,y:0,duration:DUR*0.24,ease:"expo.out"},at(0.0));
 tl.fromTo('#gm',{opacity:0,scale:.6,rotation:-10},{opacity:1,scale:1,rotation:-4,duration:DUR*0.2,ease:"back.out(1.3)"},at(0.06));
 ['b1','b2','b3','b4'].forEach((id,i)=>{
  tl.fromTo('#'+id,{opacity:0,y:26,scale:.95},{opacity:1,y:0,scale:1,duration:DUR*0.16,ease:E1},at(id=='b3'?0.02:0.08+i*0.04));
 });
 // eyes open, glow
 tl.fromTo('#s3 .ey',{opacity:0,scaleY:.1,y:20},{opacity:1,scaleY:1,y:0,duration:DUR*0.24,ease:"expo.out",stagger:DUR*0.05},at(0.2));
 tl.to('#s3 .ey',{y:-8,duration:DUR*0.3,ease:ED,yoyo:true,repeat:1},at(0.45));
 // cone sweeps over bubbles; irises follow
 tl.to('#cn',{opacity:1,duration:DUR*0.12,ease:E1},at(0.28));
 tl.to('#cn',{rotation:20,duration:DUR*0.2,ease:ED},at(0.3));
 tl.to('#cn',{rotation:-6,duration:DUR*0.18,ease:ED},at(0.48));
 tl.to('#cn',{rotation:30,duration:DUR*0.2,ease:"power2.inOut"},at(0.62));
 tl.to('#s3 .ir,#s3 .pp',{attr:{cx:90},duration:DUR*0.2,ease:ED},at(0.3));
 tl.to('#s3 .ir,#s3 .pp',{attr:{cx:60,cy:58},duration:DUR*0.2,ease:ED},at(0.6));
 // surprise: spotlight snaps on private bubble, it lifts out of the list
 tl.to('#sh',{opacity:1,duration:DUR*0.25,ease:ED},at(0.6));
 tl.to('#b1,#b2,#b4',{opacity:.22,duration:DUR*0.22,ease:ED},at(0.64));
 tl.to('#b3',{y:-26,scale:1.1,backgroundColor:'#FFFFFF',borderWidth:7,boxShadow:'10px 12px 0 #0E0E0E',duration:DUR*0.24,ease:"expo.out",transformOrigin:'0% 50%'},at(0.7));
 tl.fromTo('#st',{opacity:0,scale:.5,rotation:-8,y:24},{opacity:1,scale:1,rotation:-4,y:0,duration:DUR*0.22,ease:"back.out(1.4)"},at(0.78));
 tl.to('#st',{y:-8,duration:DUR*0.18,ease:ED,yoyo:true,repeat:1},at(0.9));
 tl.to('#cn',{rotation:27,duration:DUR*0.2,ease:ED,yoyo:true,repeat:1},at(0.82));
};
