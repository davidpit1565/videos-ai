<script>
window.buildScene_1=function(tl,T0,DUR){
 const t=f=>T0+DUR*f, d=f=>DUR*f, qa=s=>[...document.querySelectorAll(s)];
 const S="#s1 ";
 tl.set('#s1',{opacity:1,visibility:'visible'},T0);
 tl.set(S+".w",{opacity:0},T0);
 tl.set(S+"#eyeS",{scale:0,transformOrigin:"0 0"},T0);
 tl.set(S+"#ring",{opacity:0},T0);
 tl.set(S+"#iris",{x:0,y:0},T0);
 // camera drift
 tl.fromTo(S+"#s1drift",{scale:1,x:-8,y:8},{scale:1.04,x:8,y:-10,duration:d(1.4),ease:"sine.inOut"},T0);
 // proof is there from frame 0: bubble + lock float and breathe
 tl.fromTo(S+"#bub",{y:8,rotation:-1.2},{y:-8,rotation:1.2,duration:d(.45),ease:"sine.inOut"},T0);
 tl.to(S+"#bub",{y:6,rotation:-.6,duration:d(.55),ease:"sine.inOut"},t(.45));
 tl.fromTo(S+"#gem",{scale:.9,rotation:-8},{scale:1,rotation:5,duration:d(.4),ease:"sine.inOut"},T0);
 tl.to(S+"#gem",{rotation:-3,duration:d(.6),ease:"sine.inOut"},t(.4));
 tl.fromTo(S+"#lock",{scale:.96,y:6},{scale:1.03,y:-4,duration:d(.38),ease:"sine.inOut",transformOrigin:"50% 60%"},T0);
 // headline
 const wt=[.0,.1,.22,.34];
 qa(S+".w").forEach(el=>{const k=+el.dataset.w,pl=el.classList.contains("pill");
  if(pl) tl.fromTo(el,{opacity:0,y:40,scale:1.18},{opacity:1,y:0,scale:1,duration:d(.2),ease:"expo.out"},t(wt[k]));
  else tl.fromTo(el,{opacity:0,y:44},{opacity:1,y:0,duration:d(.16),ease:"power3.out"},t(wt[k]));});
 // pill SAFE trembles as danger nears
 tl.to(S+".pill",{rotation:-2,duration:d(.1),ease:"sine.inOut",transformOrigin:"50% 50%"},t(.5));
 tl.to(S+".pill",{rotation:2,duration:d(.12),ease:"sine.inOut"},t(.6));
 tl.to(S+".pill",{rotation:0,duration:d(.12),ease:"sine.inOut"},t(.72));
 // lock opens ~40%: shackle lifts and swings, key fades, red glow, eye grows
 tl.to(S+"#s1shkl",{y:-46,rotation:-22,svgOrigin:"250 170",duration:d(.2),ease:"power2.inOut"},t(.36));
 tl.to(S+"#key",{opacity:0,scale:.4,svgOrigin:"158 262",duration:d(.12),ease:"sine.inOut"},t(.38));
 tl.to(S+"#glow",{opacity:1,duration:d(.2),ease:"sine.inOut"},t(.4));
 tl.to(S+"#eyeS",{scale:1,duration:d(.2),ease:"expo.out"},t(.44));
 tl.set(S+"#ring",{opacity:.9,scale:.35},t(.44));tl.to(S+"#ring",{opacity:0,scale:1.15,duration:d(.3),ease:"power2.out"},t(.44));
 // pupil looks around, then up at the message
 tl.to(S+"#iris",{x:-34,duration:d(.12),ease:"sine.inOut"},t(.58));
 tl.to(S+"#iris",{x:30,y:-6,duration:d(.14),ease:"sine.inOut"},t(.7));
 tl.to(S+"#iris",{x:0,y:-26,duration:d(.16),ease:"sine.inOut"},t(.84));
 // bubble flinches, turns red-ish text when seen
 tl.to(S+"#bub",{x:-6,duration:d(.1),ease:"sine.inOut"},t(.5));
 tl.to(S+"#bub",{x:6,duration:d(.12),ease:"sine.inOut"},t(.6));
 tl.to(S+"#bub",{x:0,duration:d(.12),ease:"sine.inOut"},t(.72));
 tl.to(S+"#glow",{scale:1.12,duration:d(.4),ease:"sine.inOut"},t(.62));
};
