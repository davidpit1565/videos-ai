<title>Test — real-photo composite v4, third photo / voice-assistant mood (disposable, not an episode)</title>
<!--
  DISPOSABLE TEST FILE — not an episode, not for shipping.

  ROUND 4. Same approved text treatment as v2/v3: no opaque box, color-shift
  emphasis on the key phrase instead of a highlight rectangle, subtitle-style
  captions (sentence case, no card look). Adds Ken Burns motion from the
  start (v2/v3 got it retrofitted this round; see their own file headers).

  New photo, new topic: a person talking to a smart speaker in a dim living
  room, warm lamp light, the device's light ring glowing — voice AI, not
  chat/typing, and a warm-indoor-lamp mood distinct from v2's cool night-blue
  and v3's bright daylight.

  UPDATE (round 5): now uses channel/assets/test-photo-voice-evening-facesafe.png,
  a real Adobe-generative-expand + crop derivative of the original photo that
  pushes the face 280px lower in frame, fully clear of the headline zone —
  see the long note above .photogradient below for the exact pipeline and
  the real re-measured face bbox. The paragraph below describes the
  ORIGINAL fullres photo's layout (still accurate for the hand/torso/
  speaker, which only shifted position, not composition).

  Read from the actual image (channel/assets/test-photo-voice-evening-fullres.png,
  1080x1920), not assumed:
    - top ~40% (0-768px): a bookshelf, moderately busy (book spines, small
      objects, a cool blue lamp glow upper-left, a warm glow upper-right) but
      LOW CONTRAST/dim — night-lamp lighting, nothing blown out. The person's
      face/glasses sit inside this band too, roughly y280-750 (14-39%),
      brighter than the shelf but still soft, dim lamp-light — the one real
      new risk this photo has that v2/v3 didn't: the headline's usual top
      placement lands partly OVER a face, not just background clutter, so
      this band needs MORE darkening and needs it held further down the
      frame than v2's plain-wall band did.
    - middle (~40-58%, 768-1114px): the person's raised hand (bright,
      gesturing) around x180-450/y850-1080, and the dark navy shirt/torso —
      low-detail, safe for nothing-on-top-of-it the same way v2/v3 keep their
      subject visible in the middle.
    - lower-left (~58-70%, y1110-1350): the smart speaker itself, glowing
      light ring — the frame's single brightest, most graphic element and
      the actual subject of the copy ("it's listening"). Sits left of
      center, so captions (centered, full-width) partially overlap it and
      need real darkening here, more than v2's dark-lap bottom needed and
      closer to v3's treatment of its sunlit-wood bottom.
    - bottom edge (~70-100%): warm-lit wood table foreground and out-of-focus
      shirt/pants — mid-brightness, not blown out.

  So, same placement logic as v3 (re-derived per photo, not copied):
    - headline keeps v2's higher, less-far-down placement (26cqw, matching
      v2 not v3) since this photo's top clutter is dim, not bright like v3's
      shelf+window — but the darkening band is deeper (peak .74 vs v2's .62)
      and held down further (through ~40% vs v2's ~27%) specifically to
      cover the face, which v2's plain dark wall never needed.
    - captions keep the validated bottom:62cqw anchor, but the bottom
      gradient is closer to v3's strength (peak ~.76) and starts earlier
      (~58% vs v2's ~54%) because the speaker's light ring is a real bright
      graphic element there, not v2's dim lap/hands.
    - middle band (from ~40% to ~58%) stays clear, same principle as v2/v3:
      the photo's real subject (the hand, the speaker about to glow) is
      never covered by a darkening band or text.

  Accent color: v2 used --ember (#FBBF24, golden-yellow) against a cool
  night-blue photo; v3 used --rust (#F97316, orange-red) against an already-
  warm daylight photo. This photo is ALSO warm (lamp light, wood, skin
  tones) but the MOOD is different — intimate/cozy rather than bright/
  productive — so neither previous hue fits: gold would read as "yet another
  v2," and orange-red would read as "yet another v3." Chosen instead: --rose
  (#F2617A, a warm coral-rose, hue ~350° vs ember's ~45° and rust's ~25°) —
  still unmistakably warm (skin-toned, candlelight-adjacent), but shifted a
  full hue-family further round the wheel toward pink/red than either
  previous accent, which is what "cozy/intimate" actually looks like next to
  lamp-lit wood and skin tones without repeating either prior mood's exact
  warmth.

  Source image: channel/assets/test-photo-voice-evening-fullres.png — real
  1080x1920 full-resolution photo (same aspect as the frame, no crop needed).

  Ken Burns: the frame's real subject — the speaker's glowing ring — sits in
  the lower-LEFT (roughly x0-250/1080 i.e. 0-23%, y1150-1350/1920 i.e.
  60-70%), well left of and below frame-center. Per kenBurns()'s sign
  convention (positive reveals more of that edge), the slow drift is
  toward MORE LEFT and MORE BOTTOM: fromX/Y 0 -> toX +1.4%, toY -1.2%,
  scale 1.0->1.08 over the full 7.5s — pulling in toward "the thing that's
  listening" without ever swinging far enough to expose the layer's edge
  (well inside the ~8% scale overscan margin).

  Same contract as v2/v3/reel-52.html: .pad/.b/.b.on/.b.gone,
  [data-in]/[data-out]/[data-at], .subs word-lit karaoke captions, window.MotionKit,
  window.__reel, safe-area conventions (top 14%/269px, bottom 35%/672px,
  sides 6%/65px on 1080x1920).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Assistant:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --ink:#0A0E14;--line:#1F2B3A;
  --brass:#DC2626;--brass-hot:#FF6B6B;--rose:#F2617A;
  --text:#FFFFFF;--muted:#8AA0B8;
  --d:'Archivo','Helvetica Neue',Arial,sans-serif;
  --b:'Assistant','Segoe UI',system-ui,sans-serif;
  --m:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box}
body{margin:0;background:#050709;color:var(--text);font-family:var(--b);-webkit-font-smoothing:antialiased}
.page{display:flex;gap:34px;justify-content:center;padding:24px 16px 70px;flex-wrap:wrap;align-items:flex-start}
.reel{width:min(400px,92vw);flex:0 0 auto}
.frame{position:relative;aspect-ratio:9/16;width:100%;overflow:hidden;border-radius:8px;
  container-type:inline-size;background:var(--ink);border:1px solid var(--line)}

/* real-photo background, full-bleed cover. Source is exactly 1080x1920, same
   aspect as the frame, so cover+center shows the whole photo uncropped at
   rest (t=0); the Ken Burns transform pans/zooms from there. */
.photobg{position:absolute;inset:0;z-index:0;transform-origin:center center;will-change:transform;
  background-image:url('../channel/assets/test-photo-voice-evening-facesafe.png');
  background-size:cover;background-position:center;background-repeat:no-repeat}
@media (prefers-reduced-motion:reduce){.photobg{transition:none!important}}

/* Gradient re-derived for THIS photo (see file-header notes): deeper, and
   held further down, at the top (dim shelf clutter + the person's face —
   a face is a new legibility risk v2/v3 never had), and stronger/earlier at
   the bottom (the speaker's glowing ring is the frame's single brightest,
   most graphic element). Middle band stays clear over the hand/speaker —
   same principle as v2/v3. */
/* ROUND 5 — the face-covering defect is actually fixed now, not just
   relabeled as an exception.

   Rounds 4b/4c (previous revisions) documented a real, unresolved problem:
   this photo's face (Adobe image_select_subject bbox {x:.4667,y:.2036,
   w:.275,h:.2172} -> y391-808px, 20.4%-42.1% of frame) overlapped the
   shared fixed headline zone (y269-650px) by 259px. 4c shipped that as a
   labeled exception because the only fix attempted — Canva generate-image,
   asking for the subject composed lower in frame — hit persistent
   "too many requests" rate-limiting and never completed.

   This round retried the fix in a new session (rate limits are
   session-scoped and had cleared) AND, when a second real path was needed,
   used a genuinely different generation service: Adobe's Photoshop API
   `image_generative_expand` (outpainting), not Canva. Concretely:
     1. `image_generative_expand` on the ORIGINAL fullres photo, expanding
        the canvas by 280px on the TOP edge only (Photoshop generates new,
        plausible bookshelf/room content to fill it — verified visually,
        no seam, no artifacts).
     2. `image_crop_to_bounds` back down to exactly 1080x1920, anchored to
        the top of the expanded 1080x2200 canvas — this keeps the ENTIRE
        original photo (bottom included, so the speaker's glow ring is not
        lost) while pushing every real pixel, including the face, down by
        280px inside the frame. This is the "partial crop, not a full
        reframe" path: nothing is cropped OFF, new content is added ABOVE
        so the existing image can slide down without losing its bottom.
     3. Re-ran real Adobe face detection (`image_select_subject`,
        bodyParts:["Face"], returnBbox:true) on the RESULT, not assumed:
        new bbox {x:.4667,y:.35,w:.2769,h:.2167} -> y672-1088px, 35.0%-
        56.7%. The fixed headline zone (y269-650px, 14%-33.9%) and this
        bbox no longer overlap at all — 22px of clear margin.
     4. Ran `export/detect_photo_safe_zone.py recommend` against the real
        result: above_subject zone is now 269-672px (403px, fits 3 headline
        lines at the default 9.6cqw — no font shrink needed), and the
        caption-anchor conflict check (bottom:62cqw against this subject's
        new bbox) reports False — no conflict, verified, not assumed.
   New asset: channel/assets/test-photo-voice-evening-facesafe.png
   (1080x1920, same aspect, drop-in replacement for the old file).

   Gradient re-tuned for the subject's new vertical position (shifted down
   ~14.6 percentage points = 280px/1920px, matching the outpaint amount):
   top band now fades to fully transparent by 35% (269-672px) — this is
   the photo's real quiet zone above the (now correctly-placed) face, so
   the headline is never darkened over the subject. Transparent band holds
   through 56% (672-1075px, over the face — the "never darken the subject"
   rule v2/v3 already used, now actually honored here too). From 56.6% on,
   the same shape rounds 4/4b/4c already validated for the hand/torso and
   the speaker's light ring is kept, just shifted by the same +14.6pp so it
   still lands on the same real photo content (hand, speaker) as before. */
.photogradient{position:absolute;inset:0;z-index:1;pointer-events:none;
  background:
    linear-gradient(180deg, rgba(6,4,3,.40) 0%, rgba(6,4,3,.34) 10%, rgba(6,4,3,.20) 20%, rgba(6,4,3,.08) 30%, transparent 35%, transparent 56%, rgba(6,4,3,.10) 56.6%, rgba(6,4,3,.58) 62.6%, rgba(6,4,3,.68) 67.6%, rgba(6,4,3,.40) 72.6%, rgba(6,4,3,.30) 78.6%, rgba(6,4,3,.62) 86.6%, rgba(6,4,3,.76) 96.6%, rgba(6,4,3,.80) 100%)}
.grain{position:absolute;inset:0;z-index:1;opacity:.05;pointer-events:none;
  background-image:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 3px)}
.prog{position:absolute;left:0;top:0;height:.9cqw;background:var(--rose);z-index:14;width:0;
  box-shadow:0 0 3cqw rgba(242,97,122,.7)}

.scene{position:absolute;inset:0;z-index:2}
/* ROUND 4c — back to the shared fixed zone (27cqw = 291.6px padding-top),
   same as every other scene in this style. See the long note on
   .photogradient above for why this is a deliberate, documented trade-off
   on THIS photo specifically (its face sits partly inside this zone) and
   not an oversight. */
.pad{position:absolute;inset:0;padding:27cqw 10cqw 0;display:flex;flex-direction:column;
  justify-content:flex-start;align-items:center;text-align:center;gap:2.4cqw}
.kb{will-change:transform;width:100%}

.b{opacity:0;transform:translateY(2cqw) scale(.94);transition:opacity .16s ease,transform .22s cubic-bezier(.2,1.4,.4,1)}
.b.snap{transition:none}
.b.on{opacity:1;transform:none}
.b.gone{display:none!important}
@media (prefers-reduced-motion:reduce){.b,.kb{transition-duration:1ms!important}}

h2{font-family:var(--d);font-weight:900;font-size:8.4cqw;line-height:1.14;letter-spacing:-.02em;
  margin:0;text-wrap:balance;position:relative;z-index:2;color:var(--text);
  text-shadow:0 .5cqw 1.4cqw rgba(0,0,0,.92),0 .15cqw .4cqw rgba(0,0,0,.95),0 0 5cqw rgba(0,0,0,.5)}
/* Emphasis = color+weight shift only, no box shape — same convention as
   v2/v3. Accent is --rose (#F2617A), not v2's --ember or v3's --rust: see
   file-header notes on why this mood needs its own hue-family. */
h2 .box{color:var(--rose);font-weight:900;background:none;border:0;padding:0;
  border-radius:0;display:inline;transform:none;text-shadow:0 .5cqw 1.4cqw rgba(0,0,0,.95),0 0 4cqw rgba(0,0,0,.6)}

/* Captions restyled as plain subtitles — sentence case, medium weight, no
   caption-card look. Spoken word picked out by color only. */
/* Font-size aligned to this codebase's own real production convention —
   export/karaoke.py's shipped .subs block (see any reel-*-kar.html, e.g.
   reel-52-kar.html) sets 7.4cqw, not 5.6cqw. */
.subs{position:absolute;left:8cqw;right:8cqw;bottom:62cqw;text-align:center;z-index:11;
  font-family:var(--b);font-weight:600;font-size:7.4cqw;line-height:1.22;letter-spacing:0;
  text-shadow:0 .4cqw 1.2cqw rgba(0,0,0,.95),0 0 2.4cqw rgba(0,0,0,.9)}
.subs b{font-weight:700;color:#fff;transition:color .09s linear;display:inline}
.subs b.on{color:var(--rose)}
.handle{position:absolute;left:0;right:0;bottom:14cqw;text-align:center;z-index:11;
  font-family:var(--m);font-size:2.6cqw;letter-spacing:.28em;text-transform:uppercase;color:#CBD5E1;
  text-shadow:0 .3cqw 1cqw rgba(0,0,0,.9)}
.tapover{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:rgba(5,7,9,.72);border:0;width:100%;color:var(--text)}
.tapover.hide{display:none}
.tapover .d{width:17cqw;height:17cqw;border-radius:50%;border:.7cqw solid var(--rose);display:grid;place-items:center}
.tapover .d::after{content:"";border-left:4.8cqw solid var(--rose);border-top:2.9cqw solid transparent;border-bottom:2.9cqw solid transparent;margin-inline-start:1.5cqw}

.ctl{display:flex;align-items:center;gap:11px;margin-top:11px}
.ctl input{flex:1;-webkit-appearance:none;appearance:none;background:transparent;height:20px;cursor:pointer;margin:0}
.ctl input::-webkit-slider-runnable-track{height:3px;background:#1B2735;border-radius:2px}
.ctl input::-moz-range-track{height:3px;background:#1B2735;border-radius:2px}
.ctl input::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--rose);margin-top:-4.5px}
.ctl input::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--rose)}
.ctl button{background:var(--rose);color:#fff;border:0;border-radius:3px;width:40px;height:31px;font-size:13px;font-weight:700;cursor:pointer}
.ctl span{font-family:var(--m);font-size:12px;color:var(--muted)}
button:focus-visible,input:focus-visible{outline:2px solid var(--rose);outline-offset:3px}

body.render{background:#000;overflow:hidden}
#preroll{position:fixed;inset:0;background:#000;z-index:9999}
body.render .page{padding:0;gap:0;display:block}
body.render .ctl,body.render .tapover,body.render .prog{display:none!important}
body.render .reel{width:100vw;max-width:none}
body.render .frame{width:100vw;height:100vh;aspect-ratio:auto;border:0;border-radius:0}
</style>

<div class="page">
<div class="reel">
<div class="frame" id="frame">
<div class="photobg" id="photobg"></div>
<div class="grain" data-decor></div>
<div class="photogradient"></div>
<div class="prog" id="prog"></div>

<section class="scene" data-in="0" data-out="7.50">
  <div class="pad"><div class="kb" id="hookKb">
    <h2 id="hookH2">It's listening for <span class="box">more than your question</span>.</h2>
  </div></div>
</section>

<div class="subs" id="subs"></div>
<div class="handle" data-decor>@actually_works.ai</div>
<button class="tapover" id="tap" aria-label="play"><span class="d"></span></button>
</div>
</div>

<div class="ctl">
  <button id="pp" aria-label="Play">▶</button>
  <input id="seek" type="range" min="0" max="7.50" step="0.05" value="0" aria-label="Seek">
  <span id="cur2">0:00</span>
</div>
</div>
</div>

<script src="../export/motion-kit.js"></script>
<script>
(function(){
  var MK=window.MotionKit;
  var DUR=7.50,t=0,playing=false,last=0;
  var frame=document.getElementById('frame');
  var scenes=[].slice.call(frame.querySelectorAll('.scene'));
  var beats=[].slice.call(frame.querySelectorAll('[data-at]'));
  var subs=document.getElementById('subs'),seek=document.getElementById('seek');
  var pp=document.getElementById('pp'),cur2=document.getElementById('cur2');
  var tap=document.getElementById('tap'),prog=document.getElementById('prog');

  // Plain-subtitle captions — sentence case, same convention as v2/v3. Copy
  // is fresh for this photo's mood: a voice assistant picking up more than
  // the one question you asked it — the ambient talk in the room.
  var CUES=[
    [0.30,1.60,"It's listening"],
    [1.60,2.90,"for more than"],
    [2.90,4.20,"your question."],
    [4.30,7.50,"Every word in the room becomes something it can recall."]
  ];

  // ROUND 4d — real word-by-word karaoke captions, same mechanism as v2/v3
  // (see v2's WORDS comment). HAND-AUTHORED PLACEHOLDER TIMESTAMPS: no real
  // narration exists for this made-up copy, so each line's known duration
  // above is split evenly across its words — NOT real Whisper-aligned
  // output from export/karaoke.py, which would land unevenly.
  var WORDS=[
    [0.30,0.95,"It's",0],[0.95,1.60,"listening",0],
    [1.60,2.03,"for",1],[2.03,2.47,"more",1],[2.47,2.90,"than",1],
    [2.90,3.55,"your",2],[3.55,4.20,"question.",2],
    [4.30,4.62,"Every",3],[4.62,4.94,"word",3],[4.94,5.26,"in",3],
    [5.26,5.58,"the",4],[5.58,5.90,"room",4],[5.90,6.22,"becomes",4],
    [6.22,6.54,"something",5],[6.54,6.86,"it",5],
    [6.86,7.18,"can",6],[7.18,7.50,"recall.",6]
  ];

  function fmt(s){s=Math.max(0,Math.floor(s));return Math.floor(s/60)+":"+("0"+(s%60)).slice(-2);}

  // Ken Burns: see file-header notes — drift toward the speaker's glowing
  // ring, lower-left of frame-center, without ever exposing the layer's
  // edge (scale gives ~8% overscan, pan uses well under half of that).
  var photobg=document.getElementById('photobg');

  var hookKb=document.getElementById('hookKb');
  var hookH2=document.getElementById('hookH2');
  var hookScene=hookH2.closest('.scene');
  var hookSplit=MK.splitWordsSafe(hookH2);
  var hookClimax=null;
  for(var hi=0;hi<hookSplit.words.length;hi++){
    var hw=hookSplit.words[hi];
    if(hw.classList.contains('box')){ hookClimax=hw; break; }
  }
  var hookClimaxIndex=hookClimax?hookSplit.words.indexOf(hookClimax):-1;

  function renderHook(){
    var ht=t-(+hookScene.dataset.in);
    var START=0.15,GAP=0.10,DUR2=0.30;
    for(var i=0;i<hookSplit.words.length;i++){
      var w=hookSplit.words[i],at=START+i*GAP;
      if(w===hookClimax){
        MK.animatePop(w,ht,at,DUR2);
      } else {
        var e=MK.smoothIn(MK.clamp01((ht-at)/DUR2));
        w.style.opacity=String(e);
        w.style.transform='translateY('+(14*(1-e)).toFixed(2)+'px)';
      }
    }
    if(hookClimaxIndex>=0){
      var climaxAt=START+hookClimaxIndex*GAP;
      var camScale=MK.multiPhaseCamera(ht,{settleDur:0.4,pullBack:0.98,pushAt:climaxAt,pushDur:0.9,pushTo:1.05});
      hookKb.style.transform='scale('+camScale.toFixed(4)+')';
    }
  }

  function render(){
    var i,e;
    photobg.style.transform=MK.kenBurns(t,DUR,{toScale:1.08,toX:1.4,toY:-1.2});
    renderHook();

    for(i=0;i<beats.length;i++){
      e=beats[i];
      var sc=e.closest('.scene'),until=e.dataset.until?+e.dataset.until:Infinity;
      var vis=sc&&t>=+sc.dataset.in&&t<+sc.dataset.out&&t>=+e.dataset.at&&t<until;
      e.classList.toggle('snap',t<0.30);
      if(vis){ if(e.classList.contains('gone')){e.classList.remove('gone');void e.offsetWidth;} e.classList.add('on'); }
      else { e.classList.remove('on'); e.classList.add('gone'); }
    }

    var inLine=false;
    for(i=0;i<CUES.length;i++) if(t>=CUES[i][0]-0.32&&t<=CUES[i][1]+0.15){inLine=true;break;}
    if(t>CUES[CUES.length-1][1]) inLine=true;
    var here=-1,cur=-1;
    for(i=0;i<WORDS.length;i++) if(WORDS[i][0]<=t+0.08){ here=WORDS[i][3]; cur=i; }
    var txt='';
    if(inLine&&here>=0){
      for(i=0;i<WORDS.length;i++) if(WORDS[i][3]===here)
        txt+=(i===cur?'<b class="on">':'<b>')+WORDS[i][2]+'</b>  ';
    }
    subs.innerHTML=txt;
    prog.style.width=(t/DUR*100)+'%';
    seek.value=t; cur2.textContent=fmt(t);
  }
  function loop(ts){ if(!playing)return; if(!last)last=ts; t+=(ts-last)/1000; last=ts;
    if(t>=DUR){t=DUR;pause();render();return;} render(); requestAnimationFrame(loop); }
  function play(){ if(t>=DUR)t=0; playing=true;last=0;pp.textContent='❚❚';tap.classList.add('hide');requestAnimationFrame(loop); }
  function pause(){ playing=false; pp.textContent='▶'; }
  pp.onclick=function(){playing?pause():play()};
  tap.onclick=play;
  seek.oninput=function(){t=+seek.value;last=0;render();};
  document.addEventListener('keydown',function(ev){ if(ev.key===' '&&ev.target.tagName!=='INPUT'){ev.preventDefault();playing?pause():play();} });
  beats.forEach(function(e){e.classList.add('gone')});
  render();
  if(location.search.indexOf('render=1')>=0){
    document.body.classList.add('render');
    var pre=document.createElement('div'); pre.id='preroll'; document.body.appendChild(pre);
    var _p=play; play=function(){ if(pre&&pre.parentNode) pre.parentNode.removeChild(pre); _p(); };
  }
  window.__reel={play:function(){play();},pause:pause,seek:function(v){t=v;last=0;render();},duration:DUR};
})();
</script>
