<title>Episode 26 — avatar captions overlay (Gemini idle clip + real voice)</title>
<!--
  Not a normal reel build. Episode 26 skips the animated-typography scenes entirely —
  the picture is a Gemini-generated idle avatar clip (video/d-id-renders replaced by the
  free path, see channel notes), not HyperFrames scenes. This file exists only to
  produce the word-by-word caption + handle overlay, rendered on a transparent
  background and captured with alpha, then composited over the avatar mp4 in ffmpeg —
  frames.js/render.sh's normal video-background handling doesn't apply here.

  karaoke.py runs against this file exactly like any other reel build: it reads the
  CUES array below and rewrites the subs render block into the word-by-word version.
-->
<style>
:root{
  --brass:#FFB020;--text:#FFFFFF;
  --b:'Assistant','Segoe UI',system-ui,sans-serif;
  --m:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:transparent}
.frame{position:relative;width:1080px;height:1920px;overflow:hidden;container-type:inline-size}
.subs{position:absolute;left:6.5cqw;right:6.5cqw;bottom:63cqw;text-align:center;z-index:11;
  font-family:var(--b);font-weight:800;font-size:7.4cqw;line-height:1.12;letter-spacing:-.01em;
  text-transform:uppercase;
  text-shadow:0 .5cqw 1.6cqw rgba(0,0,0,.95),0 0 3cqw rgba(0,0,0,.9)}
.subs b{font-weight:800;color:#fff;transition:color .09s linear,transform .09s linear;display:inline-block}
.subs b.on{color:var(--brass);transform:scale(1.06)}
.handle{position:absolute;left:0;right:0;bottom:14cqw;text-align:center;z-index:11;
  font-family:var(--m);font-size:2.6cqw;letter-spacing:.28em;text-transform:uppercase;color:#5C7086}
</style>
<div class="frame" id="frame">
<div class="subs" id="subs"></div>
<div class="handle" data-decor>@actually_works.ai</div>
</div>
<script>
(function(){
  var DUR=50.30,t=0;
  var subs=document.getElementById('subs');

  var CUES=[
    [0.3,3.02,"This is a real AI model. My WiFi is off."],
    [3.44,8.62,"No account. No subscription. No API key. It's running right here, on this laptop."],
    [9.04,15.43,"The tool is called Ollama. It's free, and it's been downloaded enough already that this isn't some obscure hack."],
    [15.85,22.36,"One command installs it. One more command downloads a real model and runs it — fully offline, from that point on."],
    [23.21,29.67,"You don't need a gaming PC for this. A normal laptop, no separate graphics card, runs a real model just fine."],
    [30.09,36.46,"What you get is a private AI that never sends what you type anywhere — because there's nowhere for it to go."],
    [36.88,43.8,"It's not going to beat the biggest paid models. But for something real, private, and offline — this is free, and it already works."],
    [44.22,46.34,"The exact setup's in the link in bio."],
    [47.19,49.41,"Follow for the setup that actually works."]
  ];

  function render(){
    var i;
    var txt=''; for(i=0;i<CUES.length;i++) if(t>=CUES[i][0]&&t<=CUES[i][1]){txt=CUES[i][2];break;}
    subs.innerHTML=txt;
  }
  render();
  window.__reel={play:function(){},pause:function(){},seek:function(v){t=v;render();},duration:DUR};
})();
</script>
