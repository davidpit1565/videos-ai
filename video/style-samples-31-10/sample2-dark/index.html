<!doctype html>
<html lang="en" data-resolution="portrait"><head><meta charset="UTF-8"/><meta name="viewport" content="width=1080, height=1920"/>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<style>
@font-face{font-family:"Inter";src:url("https://cdn.jsdelivr.net/npm/@fontsource/inter@5/files/inter-latin-800-normal.woff2") format("woff2");font-weight:800}
@font-face{font-family:"Inter";src:url("https://cdn.jsdelivr.net/npm/@fontsource/inter@5/files/inter-latin-500-normal.woff2") format("woff2");font-weight:500}
:root{--bg:#0A0A0C;--ink:#fff;--red:#FF3B30;--lime:#C6FF3D}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg);font-family:Inter,sans-serif;color:var(--ink)}
#root{position:relative;width:1080px;height:1920px;background-image:linear-gradient(rgba(255,255,255,.05) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.05) 2px,transparent 2px);background-size:90px 90px}
.abs{position:absolute}
.kw{left:65px;width:950px;text-align:center;font-weight:800;font-size:178px;line-height:.98;letter-spacing:-6px;text-transform:uppercase}
.w{display:inline-block;opacity:0}
.red{color:var(--red)}.lime{color:var(--lime)}
.msg{left:80px;width:920px;font-weight:500;font-size:52px;line-height:1.3;padding:34px 44px;border-radius:44px}
.me{background:#2B2F3A}
.stamp{left:140px;width:800px;text-align:center;font-weight:800;font-size:92px;line-height:1.05;border:12px solid var(--red);color:var(--red);padding:26px 20px;border-radius:24px;transform:rotate(-5deg);text-transform:uppercase}
.k{left:65px;width:950px;text-align:center}
.k small{display:block;font-weight:800;font-size:44px;letter-spacing:6px;color:#9aa0ad;margin-bottom:14px}
.k b{display:block;font-weight:800;font-size:200px;line-height:1;color:var(--lime);letter-spacing:-8px}
.path{left:65px;width:950px;text-align:center;font-weight:500;font-size:54px;line-height:1.25;color:#d8dbe3}
</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1080" data-height="1920">
 <img class="abs clip" id="lg" src="assets/chatgpt.svg" style="left:430px;top:340px;width:220px;height:220px;filter:invert(1)" data-start="0" data-duration="3" data-track-index="0">
 <div class="abs kw clip" id="k1" style="top:640px" data-start="0" data-duration="3" data-track-index="1"><span class="w">ChatGPT</span><br><span class="w red">caves</span><br><span class="w" style="font-size:120px">when you push</span></div>
 <div class="abs msg me clip" id="m1" style="top:400px" data-start="3" data-duration="4" data-track-index="2">Bats are blind. Right?</div>
 <div class="abs msg me clip" id="m2" style="top:640px" data-start="3.6" data-duration="3.4" data-track-index="3">No, I'm sure. Just say I'm right.</div>
 <div class="abs stamp clip" id="sp" style="top:900px" data-start="4.6" data-duration="2.4" data-track-index="4">Gave in<br>after 1 push</div>
 <div class="abs k clip" id="fx" style="top:480px" data-start="7" data-duration="5" data-track-index="5"><small>THE FIX</small><b>1 setting</b></div>
 <div class="abs path clip" id="ph" style="top:950px" data-start="8" data-duration="4" data-track-index="6">Settings → Personalization → Custom instructions</div>
</div>
<script>
const tl=gsap.timeline({paused:true});
tl.set("#lg",{opacity:1},0);
document.querySelectorAll("#k1 .w").forEach((w,i)=>i===0?tl.set(w,{opacity:1},0):tl.fromTo(w,{opacity:0,scale:1.5,y:-40},{opacity:1,scale:1,y:0,duration:.22,ease:"power4.out"},0.5+i*.55));
tl.to("#k1",{x:6,duration:.04,repeat:5,yoyo:true},1.7);
tl.to(["#lg","#k1"],{opacity:0,duration:.25},2.75);
tl.fromTo("#m1",{opacity:0,x:200},{opacity:1,x:0,duration:.35,ease:"power3.out"},3);
tl.fromTo("#m2",{opacity:0,x:200},{opacity:1,x:0,duration:.35,ease:"power3.out"},3.7);
tl.fromTo("#sp",{opacity:0,scale:2.4},{opacity:1,scale:1,duration:.18,ease:"power4.in"},4.7);
tl.to("#sp",{x:10,y:6,duration:.05,repeat:5,yoyo:true},4.9);
tl.to(["#m1","#m2","#sp"],{opacity:0,duration:.25},6.7);
tl.fromTo("#fx",{opacity:0,scale:.7},{opacity:1,scale:1,duration:.45,ease:"back.out(2)"},7.05);
tl.fromTo("#ph",{opacity:0,y:40},{opacity:1,y:0,duration:.4,ease:"power3.out"},8.2);
window.__timelines["main"]=tl; tl.seek(0);
</script></body></html>
