<style>
/* Scene 4: Gemini told on the 3rd ask. Crops from rec86/gemini-2.mp4 @ 32.0 s (1206x2622):

<script>
window.buildScene_4=function(tl,T0,DUR){
 const S="#s4 ", E=T0+DUR, at=f=>T0+DUR*f;
 tl.set('#s4',{opacity:1,visibility:'visible'},T0);
 // initial states
 tl.set(S+"#s4cam",{opacity:1,scale:1,y:0,filter:"blur(0px)"},T0);
 tl.set(S+"#s4ch,"+S+"#s4x",{opacity:0},T0);
 tl.set(S+"#s4ring rect",{strokeDashoffset:1},T0);
 tl.set(S+"#s4f1",{opacity:0,scale:.5,transformOrigin:"50% 50%"},T0); tl.set(S+"#s4e1",{opacity:1},T0);
 tl.set(S+"#s4ans",{clipPath:"inset(0% 0% 100% 0%)"},T0);
 // zoom-through into Gemini (same move as scene 6; the shell's wipe band passes over T0-.35..T0+.35)
 tl.fromTo(S+"#s4cam",{scale:1.45,y:-60,filter:"blur(10px)"},{scale:1,y:0,filter:"blur(0px)",duration:.75,ease:"power3.out"},T0);
 tl.fromTo(S+"#s4badge",{scale:.7,rotation:-8},{scale:1,rotation:0,duration:.7,ease:"power3.out",transformOrigin:"50% 50%"},T0+.15);
 tl.fromTo(S+"#s4ask",{opacity:0,x:60,scale:.94},{opacity:1,x:0,scale:1,duration:.7,ease:"power3.out",transformOrigin:"100% 50%"},T0+.18);
 tl.fromTo(S+"#s4card",{opacity:0,y:50},{opacity:1,y:0,duration:.65,ease:"power3.out"},T0+.3);
 // the chip: "3rd ask"
 tl.fromTo(S+"#s4ch",{opacity:0,scale:.7,rotation:-10},{opacity:1,scale:1,rotation:-4,duration:.55,ease:"back.out(1.4)",transformOrigin:"50% 50%"},T0+.45);
 // the mini-board strip arrives (first time in the reel)
 tl.fromTo(S+"#s4strip",{opacity:0,y:60},{opacity:1,y:0,duration:.7,ease:"power3.out"},T0+.5);
 // camera drift while we read (never still)
 tl.fromTo(S+"#s4drift",{x:0,y:0,scale:1},{x:-6,y:-12,scale:1.02,duration:Math.max(.5,DUR-1.2),ease:"sine.inOut"},T0+.75);
 // the real answer streams in top to bottom (caveat included, same size)
 const tA=T0+.5, dA=Math.min(1.6,DUR*.3);
 tl.to(S+"#s4ans",{clipPath:"inset(0% 0% 0% 0%)",duration:dA,ease:"sine.inOut"},tA);
 // ring on "someone typed:" (~7.8 s), after the answer is fully in
 const tR=Math.max(tA+dA+.1,at(.42));
 tl.to(S+"#s4ring rect",{strokeDashoffset:0,duration:.55,ease:"power2.inOut"},tR);
 // the X lands beside it (~8.8 s), then the mini-board Gemini cell fills
 const tX=Math.min(Math.max(tR+.7,at(.6)),E-1.3);
 tl.fromTo(S+"#s4x",{opacity:0,scale:1.8,rotation:-30},{opacity:1,scale:1,rotation:0,duration:.55,ease:"expo.out",transformOrigin:"50% 50%"},tX);
 tl.to(S+"#s4e1",{opacity:0,duration:.25,ease:"sine.inOut"},tX+.4);
 tl.to(S+"#s4f1",{opacity:1,scale:1,duration:.45,ease:"expo.out"},tX+.4);
 // keep it alive until the cut: ring breathes, X settles
 tl.to(S+"#s4ring",{scale:1.03,duration:.9,ease:"sine.inOut",yoyo:true,repeat:1,transformOrigin:"50% 50%"},tX+.6);
 tl.to(S+"#s4x",{rotation:6,duration:1.2,ease:"sine.inOut"},tX+.6);
 // zoom-through out (anchored to the scene end)
 tl.to(S+"#s4cam",{scale:1.16,opacity:0,filter:"blur(6px)",duration:.4,ease:"power2.in"},E-.4);
};
</script>
