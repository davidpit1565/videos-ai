<title>Reel template — starter build with zoom-through transitions wired in</title>
<!--
  Copy this file to start a new episode's build.html, then replace the placeholder
  scene text below. What this file adds over the plain reel-22-style boilerplate:
  every scene now transitions with a real zoom-through (recipe 4 in
  channel/motion-recipes.md) instead of the flat opacity{0,1} hard-cut every shipped
  episode has used so far. That was flagged as a repo-wide gap, not a per-scene nit —
  hyperframes-animation/transitions/overview.md states "every composition uses
  transitions, no exceptions" as a non-negotiable rule.

  Still NOT wired in here yet, on purpose — see channel/motion-recipes.md's "Rewiring"
  section for why: recipes 1-3 (hook word-by-word, quote per-word highlight,
  scoreboard stagger) need a markup-safe word-splitter that can wrap words in
  existing inline HTML (a <br>, a <span class="box">) without breaking it. Applying
  MotionKit.splitWords() naively to h2.innerHTML here would silently mangle any
  markup structure like it — that needed its own real solution, not this file
  guessing at one. Until that lands, the .b/.kb beat animation below is unchanged
  from what has already shipped (functional, just not upgraded).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Assistant:wght@600;700;800&family=IBM+Plex+Mono:wght@500&family=Inter:wght@500;600&display=swap">
<style>
:root{
  --ink:#0A0E14;--line:#1F2B3A;
  --brass:#FF5C5C;--brass-hot:#FF9494;--ember:#FFD23F;
  --text:#FFFFFF;--muted:#8AA0B8;
  --d:'Archivo','Helvetica Neue',Arial,sans-serif;
  --b:'Assistant','Segoe UI',system-ui,sans-serif;
  --m:'IBM Plex Mono',monospace;
  --ui:'Inter','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:#050709;color:var(--text);font-family:var(--b);-webkit-font-smoothing:antialiased}
.page{display:flex;gap:34px;justify-content:center;padding:24px 16px 70px;flex-wrap:wrap;align-items:flex-start}
.reel{width:min(400px,92vw);flex:0 0 auto}
.frame{position:relative;aspect-ratio:9/16;width:100%;overflow:hidden;border-radius:8px;
  container-type:inline-size;background:var(--ink);border:1px solid var(--line)}

.bg{position:absolute;inset:0;z-index:0}
.bg i{position:absolute;display:block;border-radius:50%;will-change:transform;left:0;top:0}
.bg .b1{width:130cqw;height:130cqw;top:-40cqw;left:-30cqw;background:radial-gradient(circle closest-side,rgba(62,198,255,.26),rgba(62,198,255,0) 70%)}
.bg .b2{width:150cqw;height:150cqw;top:50cqw;left:-10cqw;background:radial-gradient(circle closest-side,rgba(20,28,40,.6),rgba(20,28,40,0) 70%)}
.bg .b3{width:120cqw;height:120cqw;top:120cqw;left:20cqw;background:radial-gradient(circle closest-side,rgba(255,176,32,.16),rgba(255,176,32,0) 70%)}
.grain{position:absolute;inset:0;z-index:1;opacity:.05;
  background-image:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 3px)}
.vig{position:absolute;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 50%,transparent 40%,rgba(5,7,9,.55) 100%)}
.prog{position:absolute;left:0;top:0;height:.9cqw;background:var(--brass);z-index:14;width:0;
  box-shadow:0 0 3cqw rgba(62,198,255,.7)}

/* Scene visibility/motion is now driven entirely by MotionKit.zoomThroughTransition
   in the script below — no .scene.active opacity toggle any more. */
.scene{position:absolute;inset:0;z-index:2}
.pad{position:absolute;inset:0;padding:28cqw 10cqw 65cqw;display:flex;flex-direction:column;
  justify-content:center;align-items:center;text-align:center;gap:2.4cqw}
.kb{will-change:transform;width:100%}

.b{opacity:0;transform:translateY(2cqw) scale(.94);transition:opacity .16s ease,transform .22s cubic-bezier(.2,1.4,.4,1)}
.b.snap{transition:none}
.b.on{opacity:1;transform:none}
.b.gone{display:none!important}
@media (prefers-reduced-motion:reduce){.b,.kb{transition-duration:1ms!important}}

h2{font-family:var(--d);font-weight:900;font-size:12.6cqw;line-height:.98;letter-spacing:-.045em;
  margin:0;text-wrap:balance;position:relative;z-index:2}
h2 em{font-style:normal;color:var(--brass)}
h2 .box{background:var(--brass);color:#0A0E14;padding:0 1.6cqw;border-radius:1cqw;
  display:inline-block;transform:rotate(-1.2deg)}
h2 .ebox{background:var(--ember);color:#2A1000;padding:0 1.6cqw;border-radius:1cqw;display:inline-block}
p.lede{font-size:5.6cqw;line-height:1.3;color:#EAF3FB;margin:0;font-weight:700;position:relative;z-index:2}
p.lede strong{color:var(--brass)}

.quote{background:#fff;border-radius:2.4cqw;padding:5cqw 5.5cqw;width:100%;
  box-shadow:0 3cqw 9cqw rgba(0,0,0,.6);position:relative;z-index:2;text-align:left}
.quote .qk{font-family:var(--m);font-size:2.8cqw;letter-spacing:.14em;text-transform:uppercase;
  color:#6B7C90;margin:0 0 2.4cqw}
.quote .qb{font-family:var(--b);font-weight:700;font-size:5cqw;line-height:1.4;color:#0D0D0D}
.quote .qb strong{color:#1E8A82}

.scoreboard{display:flex;flex-direction:column;gap:2.6cqw;width:100%;position:relative;z-index:2}
.scorerow{display:flex;align-items:center;justify-content:space-between;background:#101823;
  border:.3cqw solid #1E3348;border-radius:1.6cqw;padding:3cqw 4cqw}
.scorerow .lbl{font-family:var(--ui);font-weight:600;font-size:4cqw;color:#CFE0F0;text-align:left}
.scorerow .val{font-family:var(--d);font-weight:900;font-size:6.4cqw;color:var(--brass)}
.scorerow.win .val{color:#5CE18A}
.scorerow.lose .val{color:var(--ember)}

.subs{position:absolute;left:6.5cqw;right:6.5cqw;bottom:63cqw;text-align:center;z-index:11;
  font-family:var(--b);font-weight:800;font-size:7.4cqw;line-height:1.12;letter-spacing:-.01em;
  text-transform:uppercase;
  text-shadow:0 .5cqw 1.6cqw rgba(0,0,0,.95),0 0 3cqw rgba(0,0,0,.9)}
.subs em{font-style:normal;background:var(--brass);color:#0A0E14;padding:0 1.4cqw;border-radius:.9cqw;
  display:inline-block;text-shadow:none}
.subs b{font-weight:800;color:#fff;transition:color .09s linear,transform .09s linear;display:inline-block}
.subs b.on{color:var(--brass);transform:scale(1.06)}
.handle{position:absolute;left:0;right:0;bottom:14cqw;text-align:center;z-index:11;
  font-family:var(--m);font-size:2.6cqw;letter-spacing:.28em;text-transform:uppercase;color:#5C7086}
.tapover{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:rgba(5,7,9,.72);border:0;width:100%;color:var(--text)}
.tapover.hide{display:none}
.tapover .d{width:17cqw;height:17cqw;border-radius:50%;border:.7cqw solid var(--brass);display:grid;place-items:center}
.tapover .d::after{content:"";border-left:4.8cqw solid var(--brass);border-top:2.9cqw solid transparent;border-bottom:2.9cqw solid transparent;margin-inline-start:1.5cqw}

.ctl{display:flex;align-items:center;gap:11px;margin-top:11px}
.ctl input{flex:1;-webkit-appearance:none;appearance:none;background:transparent;height:20px;cursor:pointer;margin:0}
.ctl input::-webkit-slider-runnable-track{height:3px;background:#1B2735;border-radius:2px}
.ctl input::-moz-range-track{height:3px;background:#1B2735;border-radius:2px}
.ctl input::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--brass);margin-top:-4.5px}
.ctl input::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--brass)}
.ctl button{background:var(--brass);color:#0A0E14;border:0;border-radius:3px;width:40px;height:31px;font-size:13px;font-weight:700;cursor:pointer}
.ctl span{font-family:var(--m);font-size:12px;color:var(--muted)}
button:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:3px}

body.render{background:#000;overflow:hidden}
#preroll{position:fixed;inset:0;background:#000;z-index:9999}
body.render .page{padding:0;gap:0;display:block}
body.render .ctl,body.render .tapover,body.render .prog{display:none!important}
body.render .reel{width:100vw;max-width:none}
body.render .frame{width:100vw;height:100vh;aspect-ratio:auto;border:0;border-radius:0}
</style>

<div class="page">
<div class="reel">
<div class="frame" id="frame">
<div class="bg"><i class="b1" id="b1"></i><i class="b2" id="b2"></i><i class="b3" id="b3"></i></div>
<div class="grain" data-decor></div>
<div class="vig"></div>
<div class="prog" id="prog"></div>

<section class="scene" data-in="0" data-out="4.00">
  <div class="pad"><div class="kb">
    <h2 class="b punch" data-at="0">Replace this —<br>a real hook,<br>3 lines <span class="box">max</span></h2>
  </div></div>
</section>

<section class="scene" data-in="4.00" data-out="8.00">
  <div class="pad"><div class="kb">
    <div class="quote b" data-at="4.10">
      <div class="qk">replace me</div>
      <div class="qb">Quote-card scene — <strong>emphasized phrase here</strong>.</div>
    </div>
  </div></div>
</section>

<section class="scene" data-in="8.00" data-out="12.00">
  <div class="pad"><div class="kb">
    <p class="lede b" data-at="8.10">Replace me —<br>a plain lede line,<br><strong>with one emphasis</strong>.</p>
  </div></div>
</section>

<section class="scene" data-in="12.00" data-out="16.50">
  <div class="pad"><div class="kb">
    <div class="scoreboard b" data-at="12.10">
      <div class="scorerow lose"><span class="lbl">Replace me</span><span class="val">BAD</span></div>
      <div class="scorerow win"><span class="lbl">Replace me</span><span class="val">GOOD</span></div>
    </div>
  </div></div>
</section>

<section class="scene" data-in="16.50" data-out="20.50">
  <div class="pad"><div class="kb">
    <p class="lede b" data-at="16.60" style="font-size:6.2cqw">Follow for the setup<br>that <strong>actually works</strong>.</p>
  </div></div>
</section>

<div class="subs" id="subs"></div>
<div class="handle" data-decor>@actually_works.ai</div>
<button class="tapover" id="tap" aria-label="play"><span class="d"></span></button>
</div>
</div>

<div class="ctl">
  <button id="pp" aria-label="Play">▶</button>
  <input id="seek" type="range" min="0" max="20.50" step="0.05" value="0" aria-label="Seek">
  <span id="cur2">0:00</span>
</div>
</div>
</div>

<script src="../export/motion-kit.js"></script>
<script>
(function(){
  var MK=window.MotionKit;
  var DUR=20.50,t=0,playing=false,last=0;
  var frame=document.getElementById('frame');
  var scenes=[].slice.call(frame.querySelectorAll('.scene'));
  var beats=[].slice.call(frame.querySelectorAll('[data-at]'));
  var subs=document.getElementById('subs'),seek=document.getElementById('seek');
  var pp=document.getElementById('pp'),cur2=document.getElementById('cur2');
  var tap=document.getElementById('tap'),prog=document.getElementById('prog');
  var b1=document.getElementById('b1'),b2=document.getElementById('b2'),b3=document.getElementById('b3');

  // Placeholder captions — replace per episode, same as every reel's CUES array.
  var CUES=[
    [0.20,3.80,"Replace me — hook line."],
    [4.10,7.80,"Replace me — quote line."],
    [8.10,11.80,"Replace me — lede line."],
    [12.10,16.30,"Replace me — scoreboard line."],
    [16.60,20.30,"Follow for the setup that actually works."]
  ];

  function fmt(s){s=Math.max(0,Math.floor(s));return Math.floor(s/60)+":"+("0"+(s%60)).slice(-2);}

  // Zoom-through transition (motion-recipes.md recipe 4) between every consecutive
  // scene pair, universally — the repo-wide gap this template exists to close.
  var OUT_DUR=0.42, IN_DUR=0.5, IN_OFFSET=0.16;
  function renderTransitions(){
    for(var i=0;i<scenes.length-1;i++){
      var boundary=+scenes[i].dataset.out;
      var outStart=boundary-OUT_DUR, inStart=outStart+IN_OFFSET;
      MK.zoomThroughTransition(scenes[i], scenes[i+1], t, outStart, inStart, OUT_DUR, IN_DUR);
    }
    // Scene 0 has no incoming pair — hold it fully visible until its own out-transition
    // (the loop above already sets it via the i=0 outEl branch for all t, so nothing
    // extra needed here; last scene's resting "in" state holds the same way).
  }

  function render(){
    var i,e,active=null;
    for(i=0;i<scenes.length;i++){
      var s=scenes[i],on=t>=+s.dataset.in&&t<+s.dataset.out;
      if(on) active=s;
    }
    renderTransitions();
    if(active){
      var f=(t-+active.dataset.in)/((+active.dataset.out)-(+active.dataset.in));
      var kbs=active.querySelectorAll('.kb');
      for(i=0;i<kbs.length;i++) kbs[i].style.transform='scale('+(1+0.06*f).toFixed(4)+')';
    }

    for(i=0;i<beats.length;i++){
      e=beats[i];
      var sc=e.closest('.scene'),until=e.dataset.until?+e.dataset.until:Infinity;
      var vis=sc&&t>=+sc.dataset.in&&t<+sc.dataset.out&&t>=+e.dataset.at&&t<until;
      e.classList.toggle('snap',t<0.30);
      if(vis){ if(e.classList.contains('gone')){e.classList.remove('gone');void e.offsetWidth;} e.classList.add('on'); }
      else { e.classList.remove('on'); e.classList.add('gone'); }
    }

    b1.style.transform='translate('+(2+14*Math.sin(t*0.3))+'cqw,'+(-4+16*Math.cos(t*0.22))+'cqw)';
    b2.style.transform='translate('+(18*Math.cos(t*0.18+1.4))+'cqw,'+(16*Math.sin(t*0.24+.6))+'cqw)';
    b3.style.transform='translate('+(10+18*Math.sin(t*0.15+2.1))+'cqw,'+(-10*Math.cos(t*0.2+1.1))+'cqw)';

    var txt=''; for(i=0;i<CUES.length;i++) if(t>=CUES[i][0]&&t<=CUES[i][1]){txt=CUES[i][2];break;}
    subs.innerHTML=txt;
    prog.style.width=(t/DUR*100)+'%';
    seek.value=t; cur2.textContent=fmt(t);
  }
  function loop(ts){ if(!playing)return; if(!last)last=ts; t+=(ts-last)/1000; last=ts;
    if(t>=DUR){t=DUR;pause();render();return;} render(); requestAnimationFrame(loop); }
  function play(){ if(t>=DUR)t=0; playing=true;last=0;pp.textContent='❚❚';tap.classList.add('hide');requestAnimationFrame(loop); }
  function pause(){ playing=false; pp.textContent='▶'; }
  pp.onclick=function(){playing?pause():play()};
  tap.onclick=play;
  seek.oninput=function(){t=+seek.value;last=0;render();};
  document.addEventListener('keydown',function(ev){ if(ev.key===' '&&ev.target.tagName!=='INPUT'){ev.preventDefault();playing?pause():play();} });
  beats.forEach(function(e){e.classList.add('gone')});
  render();
  if(location.search.indexOf('render=1')>=0){
    document.body.classList.add('render');
    var pre=document.createElement('div'); pre.id='preroll'; document.body.appendChild(pre);
    var _p=play; play=function(){ if(pre&&pre.parentNode) pre.parentNode.removeChild(pre); _p(); };
  }
  window.__reel={play:function(){play();},pause:pause,seek:function(v){t=v;last=0;render();},duration:DUR};
})();
</script>
