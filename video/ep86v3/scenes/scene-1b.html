<script>
window.__e86v3=window.__e86v3||{
 L:function(k){return (((window.__CUES||{}).lines)||[])[k]||null;},
 wt:function(k){const ln=this.L(k);if(!ln)return null;const ws=ln.text.trim().split(/\s+/);
  if(ln.words&&ln.words.length===ws.length)return ln.words.map(x=>[x[0],x[1]]);
  const tot=ws.reduce((a,w)=>a+w.length+1,0),dur=ln.end-ln.start;let t=ln.start;return ws.map(w=>{const a=t;t+=dur*(w.length+1)/tot;return [a,t];});},
 spread:function(els,a,b){const lens=els.map(e=>(e.textContent||'').length+1),tot=lens.reduce((x,y)=>x+y,0);let t=a;return els.map((e,i)=>{const s=t;t+=(b-a)*lens[i]/tot;return s;});}
};
window.buildScene_1=function(tl,T0,DUR){
 const H=window.__e86v3,q=s=>[...document.querySelectorAll(s)],E=T0+DUR;
 tl.set('#s1',{opacity:1,visibility:'visible'},T0);
 tl.fromTo('#c1',{scale:1,x:-3,y:2},{scale:1.015,x:3,y:-3,duration:DUR+1,ease:'sine.inOut'},T0);
 const L0=H.L(0)||{start:.1,end:2.7},w=H.wt(0)||[];
 const W=i=>w[i]||[L0.start+(L0.end-L0.start)*i/9,L0.start+(L0.end-L0.start)*(i+1)/9];
 q('#h1b .w').forEach(el=>{const k=+el.dataset.k;tl.to(el,{opacity:1,duration:.14,ease:'power1.out'},Math.max(T0+.02,W(k)[0]));});
 tl.to('#h1b .red',{rotation:-2,duration:1.2,ease:'sine.inOut',yoyo:true,repeat:2},T0+.2);
 tl.fromTo('#mf',{width:'0%'},{width:'82%',duration:Math.max(1.6,L0.end-T0),ease:'power1.inOut'},T0+.1);
 tl.fromTo('#mq',{opacity:0,scale:.6},{opacity:1,scale:1,duration:.45,ease:'power3.out'},Math.max(T0+.8,W(6)[0]-.3));
 tl.to('#mq',{y:-8,duration:.6,ease:'sine.inOut',yoyo:true,repeat:3},Math.max(T0+1.3,W(6)[0]+.2));
 tl.fromTo('#stkb',{opacity:0,y:30,scale:.9},{opacity:1,y:0,scale:1,duration:.5,ease:'power3.out'},Math.max(T0+.6,W(6)[0]-.1));

 // ---- phase 2: the setup line (lines[1]); phase 1 dips out first
 const L1=H.L(1)||{start:L0.end+.5,end:L0.end+4.7},w2=H.wt(1)||[];
 const W2=i=>w2[i]||[L1.start+(L1.end-L1.start)*i/18,L1.start+(L1.end-L1.start)*(i+1)/18];
 const sw=L1.start-.12;
 tl.to('#ph1',{opacity:0,duration:.25,ease:'power2.inOut'},sw);
 tl.set('#ph1',{visibility:'hidden'},sw+.27);
 tl.set('#ph2',{opacity:1},sw+.24);
 q('#h1s .w').forEach((el,i)=>{tl.fromTo(el,{opacity:0,y:26},{opacity:.45,y:0,duration:.4,ease:'power3.out'},sw+.26+i*.04);
  const k=+el.dataset.k;tl.to(el,{opacity:1,duration:.14,ease:'power1.out'},Math.max(sw+.5,W2(k)[0]));});
 tl.to('#h1s .sel',{rotation:-1.2,duration:1.6,ease:'sine.inOut',yoyo:true,repeat:1},sw+.8);
 const db=document.querySelector('#db1'),txt=db.textContent;
 db.innerHTML=txt.split(' ').map(x=>'<span class="wd">'+[...x].map(c=>'<span class="ch">'+c+'</span>').join('')+'</span>').join(' ');
 const chs=q('#db1 .ch');
 tl.fromTo('#dm1',{opacity:0,y:20},{opacity:1,y:0,duration:.35,ease:'power3.out'},sw+.3);
 const ta=sw+.5,tb=Math.max(ta+1.7,Math.min(W2(11)[0]+.1,E-1.0));
 let ws=0;const wg=chs.map((c,i)=>{const v=1+.5*Math.abs(Math.sin(i*2.1))+(c.textContent===' '?.3:0);ws+=v;return v;});
 let acc=0;chs.forEach((c,i)=>{tl.set(c,{opacity:1},ta+(tb-ta)*acc/ws);acc+=wg[i];});
 const sk=Math.max(tb,W2(13)[0]-.1);
 tl.fromTo('#stk1',{opacity:0,y:30,scale:.9},{opacity:1,y:0,scale:1,duration:.5,ease:'power3.out'},sk);
 tl.to('#stk1 div',{rotation:-2,duration:.9,ease:'sine.inOut',yoyo:true,repeat:Math.max(1,Math.round((E-sk)/.9))},sk+.5);
 q('#strip1 .q').forEach((e,i)=>{tl.to(e,{scale:1.2,duration:.35,ease:'sine.inOut',yoyo:true,repeat:1},T0+.5+i*.25);
  tl.to(e,{scale:1.2,duration:.35,ease:'sine.inOut',yoyo:true,repeat:1},Math.max(sw+1.2,W2(13)[0])+i*.25);});
 q('#strip1 .c').forEach((e,i)=>tl.to(e,{y:i%2?-5:5,duration:Math.max(.8,DUR-.1),ease:'sine.inOut'},T0));
 q('.ser .dd i').forEach((e,i)=>tl.to(e,{scale:1.25,duration:.3,ease:'sine.inOut',yoyo:true,repeat:1},Math.max(sw+1.0,W2(13)[0]+.3)+i*.2));
};
