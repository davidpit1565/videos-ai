<title>Demo — real-photo composite, three moods back to back (disposable, not an episode)</title>
<!--
  DISPOSABLE TEST FILE — not an episode, not for shipping.

  Combines the three approved real-photo composite scenes into one watchable
  file, back to back, so all three can be judged together:
    - scene 1 = test-photo-composite-v2.html (cool/night phone photo, --ember)
    - scene 2 = test-photo-composite-v3.html (warm/daylight laptop photo, --rust)
    - scene 3 = test-photo-composite-v4.html (warm/evening voice-assistant
      photo, --rose) — NEW this round
  Same per-scene text treatment throughout: no opaque box, color-shift
  emphasis only, subtitle-style captions, placement chosen per-photo (see
  each source file's own header comments for the reasoning specific to that
  photo). All three scenes now carry Ken Burns motion on their own .photobg
  layer — a slow, subtle pan/zoom over the scene's own duration, direction
  chosen per photo's own focal point (see each scene's comment below and
  each source file's header for the full reasoning).

  Structure follows video/reel-52.html's multi-scene pattern: each mood is
  its own <section class="scene"> with its OWN nested photobg/grain/gradient
  layers (so the zoom-through transition — MK.zoomThroughTransition, same
  recipe reel-52 uses between its scenes — scales/blurs/fades the whole
  photo+text stack together, not just the text). .subs/.handle/.prog/.tapover
  stay single global overlays per the standing contract; the captions'
  spoken-word highlight color now switches per scene (data-accent on .subs)
  since v2/v3/v4 each use a different accent hue — the two-scene demo's
  earlier version hardcoded ember throughout, a bug this round fixes.

  ROUND 5 CORRECTION (David's real call, made after actually watching this
  file across its own scene transitions, not assumed either way): the
  headline/caption accent used to switch per scene (ember -> rust -> rose)
  on the theory that each photo's own palette deserved its own matching
  hue. Watched back to back as ONE continuous video and compared directly
  against a real shipped episode (any reel-*-kar.html; see
  channel/used-designs.json — every real episode locks ONE brass/ember
  pair for its entire runtime, however much its own scenes' moods vary),
  the per-scene switch reads as three different videos stitched together,
  not one branded piece — the accent stops meaning "this is
  @actually_works.ai" and starts meaning "whatever this scene's photo
  happened to be." A real side-by-side render (same 3 scenes, same
  transitions, only the accent color changed to a single --brass
  throughout) held up fine against all three photos — cool night-blue,
  warm daylight kitchen, warm lamp-lit living room — brass red reads
  clean against every one of them. So: chrome (progress bar, tap-to-play
  ring, scrubber) AND the headline/caption accent now both stay the
  channel's standard --brass red for the WHOLE runtime, same as reel-52
  and every real episode. Per-scene color variety is still fine ACROSS
  separate episodes/demos (a different demo can pick a different single
  color) — just never switching mid-video. v2/v3/v4's own standalone
  single-scene files keep their individual ember/rust/rose accents
  unchanged; this correction is scoped to this combined multi-scene demo,
  where the within-video comparison actually applies.

  Same technical contract as reel-52 / v2 / v3 / v4: .pad/.b/.b.on/.b.gone,
  [data-in]/[data-out]/[data-at], .subs word-lit karaoke captions, window.MotionKit,
  window.__reel, safe-area conventions (top 14%/269px, bottom 35%/672px,
  sides 6%/65px on 1080x1920).
-->

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Assistant:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --ink:#0A0E14;--line:#1F2B3A;
  --brass:#DC2626;--brass-hot:#FF6B6B;--ember:#FBBF24;--rust:#F97316;--rose:#F2617A;
  --text:#FFFFFF;--muted:#8AA0B8;
  --d:'Archivo','Helvetica Neue',Arial,sans-serif;
  --b:'Assistant','Segoe UI',system-ui,sans-serif;
  --m:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box}
body{margin:0;background:#050709;color:var(--text);font-family:var(--b);-webkit-font-smoothing:antialiased}
.page{display:flex;gap:34px;justify-content:center;padding:24px 16px 70px;flex-wrap:wrap;align-items:flex-start}
.reel{width:min(400px,92vw);flex:0 0 auto}
.frame{position:relative;aspect-ratio:9/16;width:100%;overflow:hidden;border-radius:8px;
  container-type:inline-size;background:var(--ink);border:1px solid var(--line)}

.scene{position:absolute;inset:0;z-index:2;will-change:opacity,transform,filter}
.photobg{position:absolute;inset:0;z-index:0;transform-origin:center center;will-change:transform;
  background-size:cover;background-position:center;background-repeat:no-repeat}
.photobg.night{background-image:url('../channel/assets/test-photo-phone-night-fullres.png')}
.photobg.day{background-image:url('../channel/assets/test-photo-laptop-daylight-fullres.png')}
.photobg.evening{background-image:url('../channel/assets/test-photo-voice-evening-facesafe.png')}
@media (prefers-reduced-motion:reduce){.photobg{transition:none!important}}
.grain{position:absolute;inset:0;z-index:1;opacity:.05;pointer-events:none;
  background-image:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 3px)}
/* REVISED — fixed-zone consistency pass (mirrors the same edit made to
   test-photo-composite-v2/v3/v4.html individually; see those files' own
   headers for the full reasoning). Every scene now darkens the SAME
   headline band, y269-650px (14%-33.9% of 1080x1920) — same gradient stop
   percentages in every scene, only the PEAK opacity differs, and that peak
   is a real PIL-measured brightness reading of each photo's own pixels
   inside that exact band, not a guess:
     night (v2) zone brightness 14.8/255  -> peak .33
     day   (v3) zone brightness 153.3/255 -> peak .60
     evening(v4) zone brightness 42.9/255 -> peak .38
   Bottom bands (behind captions) are untouched, copied verbatim from each
   source file same as before.

   ROUND 5 UPDATE (evening/v4 scene only): the source photo changed to
   test-photo-voice-evening-facesafe.png (real Adobe generative-expand +
   crop fix — face pushed 280px lower in frame, verified clear of the
   headline zone; see test-photo-composite-v4.html's own header for the
   full pipeline and re-measured bbox). The evening gradient below is
   re-tuned to match: it now stays fully transparent from 35% to 56% (the
   photo's real quiet zone above the face, and then the face itself, which
   this style's convention never darkens), then picks the pre-existing
   hand/speaker shape back up shifted +14.6 percentage points (280px of the
   1920px frame) since that's exactly how far those real pixels moved. */
.photogradient.night{position:absolute;inset:0;z-index:1;pointer-events:none;
  background:
    linear-gradient(180deg, rgba(3,5,7,.33) 0%, rgba(3,5,7,.28) 12%, rgba(3,5,7,.17) 24%, rgba(3,5,7,.05) 34%, transparent 40%, rgba(3,5,7,.22) 54%, rgba(3,5,7,.55) 63%, rgba(3,5,7,.30) 72%, transparent 82%)}
.photogradient.day{position:absolute;inset:0;z-index:1;pointer-events:none;
  background:
    linear-gradient(180deg, rgba(4,3,2,.60) 0%, rgba(4,3,2,.51) 12%, rgba(4,3,2,.30) 24%, rgba(4,3,2,.09) 34%, transparent 40%, transparent 50%, rgba(4,3,2,.14) 57%, rgba(4,3,2,.48) 66%, rgba(4,3,2,.74) 76%, rgba(4,3,2,.82) 100%)}
.photogradient.evening{position:absolute;inset:0;z-index:1;pointer-events:none;
  background:
    linear-gradient(180deg, rgba(6,4,3,.40) 0%, rgba(6,4,3,.34) 10%, rgba(6,4,3,.20) 20%, rgba(6,4,3,.08) 30%, transparent 35%, transparent 56%, rgba(6,4,3,.10) 56.6%, rgba(6,4,3,.58) 62.6%, rgba(6,4,3,.68) 67.6%, rgba(6,4,3,.40) 72.6%, rgba(6,4,3,.30) 78.6%, rgba(6,4,3,.62) 86.6%, rgba(6,4,3,.76) 96.6%, rgba(6,4,3,.80) 100%)}
.prog{position:absolute;left:0;top:0;height:.9cqw;background:var(--brass);z-index:14;width:0;
  box-shadow:0 0 3cqw rgba(220,38,38,.7)}

/* REVISED — every scene shares ONE headline zone now (27cqw padding-top =
   291.6px, just inside the 269px top safe line). This is the fix for the
   exact inconsistency David flagged: the headline used to land at a
   different padding-top per scene (26cqw / 29cqw / 76cqw) depending on
   where that photo happened to leave room, which read as sloppy scene to
   scene. The .pad.day override that used to bump the daylight scene down
   to 29cqw is gone on purpose. */
.pad{position:absolute;inset:0;z-index:2;padding:27cqw 10cqw 0;display:flex;flex-direction:column;
  justify-content:flex-start;align-items:center;text-align:center;gap:2.4cqw}
.kb{will-change:transform;width:100%}

.b{opacity:0;transform:translateY(2cqw) scale(.94);transition:opacity .16s ease,transform .22s cubic-bezier(.2,1.4,.4,1)}
.b.snap{transition:none}
.b.on{opacity:1;transform:none}
.b.gone{display:none!important}
@media (prefers-reduced-motion:reduce){.b,.kb{transition-duration:1ms!important}}

h2{font-family:var(--d);font-weight:900;font-size:8.4cqw;line-height:1.14;letter-spacing:-.02em;
  margin:0;text-wrap:balance;position:relative;z-index:2;color:var(--text);
  text-shadow:0 .5cqw 1.4cqw rgba(0,0,0,.92),0 .15cqw .4cqw rgba(0,0,0,.95),0 0 5cqw rgba(0,0,0,.5)}
/* Emphasis = color+weight shift only, no box shape — same convention all
   three scenes. ROUND 5: accent is now ONE color (--brass) for the whole
   video, not a per-scene hue — see the ROUND 5 CORRECTION note at the top
   of this file for the real side-by-side comparison behind this change.
   The .ember/.rust/.rose classes stay in the markup (harmless, unused
   here) so v2/v3/v4's own standalone files are unaffected. */
h2 .box{font-weight:900;background:none;border:0;padding:0;
  border-radius:0;display:inline;transform:none;text-shadow:0 .5cqw 1.4cqw rgba(0,0,0,.95),0 0 4cqw rgba(0,0,0,.6)}
h2 .box.ember{color:var(--brass)}
h2 .box.rust{color:var(--brass)}
h2 .box.rose{color:var(--brass)}

/* Font-size aligned to this codebase's own real production convention —
   export/karaoke.py's shipped .subs block (see any reel-*-kar.html, e.g.
   reel-52-kar.html) sets 7.4cqw, not 5.6cqw. */
.subs{position:absolute;left:8cqw;right:8cqw;bottom:62cqw;text-align:center;z-index:11;
  font-family:var(--b);font-weight:600;font-size:7.4cqw;line-height:1.22;letter-spacing:0;
  text-shadow:0 .4cqw 1.2cqw rgba(0,0,0,.95),0 0 2.4cqw rgba(0,0,0,.9)}
.subs b{font-weight:700;color:#fff;transition:color .09s linear;display:inline}
/* ROUND 5: caption highlight is now the same --brass for every scene too,
   matching the headline accent fix above — one accent color for the
   video's whole runtime. data-accent stays on #subs (harmless, unused for
   color now) so the per-scene wiring in the script below doesn't need
   touching. */
.subs[data-accent="ember"] b.on{color:var(--brass)}
.subs[data-accent="rust"] b.on{color:var(--brass)}
.subs[data-accent="rose"] b.on{color:var(--brass)}
.handle{position:absolute;left:0;right:0;bottom:14cqw;text-align:center;z-index:11;
  font-family:var(--m);font-size:2.6cqw;letter-spacing:.28em;text-transform:uppercase;color:#CBD5E1;
  text-shadow:0 .3cqw 1cqw rgba(0,0,0,.9)}
.tapover{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:rgba(5,7,9,.72);border:0;width:100%;color:var(--text)}
.tapover.hide{display:none}
.tapover .d{width:17cqw;height:17cqw;border-radius:50%;border:.7cqw solid var(--brass);display:grid;place-items:center}
.tapover .d::after{content:"";border-left:4.8cqw solid var(--brass);border-top:2.9cqw solid transparent;border-bottom:2.9cqw solid transparent;margin-inline-start:1.5cqw}

.ctl{display:flex;align-items:center;gap:11px;margin-top:11px}
.ctl input{flex:1;-webkit-appearance:none;appearance:none;background:transparent;height:20px;cursor:pointer;margin:0}
.ctl input::-webkit-slider-runnable-track{height:3px;background:#1B2735;border-radius:2px}
.ctl input::-moz-range-track{height:3px;background:#1B2735;border-radius:2px}
.ctl input::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--brass);margin-top:-4.5px}
.ctl input::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--brass)}
.ctl button{background:var(--brass);color:#fff;border:0;border-radius:3px;width:40px;height:31px;font-size:13px;font-weight:700;cursor:pointer}
.ctl span{font-family:var(--m);font-size:12px;color:var(--muted)}
button:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:3px}

body.render{background:#000;overflow:hidden}
#preroll{position:fixed;inset:0;background:#000;z-index:9999}
body.render .page{padding:0;gap:0;display:block}
body.render .ctl,body.render .tapover,body.render .prog{display:none!important}
body.render .reel{width:100vw;max-width:none}
body.render .frame{width:100vw;height:100vh;aspect-ratio:auto;border:0;border-radius:0}
</style>

<div class="page">

<!-- HONEST EXCEPTION: this scene's headline now sits at the SAME fixed zone
     as scenes 1 and 2 (consistent position — the whole point of this pass),
     but this photo's own face (real Adobe detection, bbox
     x.4667/y.2036/w.275/h.2172 -> y391-808px, 20.4%-42.1%) overlaps that
     zone by 259px / 68% of the zone's height. Text now partially crosses
     the face — see this session's report for the measured trade-off and
     why a same-session photo-regeneration attempt (Canva generate-image)
     was blocked by a rate limit, not silently swapped for something else. -->
<section class="scene" data-in="15.60" data-out="23.10">
  <div class="photobg evening" id="photobgC"></div>
  <div class="grain" data-decor></div>
  <div class="photogradient evening"></div>
  <div class="pad"><div class="kb" id="hookKbC">
    <h2 id="hookH2C">It's listening for <span class="box rose">more than your question</span>.</h2>

<script src="../export/motion-kit.js"></script>
<script>
(function(){
  var MK=window.MotionKit;
  var DUR=23.10,t=0,playing=false,last=0;
  var frame=document.getElementById('frame');
  var scenes=[].slice.call(frame.querySelectorAll('.scene'));
  var subs=document.getElementById('subs'),seek=document.getElementById('seek');
  var pp=document.getElementById('pp'),cur2=document.getElementById('cur2');
  var tap=document.getElementById('tap'),prog=document.getElementById('prog');

  // Combined captions: scene 1's cues verbatim (v2), scene 2's (v3) shifted
  // by scene 1's 8.00s duration, scene 3's (v4) shifted by scenes 1+2's
  // 15.60s combined duration.
  var CUES=[
    [0.30,1.60,"You just gave it"],
    [1.60,2.90,"more than"],
    [2.90,4.20,"you think."],
    [4.30,7.20,"Every chat trains its memory of you."],
    [8.30,9.70,"It's already reading"],
    [9.70,11.00,"more than"],
    [11.00,12.30,"your messages."],
    [12.40,15.50,"Every file it can open becomes part of what it knows."],
    [15.90,17.20,"It's listening"],
    [17.20,18.50,"for more than"],
    [18.50,19.80,"your question."],
    [19.90,23.00,"Every word in the room becomes something it can recall."]
  ];
  // CUES above is now used only to gate WHEN a caption should be showing
  // (see the inLine window in render()) — the actual text comes from the
  // WORDS karaoke array below. Accent is derived from the word's own
  // chunk id range (scene A: 0-6, scene B: 7-15, scene C: 16-22).

  // Real word-by-word karaoke captions, replacing the static full-sentence
  // text this demo used to show. Same mechanism export/karaoke.py wires
  // into a real episode build. None of these three scenes has real
  // narration audio (the copy is made-up test text — there is no Whisper
  // transcript to align against), so these are HAND-AUTHORED PLACEHOLDER
  // TIMESTAMPS: each source scene's own CUES duration split evenly across
  // its words (see test-photo-composite-v2/v3/v4.html, whose per-scene
  // WORDS arrays these are, shifted by that scene's start offset: +0,
  // +8.00, +15.60). This is NOT real audio-aligned data, and hand-split
  // timing reads more metronomic/regular than real Whisper alignment would
  // — a real episode always runs export/karaoke.py against actual word
  // stamps instead of this.
  var WORDS=[
    // scene A (v2, night/phone, --ember) — chunks 0-6
    [0.30,0.63,"You",0],[0.63,0.95,"just",0],
    [0.95,1.28,"gave",1],[1.28,1.60,"it",1],
    [1.60,2.25,"more",2],[2.25,2.90,"than",2],
    [2.90,3.55,"you",3],[3.55,4.20,"think.",3],
    [4.30,4.71,"Every",4],[4.71,5.13,"chat",4],[5.13,5.54,"trains",4],
    [5.54,5.96,"its",5],[5.96,6.37,"memory",5],
    [6.37,6.79,"of",6],[6.79,7.20,"you.",6],
    // scene B (v3, day/laptop, --rust) — chunks 7-15, +8.00s offset
    [8.30,8.77,"It's",7],[8.77,9.23,"already",7],
    [9.23,9.70,"reading",8],[9.70,10.35,"more",8],
    [10.35,11.00,"than",9],[11.00,11.65,"your",9],
    [11.65,12.30,"messages.",10],
    [12.30,12.68,"Every",11],[12.68,12.96,"file",11],[12.96,13.25,"it",11],
    [13.25,13.53,"can",12],[13.53,13.81,"open",12],
    [13.81,14.09,"becomes",13],[14.09,14.37,"part",13],
    [14.37,14.65,"of",14],[14.65,14.94,"what",14],
    [14.94,15.22,"it",15],[15.22,15.50,"knows.",15],
    // scene C (v4, evening/voice, --rose) — chunks 16-22, +15.60s offset
    [15.90,16.55,"It's",16],[16.55,17.20,"listening",16],
    [17.20,17.63,"for",17],[17.63,18.07,"more",17],[18.07,18.50,"than",17],
    [18.50,19.15,"your",18],[19.15,19.80,"question.",18],
    [19.90,20.22,"Every",19],[20.22,20.54,"word",19],[20.54,20.86,"in",19],
    [20.86,21.18,"the",20],[21.18,21.50,"room",20],[21.50,21.82,"becomes",20],
    [21.82,22.14,"something",21],[22.14,22.46,"it",21],
    [22.46,22.78,"can",22],[22.78,23.10,"recall.",22]
  ];

  function fmt(s){s=Math.max(0,Math.floor(s));return Math.floor(s/60)+":"+("0"+(s%60)).slice(-2);}

  // Ken Burns per scene — direction re-derived from each photo's own focal
  // point (see each source file's header for the full reasoning):
  //   night/phone (v2):   phone is near-center X, above-center Y -> drift
  //                       toward more-top (+Y), near-zero X.
  //   day/laptop (v3):    hands+laptop are slightly right+below center ->
  //                       drift toward more-right, more-bottom (-X,-Y).
  //   evening/voice (v4): the speaker's glow ring is lower-left -> drift
  //                       toward more-left, more-bottom (+X,-Y).
  var photobgA=document.getElementById('photobgA');
  var photobgB=document.getElementById('photobgB');
  var photobgC=document.getElementById('photobgC');
  var KB_A={toScale:1.07,toX:0.5,toY:1.2};
  var KB_B={toScale:1.07,toX:-0.8,toY:-1.0};
  var KB_C={toScale:1.08,toX:1.4,toY:-1.2};

  function makeHook(kbId,h2Id){
    var kb=document.getElementById(kbId);
    var h2=document.getElementById(h2Id);
    var scene=h2.closest('.scene');
    var split=MK.splitWordsSafe(h2);
    var climax=null;
    for(var i=0;i<split.words.length;i++){
      if(split.words[i].classList.contains('box')){ climax=split.words[i]; break; }
    }
    var climaxIndex=climax?split.words.indexOf(climax):-1;
    return function render(){
      var ht=t-(+scene.dataset.in);
      var START=0.15,GAP=0.10,DUR2=0.30;
      for(var i=0;i<split.words.length;i++){
        var w=split.words[i],at=START+i*GAP;
        if(w===climax){
          MK.animatePop(w,ht,at,DUR2);
        } else {
          var e=MK.smoothIn(MK.clamp01((ht-at)/DUR2));
          w.style.opacity=String(e);
          w.style.transform='translateY('+(14*(1-e)).toFixed(2)+'px)';
        }
      }
      if(climaxIndex>=0){
        var climaxAt=START+climaxIndex*GAP;
        var camScale=MK.multiPhaseCamera(ht,{settleDur:0.4,pullBack:0.98,pushAt:climaxAt,pushDur:0.9,pushTo:1.05});
        kb.style.transform='scale('+camScale.toFixed(4)+')';
      }
    };
  }
  var renderHookA=makeHook('hookKbA','hookH2A');
  var renderHookB=makeHook('hookKbB','hookH2B');
  var renderHookC=makeHook('hookKbC','hookH2C');

  // Zoom-through transition between scenes — same recipe/timing reel-52
  // uses between its scenes. With only two scenes, MK.zoomThroughTransition
  // can be called once per adjacent pair and each scene is either the outEl
  // or the inEl of exactly one call, so nothing conflicts. With THREE
  // scenes, the middle scene is the inEl of one pair AND the outEl of the
  // next — calling zoomThroughTransition once per pair independently means
  // the second call's "resting" branches (t < outStart -> opacity 1; t <
  // inStart -> opacity 0) unconditionally overwrite whatever the first
  // call already set for that same middle scene, even at times nowhere
  // near the second transition. That clobbering is exactly what showed
  // scene B's photo at t=0 in an early version of this file. Fixed by
  // resolving each scene's own opacity/transform/filter from ITS OWN
  // incoming and outgoing transition windows only, once per scene, instead
  // of letting two independent pairwise calls both write to it.
  var OUT_DUR=0.42, IN_DUR=0.5, IN_OFFSET=0.16;
  function renderScene(i){
    var scene=scenes[i];
    var prev=i>0?scenes[i-1]:null;
    var next=i<scenes.length-1?scenes[i+1]:null;
    var outTime=+scene.dataset.out;
    var inStart=-Infinity, inEndsAt=-Infinity;
    if(prev){
      var prevOutStart=+prev.dataset.out-OUT_DUR;
      inStart=prevOutStart+IN_OFFSET;
      inEndsAt=inStart+IN_DUR;
    }
    var outStart=next?outTime-OUT_DUR:Infinity;

    var opacity,scale,blur;
    if(prev && t<inStart){
      opacity=0; scale=0.94; blur=5;
    } else if(prev && t<inEndsAt){
      var ie=MK.smoothIn(MK.clamp01((t-inStart)/IN_DUR));
      opacity=ie; scale=0.94+0.06*ie; blur=5*(1-ie);
    } else if(next && t>=outStart && t<outTime){
      var oe=MK.smoothIn(MK.clamp01((t-outStart)/OUT_DUR));
      opacity=1-oe; scale=1+0.16*oe; blur=5*oe;
    } else if(next && t>=outTime){
      opacity=0; scale=1.16; blur=5;
    } else {
      opacity=1; scale=1; blur=0;
    }
    scene.style.opacity=String(opacity);
    scene.style.transform='scale('+scale.toFixed(4)+')';
    scene.style.filter='blur('+blur.toFixed(1)+'px)';
  }
  function renderTransitions(){
    for(var i=0;i<scenes.length;i++) renderScene(i);
  }

  function render(){
    var i;
    renderTransitions();
    renderHookA();
    renderHookB();
    renderHookC();

    photobgA.style.transform=MK.kenBurns(t-(+scenes[0].dataset.in),+scenes[0].dataset.out-(+scenes[0].dataset.in),KB_A);
    photobgB.style.transform=MK.kenBurns(t-(+scenes[1].dataset.in),+scenes[1].dataset.out-(+scenes[1].dataset.in),KB_B);
    photobgC.style.transform=MK.kenBurns(t-(+scenes[2].dataset.in),+scenes[2].dataset.out-(+scenes[2].dataset.in),KB_C);

    // Word-by-word karaoke render (same mechanism as v2/v3/v4 standalone
    // files, see the WORDS comment above): the chunk on screen is the one
    // the last-started word belongs to, held until the next chunk's first
    // word, and the currently-spoken word gets class="on" (color-shift
    // only, no box). Accent color follows whichever scene's chunk range
    // the visible word belongs to.
    var inLine=false;
    for(i=0;i<CUES.length;i++) if(t>=CUES[i][0]-0.32&&t<=CUES[i][1]+0.15){inLine=true;break;}
    if(t>CUES[CUES.length-1][1]) inLine=true;
    var here=-1,cur=-1;
    for(i=0;i<WORDS.length;i++) if(WORDS[i][0]<=t+0.08){ here=WORDS[i][3]; cur=i; }
    var txt='',accent='ember';
    if(inLine&&here>=0){
      accent = here<7 ? 'ember' : (here<16 ? 'rust' : 'rose');
      for(i=0;i<WORDS.length;i++) if(WORDS[i][3]===here)
        txt+=(i===cur?'<b class="on">':'<b>')+WORDS[i][2]+'</b>  ';
    }
    subs.innerHTML=txt;
    subs.setAttribute('data-accent',accent);
    prog.style.width=(t/DUR*100)+'%';
    seek.value=t; cur2.textContent=fmt(t);
  }
  function loop(ts){ if(!playing)return; if(!last)last=ts; t+=(ts-last)/1000; last=ts;
    if(t>=DUR){t=DUR;pause();render();return;} render(); requestAnimationFrame(loop); }
  function play(){ if(t>=DUR)t=0; playing=true;last=0;pp.textContent='❚❚';tap.classList.add('hide');requestAnimationFrame(loop); }
  function pause(){ playing=false; pp.textContent='▶'; }
  pp.onclick=function(){playing?pause():play()};
  tap.onclick=play;
  seek.oninput=function(){t=+seek.value;last=0;render();};
  document.addEventListener('keydown',function(ev){ if(ev.key===' '&&ev.target.tagName!=='INPUT'){ev.preventDefault();playing?pause():play();} });
  render();
  if(location.search.indexOf('render=1')>=0){
    document.body.classList.add('render');
    var pre=document.createElement('div'); pre.id='preroll'; document.body.appendChild(pre);
    var _p=play; play=function(){ if(pre&&pre.parentNode) pre.parentNode.removeChild(pre); _p(); };
  }
  window.__reel={play:function(){play();},pause:pause,seek:function(v){t=v;last=0;render();},duration:DUR};
})();
</script>
