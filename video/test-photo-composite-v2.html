<title>Test — real-photo composite v2, no opaque box (disposable, not an episode)</title>
<!--
  DISPOSABLE TEST FILE — not an episode, not for shipping.

  ROUND 2. Round 1 (test-photo-composite.html) proved the photo itself reads as
  genuinely different from the channel's all-CSS style — but the moment the
  existing `.box` treatment (opaque red rectangle, heavy border) landed on top
  of it, the frame reverted to looking like the same "AI template" every other
  episode uses. The opaque graphic shape sitting on a real photo is what killed
  it, not the photo.

  This build keeps the same photo, same copy, same technical contract, and
  changes ONLY the text treatment:
    - no opaque background rectangle behind any text, anywhere
    - no heavy border / no "card" or "chip" shape
    - headline emphasis via color + weight shift on the key phrase, not a box
      (still uses .box as the CLASS NAME so splitWordsSafe()/animatePop() in
      motion-kit.js treat it as one atomic climax word — but .box now carries
      no background, no border, no rotation; it is a color/weight change only)
    - legibility comes from (a) deliberate placement — headline sits ABOVE the
      phone's bright screen, captions sit BELOW it, so text never overlaps the
      one bright element in the frame — plus (b) text-shadow, plus (c) a soft
      gradient darkening only the top and bottom bands, left fully transparent
      over the phone itself so the photo's real subject stays visible
    - captions restyled as plain subtitles: sentence case, medium weight, no
      forced uppercase, no bold "caption card" look — spoken word highlighted
      by color shift only

  Source image: channel/assets/test-photo-phone-night-fullres.png — real
  1080x1920 full-resolution photo (the round-1 112x199 thumbnail problem is
  resolved; this is the actual asset).

  Same contract as reel-52.html / round 1: .pad/.b/.b.on/.b.gone,
  [data-in]/[data-out]/[data-at], .subs word-lit karaoke captions, window.MotionKit,
  window.__reel, safe-area conventions (top 14%/269px, bottom 35%/672px,
  sides 6%/65px on 1080x1920).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Assistant:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --ink:#0A0E14;--line:#1F2B3A;
  --brass:#DC2626;--brass-hot:#FF6B6B;--ember:#FBBF24;
  --text:#FFFFFF;--muted:#8AA0B8;
  --d:'Archivo','Helvetica Neue',Arial,sans-serif;
  --b:'Assistant','Segoe UI',system-ui,sans-serif;
  --m:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box}
body{margin:0;background:#050709;color:var(--text);font-family:var(--b);-webkit-font-smoothing:antialiased}
.page{display:flex;gap:34px;justify-content:center;padding:24px 16px 70px;flex-wrap:wrap;align-items:flex-start}
.reel{width:min(400px,92vw);flex:0 0 auto}
.frame{position:relative;aspect-ratio:9/16;width:100%;overflow:hidden;border-radius:8px;
  container-type:inline-size;background:var(--ink);border:1px solid var(--line)}

/* real-photo background, full-bleed cover. The source is exactly 1080x1920 —
   the same aspect as the frame — so cover+center shows the whole photo with
   no crop, unlike round 1's upscaled placeholder which needed an off-center
   position to hide its softness. */
.photobg{position:absolute;inset:0;z-index:0;transform-origin:center center;will-change:transform;
  background-image:url('../channel/assets/test-photo-phone-night-fullres.png');
  background-size:cover;background-position:center;background-repeat:no-repeat}
@media (prefers-reduced-motion:reduce){.photobg{transition:none!important}}

/* REVISED — fixed-zone consistency pass (see CLAUDE.md-adjacent session
   notes): the headline no longer sits wherever THIS photo's clutter happens
   to allow. Every scene in this style now uses the SAME headline zone,
   y269-650px (14%-33.9% of 1080x1920, .pad padding-top:27cqw, h2 font
   8.4cqw) — chosen because it sits inside the platform's own top-14% safe
   line and clears every one of this style's three photos' subjects (v2/v3
   have no face/subject in that band at all; v4's does, see its own file's
   notes for the honest exception). The top gradient's SHAPE (stop
   percentages) is now shared across every scene too, so the darkened band's
   edge lands at the same y in every scene, not just the text. Only the PEAK
   opacity differs per photo, and it is a real measured number, not a guess:
   PIL brightness of THIS photo's actual pixels inside the fixed zone was
   14.8/255 -> peak .33 (dark night scene needs little darkening). The
   bottom band (behind captions) is untouched from round 2 — this pass is
   about the headline only. */
.photogradient{position:absolute;inset:0;z-index:1;pointer-events:none;
  background:
    linear-gradient(180deg, rgba(3,5,7,.33) 0%, rgba(3,5,7,.28) 12%, rgba(3,5,7,.17) 24%, rgba(3,5,7,.05) 34%, transparent 40%, rgba(3,5,7,.22) 54%, rgba(3,5,7,.55) 63%, rgba(3,5,7,.30) 72%, transparent 82%)}
.grain{position:absolute;inset:0;z-index:1;opacity:.05;pointer-events:none;
  background-image:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 3px)}
.prog{position:absolute;left:0;top:0;height:.9cqw;background:var(--brass);z-index:14;width:0;
  box-shadow:0 0 3cqw rgba(220,38,38,.7)}

.scene{position:absolute;inset:0;z-index:2}
/* Headline sits high — just below the top safe line (269px / 14%) — which in
   this photo is the dark window/wall area, well above the phone's screen
   (roughly y 570-950px on a 1920-tall frame). Captions sit low, in the
   hands/lap area, well below the phone and still above the 1248px bottom
   safe line. Nothing sits over the bright phone glow itself. */
/* Fixed headline zone (all scenes in this style share this padding-top and
   font-size now — see .photogradient's comment above): 27cqw = 291.6px,
   just inside the 269px top safe line. */
.pad{position:absolute;inset:0;padding:27cqw 10cqw 0;display:flex;flex-direction:column;
  justify-content:flex-start;align-items:center;text-align:center;gap:2.4cqw}
.kb{will-change:transform;width:100%}

.b{opacity:0;transform:translateY(2cqw) scale(.94);transition:opacity .16s ease,transform .22s cubic-bezier(.2,1.4,.4,1)}
.b.snap{transition:none}
.b.on{opacity:1;transform:none}
.b.gone{display:none!important}
@media (prefers-reduced-motion:reduce){.b,.kb{transition-duration:1ms!important}}

h2{font-family:var(--d);font-weight:900;font-size:8.4cqw;line-height:1.14;letter-spacing:-.02em;
  margin:0;text-wrap:balance;position:relative;z-index:2;color:var(--text);
  text-shadow:0 .5cqw 1.4cqw rgba(0,0,0,.92),0 .15cqw .4cqw rgba(0,0,0,.95),0 0 5cqw rgba(0,0,0,.5)}
/* Emphasis is a color + weight shift on the key phrase, not a background
   shape: no fill, no border, no rotation, no padding, nothing that reads as
   a UI chip sitting on the photo. */
h2 .box{color:var(--ember);font-weight:900;background:none;border:0;padding:0;
  border-radius:0;display:inline;transform:none;text-shadow:0 .5cqw 1.4cqw rgba(0,0,0,.95),0 0 4cqw rgba(0,0,0,.6)}

/* Captions restyled as plain subtitles: sentence case (no forced uppercase),
   medium weight, no bold "caption card" look. The spoken word is picked out
   by color only — same convention as the karaoke .subs system elsewhere, but
   without the heavy weight/size jump that made round 1's captions read as a
   graphic overlay rather than a subtitle. */
/* Font-size aligned to this codebase's own real production convention —
   export/karaoke.py's shipped .subs block (see any reel-*-kar.html, e.g.
   reel-52-kar.html) sets 7.4cqw, not 5.6cqw. This test file's captions
   were under-sized relative to what actually ships; sentence-case,
   color-shift-only styling (this style's own deliberate deviation from
   production's uppercase+box look) is kept, only the size is aligned. */
.subs{position:absolute;left:8cqw;right:8cqw;bottom:62cqw;text-align:center;z-index:11;
  font-family:var(--b);font-weight:600;font-size:7.4cqw;line-height:1.22;letter-spacing:0;
  text-shadow:0 .4cqw 1.2cqw rgba(0,0,0,.95),0 0 2.4cqw rgba(0,0,0,.9)}
.subs b{font-weight:700;color:#fff;transition:color .09s linear;display:inline}
.subs b.on{color:var(--ember)}
.handle{position:absolute;left:0;right:0;bottom:14cqw;text-align:center;z-index:11;
  font-family:var(--m);font-size:2.6cqw;letter-spacing:.28em;text-transform:uppercase;color:#CBD5E1;
  text-shadow:0 .3cqw 1cqw rgba(0,0,0,.9)}
.tapover{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:rgba(5,7,9,.72);border:0;width:100%;color:var(--text)}
.tapover.hide{display:none}
.tapover .d{width:17cqw;height:17cqw;border-radius:50%;border:.7cqw solid var(--brass);display:grid;place-items:center}
.tapover .d::after{content:"";border-left:4.8cqw solid var(--brass);border-top:2.9cqw solid transparent;border-bottom:2.9cqw solid transparent;margin-inline-start:1.5cqw}

.ctl{display:flex;align-items:center;gap:11px;margin-top:11px}
.ctl input{flex:1;-webkit-appearance:none;appearance:none;background:transparent;height:20px;cursor:pointer;margin:0}
.ctl input::-webkit-slider-runnable-track{height:3px;background:#1B2735;border-radius:2px}
.ctl input::-moz-range-track{height:3px;background:#1B2735;border-radius:2px}
.ctl input::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--brass);margin-top:-4.5px}
.ctl input::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--brass)}
.ctl button{background:var(--brass);color:#fff;border:0;border-radius:3px;width:40px;height:31px;font-size:13px;font-weight:700;cursor:pointer}
.ctl span{font-family:var(--m);font-size:12px;color:var(--muted)}
button:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:3px}

body.render{background:#000;overflow:hidden}
#preroll{position:fixed;inset:0;background:#000;z-index:9999}
body.render .page{padding:0;gap:0;display:block}
body.render .ctl,body.render .tapover,body.render .prog{display:none!important}
body.render .reel{width:100vw;max-width:none}
body.render .frame{width:100vw;height:100vh;aspect-ratio:auto;border:0;border-radius:0}
</style>

<div class="page">
<div class="reel">
<div class="frame" id="frame">
<div class="photobg" id="photobg"></div>
<div class="grain" data-decor></div>
<div class="photogradient"></div>
<div class="prog" id="prog"></div>

<section class="scene" data-in="0" data-out="7.50">
  <div class="pad"><div class="kb" id="hookKb">
    <h2 id="hookH2">You just gave it <span class="box">more than you think</span>.</h2>
  </div></div>
</section>

<div class="subs" id="subs"></div>
<div class="handle" data-decor>@actually_works.ai</div>
<button class="tapover" id="tap" aria-label="play"><span class="d"></span></button>
</div>
</div>

<div class="ctl">
  <button id="pp" aria-label="Play">▶</button>
  <input id="seek" type="range" min="0" max="7.50" step="0.05" value="0" aria-label="Seek">
  <span id="cur2">0:00</span>
</div>
</div>
</div>

<script src="../export/motion-kit.js"></script>
<script>
(function(){
  var MK=window.MotionKit;
  var DUR=7.50,t=0,playing=false,last=0;
  var frame=document.getElementById('frame');
  var scenes=[].slice.call(frame.querySelectorAll('.scene'));
  var beats=[].slice.call(frame.querySelectorAll('[data-at]'));
  var subs=document.getElementById('subs'),seek=document.getElementById('seek');
  var pp=document.getElementById('pp'),cur2=document.getElementById('cur2');
  var tap=document.getElementById('tap'),prog=document.getElementById('prog');

  // Plain-subtitle captions — sentence case, same words/timing as round 1,
  // just no longer forced uppercase (the .subs CSS no longer sets
  // text-transform:uppercase either).
  var CUES=[
    [0.30,1.60,"You just gave it"],
    [1.60,2.90,"more than"],
    [2.90,4.20,"you think."],
    [4.30,7.20,"Every chat trains its memory of you."]
  ];

  // ROUND 2b — real word-by-word karaoke captions, replacing the static
  // full-sentence text above. This scene has no real narration audio (the
  // copy is made-up test text, so there is no Whisper transcript to align
  // against), so these are HAND-AUTHORED PLACEHOLDER TIMESTAMPS: each
  // line's known duration (from CUES above) divided evenly across its
  // words, NOT real audio-aligned data from export/karaoke.py. A real
  // episode would run export/karaoke.py against actual Whisper word
  // stamps, which land unevenly (consonant-heavy words take longer,
  // function words are clipped) — this even split is a stand-in for that,
  // and reads slightly more metronomic/regular than real narration will.
  // Same DOM/CSS contract as export/karaoke.py emits: [start,end,word,chunkId],
  // chunks of 2-3 words, the currently-spoken word gets class="on" (color
  // shift via .subs b.on, no box), a chunk holds until the next chunk's
  // first word starts.
  var WORDS=[
    [0.30,0.63,"You",0],[0.63,0.95,"just",0],
    [0.95,1.28,"gave",1],[1.28,1.60,"it",1],
    [1.60,2.25,"more",2],[2.25,2.90,"than",2],
    [2.90,3.55,"you",3],[3.55,4.20,"think.",3],
    [4.30,4.71,"Every",4],[4.71,5.13,"chat",4],[5.13,5.54,"trains",4],
    [5.54,5.96,"its",5],[5.96,6.37,"memory",5],
    [6.37,6.79,"of",6],[6.79,7.20,"you.",6]
  ];

  function fmt(s){s=Math.max(0,Math.floor(s));return Math.floor(s/60)+":"+("0"+(s%60)).slice(-2);}

  // Ken Burns: this photo's focal subject (the phone screen) sits close to
  // frame-center horizontally but ABOVE vertical-center (screen roughly
  // y570-950 of 1920, i.e. ~30-49%, center ~40% vs the frame's 50%) — so the
  // slow drift reveals slightly more of the TOP of the image (positive Y) to
  // creep toward it, with only a hair of X drift (phone is already near-
  // center horizontally). Kept to a small scale (1.0->1.07) and tiny pan
  // (<=1.2%) over the full 7.5s so it reads as a living photograph, not a
  // documentary zoom — see motion-kit.js's kenBurns() for the sign convention.
  var photobg=document.getElementById('photobg');

  var hookKb=document.getElementById('hookKb');
  var hookH2=document.getElementById('hookH2');
  var hookScene=hookH2.closest('.scene');
  var hookSplit=MK.splitWordsSafe(hookH2);
  var hookClimax=null;
  for(var hi=0;hi<hookSplit.words.length;hi++){
    var hw=hookSplit.words[hi];
    if(hw.classList.contains('box')){ hookClimax=hw; break; }
  }
  var hookClimaxIndex=hookClimax?hookSplit.words.indexOf(hookClimax):-1;

  function renderHook(){
    var ht=t-(+hookScene.dataset.in);
    var START=0.15,GAP=0.10,DUR2=0.30;
    for(var i=0;i<hookSplit.words.length;i++){
      var w=hookSplit.words[i],at=START+i*GAP;
      if(w===hookClimax){
        MK.animatePop(w,ht,at,DUR2);
      } else {
        var e=MK.smoothIn(MK.clamp01((ht-at)/DUR2));
        w.style.opacity=String(e);
        w.style.transform='translateY('+(14*(1-e)).toFixed(2)+'px)';
      }
    }
    if(hookClimaxIndex>=0){
      var climaxAt=START+hookClimaxIndex*GAP;
      var camScale=MK.multiPhaseCamera(ht,{settleDur:0.4,pullBack:0.98,pushAt:climaxAt,pushDur:0.9,pushTo:1.05});
      hookKb.style.transform='scale('+camScale.toFixed(4)+')';
    }
  }

  function render(){
    var i,e;
    photobg.style.transform=MK.kenBurns(t,DUR,{toScale:1.07,toX:0.5,toY:1.2});
    renderHook();

    for(i=0;i<beats.length;i++){
      e=beats[i];
      var sc=e.closest('.scene'),until=e.dataset.until?+e.dataset.until:Infinity;
      var vis=sc&&t>=+sc.dataset.in&&t<+sc.dataset.out&&t>=+e.dataset.at&&t<until;
      e.classList.toggle('snap',t<0.30);
      if(vis){ if(e.classList.contains('gone')){e.classList.remove('gone');void e.offsetWidth;} e.classList.add('on'); }
      else { e.classList.remove('on'); e.classList.add('gone'); }
    }

    // Word-by-word karaoke render — same mechanism export/karaoke.py wires
    // into a real episode build (see WORDS comment above): the chunk on
    // screen is the one the last-started word belongs to, held until the
    // next chunk's first word, and the currently-spoken word gets
    // class="on" (color-shift only, no box).
    var inLine=false;
    for(i=0;i<CUES.length;i++) if(t>=CUES[i][0]-0.32&&t<=CUES[i][1]+0.15){inLine=true;break;}
    if(t>CUES[CUES.length-1][1]) inLine=true;
    var here=-1,cur=-1;
    for(i=0;i<WORDS.length;i++) if(WORDS[i][0]<=t+0.08){ here=WORDS[i][3]; cur=i; }
    var txt='';
    if(inLine&&here>=0){
      for(i=0;i<WORDS.length;i++) if(WORDS[i][3]===here)
        txt+=(i===cur?'<b class="on">':'<b>')+WORDS[i][2]+'</b>  ';
    }
    subs.innerHTML=txt;
    prog.style.width=(t/DUR*100)+'%';
    seek.value=t; cur2.textContent=fmt(t);
  }
  function loop(ts){ if(!playing)return; if(!last)last=ts; t+=(ts-last)/1000; last=ts;
    if(t>=DUR){t=DUR;pause();render();return;} render(); requestAnimationFrame(loop); }
  function play(){ if(t>=DUR)t=0; playing=true;last=0;pp.textContent='❚❚';tap.classList.add('hide');requestAnimationFrame(loop); }
  function pause(){ playing=false; pp.textContent='▶'; }
  pp.onclick=function(){playing?pause():play()};
  tap.onclick=play;
  seek.oninput=function(){t=+seek.value;last=0;render();};
  document.addEventListener('keydown',function(ev){ if(ev.key===' '&&ev.target.tagName!=='INPUT'){ev.preventDefault();playing?pause():play();} });
  beats.forEach(function(e){e.classList.add('gone')});
  render();
  if(location.search.indexOf('render=1')>=0){
    document.body.classList.add('render');
    var pre=document.createElement('div'); pre.id='preroll'; document.body.appendChild(pre);
    var _p=play; play=function(){ if(pre&&pre.parentNode) pre.parentNode.removeChild(pre); _p(); };
  }
  window.__reel={play:function(){play();},pause:pause,seek:function(v){t=v;last=0;render();},duration:DUR};
})();
</script>
