<title>Test — real-photo composite v3, second photo / second mood (disposable, not an episode)</title>
<!--
  DISPOSABLE TEST FILE — not an episode, not for shipping.

  ROUND 3. Same approved text treatment as round 2 (test-photo-composite-v2.html):
  no opaque box, color-shift emphasis instead of a highlight rectangle, subtitle-
  style captions (sentence case, no card look). What changes here is the PHOTO
  and everything downstream of that: this is a warm daylight kitchen shot
  (hands on a laptop, morning light through a window, wood table, coffee, fruit
  bowls) instead of round 2's cool dark phone-in-hand shot — and its bright/dark
  layout is genuinely different, not just a re-skin:

    - round 2's photo had ONE bright element (the phone screen), sitting in the
      vertical middle, on an otherwise dark/plain background — easy to dodge.
    - this photo has THREE separate bright/busy zones: a blown-out window +
      jars/shelves across the TOP (busiest area in the frame, not plain wall
      like round 2), a sunlit ceramic mug bottom-right, and warm sunlit wood
      grain across the bottom. The "quiet" zone is the wood-tile backsplash
      band just below the shelves, and the laptop+hands themselves (dappled
      light, but not blown out).

  So placement was re-derived from this photo, not copied from round 2's pixel
  values:
    - headline sits lower into the frame than round 2's (29cqw vs 26cqw top
      padding) to clear the shelf clutter and land in the calmer tiled band,
      and the top gradient darkens more (0.78 vs 0.62 peak opacity) and
      further down the frame (through ~34% vs ~27%) because this photo's top
      is genuinely brighter and more detailed than round 2's plain dark wall.
    - the laptop + typing hands + mug stay untouched in the middle — same
      principle as round 2 keeping the phone visible: the photo's real
      subject is never covered by a darkening band or text.
    - captions keep round 2's exact vertical anchor (bottom:62cqw, validated
      against the 672px/35cqw bottom safe line already) but the bottom
      gradient darkens more and extends further up (to ~58%) to tame the
      sunlit wood grain and fruit bowls, which are brighter than round 2's
      dark lap/hands bottom zone.

  Accent color: round 2 used --ember (#FBBF24, a golden-yellow) against a cool
  blue-black night photo, where any warm color pops hard against the cool
  base. This photo is ALREADY warm (wood, morning light, skin tones) end to
  end, so the same golden-yellow would sit closer to the photo's own palette
  and read as less distinct. Chosen instead: --rust (#F97316, a fully
  saturated orange-red) — still a warm hue (keeps "warm accent for a warm
  photo" per the brief), but shifted toward red/orange rather than
  yellow/gold, which keeps it a full hue-step away from both the wood tones
  and round 2's amber, so the emphasized word still visibly separates from
  its background instead of blending into "yet another warm-toned thing in a
  warm-toned frame."

  Source image: channel/assets/test-photo-laptop-daylight-fullres.png — real
  1080x1920 full-resolution photo (same aspect as the frame, no crop needed).

  Same contract as v2 / reel-52.html: .pad/.b/.b.on/.b.gone,
  [data-in]/[data-out]/[data-at], .subs word-lit karaoke captions, window.MotionKit,
  window.__reel, safe-area conventions (top 14%/269px, bottom 35%/672px,
  sides 6%/65px on 1080x1920).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Assistant:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --ink:#0A0E14;--line:#1F2B3A;
  --brass:#DC2626;--brass-hot:#FF6B6B;--rust:#F97316;
  --text:#FFFFFF;--muted:#8AA0B8;
  --d:'Archivo','Helvetica Neue',Arial,sans-serif;
  --b:'Assistant','Segoe UI',system-ui,sans-serif;
  --m:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box}
body{margin:0;background:#050709;color:var(--text);font-family:var(--b);-webkit-font-smoothing:antialiased}
.page{display:flex;gap:34px;justify-content:center;padding:24px 16px 70px;flex-wrap:wrap;align-items:flex-start}
.reel{width:min(400px,92vw);flex:0 0 auto}
.frame{position:relative;aspect-ratio:9/16;width:100%;overflow:hidden;border-radius:8px;
  container-type:inline-size;background:var(--ink);border:1px solid var(--line)}

/* real-photo background, full-bleed cover. Source is exactly 1080x1920, same
   aspect as the frame, so cover+center shows the whole photo uncropped. */
.photobg{position:absolute;inset:0;z-index:0;transform-origin:center center;will-change:transform;
  background-image:url('../channel/assets/test-photo-laptop-daylight-fullres.png');
  background-size:cover;background-position:center;background-repeat:no-repeat}
@media (prefers-reduced-motion:reduce){.photobg{transition:none!important}}

/* REVISED — fixed-zone consistency pass: same shared headline zone as v2/v4
   now (y269-650px, .pad padding-top:27cqw, h2 8.4cqw) and the same shared
   top-gradient SHAPE, so the darkened band's edge lands at the same y in
   every scene. Only the PEAK opacity differs, and it's a real measured
   number: PIL brightness of THIS photo's actual pixels inside the fixed
   zone was 153.3/255 (the blown-out window + shelves) -> peak .60, far
   higher than v2's .33 dark-night reading — the photo itself decides the
   darkening strength, the photo does NOT get to decide where the text
   goes. Bottom band (behind captions) is untouched from round 3. */
.photogradient{position:absolute;inset:0;z-index:1;pointer-events:none;
  background:
    linear-gradient(180deg, rgba(4,3,2,.60) 0%, rgba(4,3,2,.51) 12%, rgba(4,3,2,.30) 24%, rgba(4,3,2,.09) 34%, transparent 40%, transparent 50%, rgba(4,3,2,.14) 57%, rgba(4,3,2,.48) 66%, rgba(4,3,2,.74) 76%, rgba(4,3,2,.82) 100%)}
.grain{position:absolute;inset:0;z-index:1;opacity:.05;pointer-events:none;
  background-image:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 3px)}
.prog{position:absolute;left:0;top:0;height:.9cqw;background:var(--rust);z-index:14;width:0;
  box-shadow:0 0 3cqw rgba(249,115,22,.7)}

.scene{position:absolute;inset:0;z-index:2}
/* REVISED — fixed headline zone, same padding-top as every scene in this
   style now (27cqw = 291.6px, just inside the 269px top safe line). This
   used to sit lower than v2's (29cqw) to dodge this photo's shelf/jar
   clutter; that per-photo chase is exactly what read as inconsistent, so
   the zone stays put and the gradient (see .photogradient above) absorbs
   the extra clutter instead. Captions keep the validated bottom:62cqw
   anchor, shared with every scene. */
.pad{position:absolute;inset:0;padding:27cqw 10cqw 0;display:flex;flex-direction:column;
  justify-content:flex-start;align-items:center;text-align:center;gap:2.4cqw}
.kb{will-change:transform;width:100%}

.b{opacity:0;transform:translateY(2cqw) scale(.94);transition:opacity .16s ease,transform .22s cubic-bezier(.2,1.4,.4,1)}
.b.snap{transition:none}
.b.on{opacity:1;transform:none}
.b.gone{display:none!important}
@media (prefers-reduced-motion:reduce){.b,.kb{transition-duration:1ms!important}}

h2{font-family:var(--d);font-weight:900;font-size:8.4cqw;line-height:1.14;letter-spacing:-.02em;
  margin:0;text-wrap:balance;position:relative;z-index:2;color:var(--text);
  text-shadow:0 .5cqw 1.4cqw rgba(0,0,0,.92),0 .15cqw .4cqw rgba(0,0,0,.95),0 0 5cqw rgba(0,0,0,.5)}
/* Emphasis is a color + weight shift on the key phrase, not a background
   shape — same convention as v2. Accent is --rust (#F97316), not v2's
   --ember (#FBBF24): see file-header notes on why a warm photo needs a
   more saturated, redder warm accent to still read as distinct. */
h2 .box{color:var(--rust);font-weight:900;background:none;border:0;padding:0;
  border-radius:0;display:inline;transform:none;text-shadow:0 .5cqw 1.4cqw rgba(0,0,0,.95),0 0 4cqw rgba(0,0,0,.6)}

/* Captions restyled as plain subtitles — sentence case, medium weight, no
   caption-card look. Spoken word picked out by color only. */
/* Font-size aligned to this codebase's own real production convention —
   export/karaoke.py's shipped .subs block (see any reel-*-kar.html, e.g.
   reel-52-kar.html) sets 7.4cqw, not 5.6cqw. */
.subs{position:absolute;left:8cqw;right:8cqw;bottom:62cqw;text-align:center;z-index:11;
  font-family:var(--b);font-weight:600;font-size:7.4cqw;line-height:1.22;letter-spacing:0;
  text-shadow:0 .4cqw 1.2cqw rgba(0,0,0,.95),0 0 2.4cqw rgba(0,0,0,.9)}
.subs b{font-weight:700;color:#fff;transition:color .09s linear;display:inline}
.subs b.on{color:var(--rust)}
.handle{position:absolute;left:0;right:0;bottom:14cqw;text-align:center;z-index:11;
  font-family:var(--m);font-size:2.6cqw;letter-spacing:.28em;text-transform:uppercase;color:#CBD5E1;
  text-shadow:0 .3cqw 1cqw rgba(0,0,0,.9)}
.tapover{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:rgba(5,7,9,.72);border:0;width:100%;color:var(--text)}
.tapover.hide{display:none}
.tapover .d{width:17cqw;height:17cqw;border-radius:50%;border:.7cqw solid var(--rust);display:grid;place-items:center}
.tapover .d::after{content:"";border-left:4.8cqw solid var(--rust);border-top:2.9cqw solid transparent;border-bottom:2.9cqw solid transparent;margin-inline-start:1.5cqw}

.ctl{display:flex;align-items:center;gap:11px;margin-top:11px}
.ctl input{flex:1;-webkit-appearance:none;appearance:none;background:transparent;height:20px;cursor:pointer;margin:0}
.ctl input::-webkit-slider-runnable-track{height:3px;background:#1B2735;border-radius:2px}
.ctl input::-moz-range-track{height:3px;background:#1B2735;border-radius:2px}
.ctl input::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--rust);margin-top:-4.5px}
.ctl input::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--rust)}
.ctl button{background:var(--rust);color:#fff;border:0;border-radius:3px;width:40px;height:31px;font-size:13px;font-weight:700;cursor:pointer}
.ctl span{font-family:var(--m);font-size:12px;color:var(--muted)}
button:focus-visible,input:focus-visible{outline:2px solid var(--rust);outline-offset:3px}

body.render{background:#000;overflow:hidden}
#preroll{position:fixed;inset:0;background:#000;z-index:9999}
body.render .page{padding:0;gap:0;display:block}
body.render .ctl,body.render .tapover,body.render .prog{display:none!important}
body.render .reel{width:100vw;max-width:none}
body.render .frame{width:100vw;height:100vh;aspect-ratio:auto;border:0;border-radius:0}
</style>

<div class="page">
<div class="reel">
<div class="frame" id="frame">
<div class="photobg" id="photobg"></div>
<div class="grain" data-decor></div>
<div class="photogradient"></div>
<div class="prog" id="prog"></div>

<section class="scene" data-in="0" data-out="7.50">
  <div class="pad"><div class="kb" id="hookKb">
    <h2 id="hookH2">It's already reading <span class="box">more than your messages</span>.</h2>
  </div></div>
</section>

<div class="subs" id="subs"></div>
<div class="handle" data-decor>@actually_works.ai</div>
<button class="tapover" id="tap" aria-label="play"><span class="d"></span></button>
</div>
</div>

<div class="ctl">
  <button id="pp" aria-label="Play">▶</button>
  <input id="seek" type="range" min="0" max="7.50" step="0.05" value="0" aria-label="Seek">
  <span id="cur2">0:00</span>
</div>
</div>
</div>

<script src="../export/motion-kit.js"></script>
<script>
(function(){
  var MK=window.MotionKit;
  var DUR=7.50,t=0,playing=false,last=0;
  var frame=document.getElementById('frame');
  var scenes=[].slice.call(frame.querySelectorAll('.scene'));
  var beats=[].slice.call(frame.querySelectorAll('[data-at]'));
  var subs=document.getElementById('subs'),seek=document.getElementById('seek');
  var pp=document.getElementById('pp'),cur2=document.getElementById('cur2');
  var tap=document.getElementById('tap'),prog=document.getElementById('prog');

  // Plain-subtitle captions — sentence case, same convention as v2. Copy is
  // fresh for this photo's mood: giving an AI tool access to your work/day,
  // not just your chat messages.
  var CUES=[
    [0.30,1.70,"It's already reading"],
    [1.70,3.00,"more than"],
    [3.00,4.30,"your messages."],
    [4.40,7.50,"Every file it can open becomes part of what it knows."]
  ];

  // ROUND 3b — real word-by-word karaoke captions, same mechanism as v2
  // (see that file's WORDS comment). HAND-AUTHORED PLACEHOLDER TIMESTAMPS:
  // no real narration exists for this made-up copy, so each line's known
  // duration above is split evenly across its words — NOT real Whisper-
  // aligned output from export/karaoke.py, which would land unevenly.
  var WORDS=[
    [0.30,0.77,"It's",0],[0.77,1.23,"already",0],
    [1.23,1.70,"reading",1],[1.70,2.35,"more",1],
    [2.35,3.00,"than",2],[3.00,3.65,"your",2],
    [3.65,4.30,"messages.",3],
    [4.30,4.68,"Every",4],[4.68,4.96,"file",4],[4.96,5.25,"it",4],
    [5.25,5.53,"can",5],[5.53,5.81,"open",5],
    [5.81,6.09,"becomes",6],[6.09,6.37,"part",6],
    [6.37,6.65,"of",7],[6.65,6.94,"what",7],
    [6.94,7.22,"it",8],[7.22,7.50,"knows.",8]
  ];

  function fmt(s){s=Math.max(0,Math.floor(s));return Math.floor(s/60)+":"+("0"+(s%60)).slice(-2);}

  // Ken Burns: this photo's real subject (typing hands + laptop + mug) sits
  // just right of and just below frame-center (roughly x400-800/1080 i.e.
  // ~37-74%, center ~55%; y850-1200/1920 i.e. ~44-62%, center ~53%) — so the
  // slow drift reveals slightly more of the RIGHT and BOTTOM of the image
  // (both negative, per kenBurns()'s sign convention) to creep toward the
  // hands/mug rather than the shelf clutter above or the fruit bowl in the
  // near foreground. Small scale (1.0->1.07), tiny pan (<=1%) over the full
  // 7.5s.
  var photobg=document.getElementById('photobg');

  var hookKb=document.getElementById('hookKb');
  var hookH2=document.getElementById('hookH2');
  var hookScene=hookH2.closest('.scene');
  var hookSplit=MK.splitWordsSafe(hookH2);
  var hookClimax=null;
  for(var hi=0;hi<hookSplit.words.length;hi++){
    var hw=hookSplit.words[hi];
    if(hw.classList.contains('box')){ hookClimax=hw; break; }
  }
  var hookClimaxIndex=hookClimax?hookSplit.words.indexOf(hookClimax):-1;

  function renderHook(){
    var ht=t-(+hookScene.dataset.in);
    var START=0.15,GAP=0.10,DUR2=0.30;
    for(var i=0;i<hookSplit.words.length;i++){
      var w=hookSplit.words[i],at=START+i*GAP;
      if(w===hookClimax){
        MK.animatePop(w,ht,at,DUR2);
      } else {
        var e=MK.smoothIn(MK.clamp01((ht-at)/DUR2));
        w.style.opacity=String(e);
        w.style.transform='translateY('+(14*(1-e)).toFixed(2)+'px)';
      }
    }
    if(hookClimaxIndex>=0){
      var climaxAt=START+hookClimaxIndex*GAP;
      var camScale=MK.multiPhaseCamera(ht,{settleDur:0.4,pullBack:0.98,pushAt:climaxAt,pushDur:0.9,pushTo:1.05});
      hookKb.style.transform='scale('+camScale.toFixed(4)+')';
    }
  }

  function render(){
    var i,e;
    photobg.style.transform=MK.kenBurns(t,DUR,{toScale:1.07,toX:-0.8,toY:-1.0});
    renderHook();

    for(i=0;i<beats.length;i++){
      e=beats[i];
      var sc=e.closest('.scene'),until=e.dataset.until?+e.dataset.until:Infinity;
      var vis=sc&&t>=+sc.dataset.in&&t<+sc.dataset.out&&t>=+e.dataset.at&&t<until;
      e.classList.toggle('snap',t<0.30);
      if(vis){ if(e.classList.contains('gone')){e.classList.remove('gone');void e.offsetWidth;} e.classList.add('on'); }
      else { e.classList.remove('on'); e.classList.add('gone'); }
    }

    var inLine=false;
    for(i=0;i<CUES.length;i++) if(t>=CUES[i][0]-0.32&&t<=CUES[i][1]+0.15){inLine=true;break;}
    if(t>CUES[CUES.length-1][1]) inLine=true;
    var here=-1,cur=-1;
    for(i=0;i<WORDS.length;i++) if(WORDS[i][0]<=t+0.08){ here=WORDS[i][3]; cur=i; }
    var txt='';
    if(inLine&&here>=0){
      for(i=0;i<WORDS.length;i++) if(WORDS[i][3]===here)
        txt+=(i===cur?'<b class="on">':'<b>')+WORDS[i][2]+'</b>  ';
    }
    subs.innerHTML=txt;
    prog.style.width=(t/DUR*100)+'%';
    seek.value=t; cur2.textContent=fmt(t);
  }
  function loop(ts){ if(!playing)return; if(!last)last=ts; t+=(ts-last)/1000; last=ts;
    if(t>=DUR){t=DUR;pause();render();return;} render(); requestAnimationFrame(loop); }
  function play(){ if(t>=DUR)t=0; playing=true;last=0;pp.textContent='❚❚';tap.classList.add('hide');requestAnimationFrame(loop); }
  function pause(){ playing=false; pp.textContent='▶'; }
  pp.onclick=function(){playing?pause():play()};
  tap.onclick=play;
  seek.oninput=function(){t=+seek.value;last=0;render();};
  document.addEventListener('keydown',function(ev){ if(ev.key===' '&&ev.target.tagName!=='INPUT'){ev.preventDefault();playing?pause():play();} });
  beats.forEach(function(e){e.classList.add('gone')});
  render();
  if(location.search.indexOf('render=1')>=0){
    document.body.classList.add('render');
    var pre=document.createElement('div'); pre.id='preroll'; document.body.appendChild(pre);
    var _p=play; play=function(){ if(pre&&pre.parentNode) pre.parentNode.removeChild(pre); _p(); };
  }
  window.__reel={play:function(){play();},pause:pause,seek:function(v){t=v;last=0;render();},duration:DUR};
})();
</script>
