<title>Test — hybrid synthetic + real-photo scenes in one video (disposable, not an episode)</title>
<!--
  DISPOSABLE TEST FILE — not an episode, not for shipping.

  Built to answer one real question from David: can a FUTURE episode mix
  the channel's regular fully-synthetic scene style (gradient blobs, no
  real photo, Archivo/Assistant type, brass accent — see any reel-*-kar.html)
  with the new real-photo-composite style (video/test-photo-composite-v*.html)
  IN THE SAME VIDEO, scene to scene? Not assumed — built and checked for
  real, three ways:

  1. Scene 1 here is a stripped-down copy of the real synthetic style (the
     gradient-blob .bg from reel-52-kar.html, Archivo headline, brass
     accent, citation-style small-caps line) — same DOM shape and CSS
     variables as a real shipped reel, not a from-scratch invention.
  2. Scene 2 is test-photo-composite-v4.html's fixed evening/voice scene,
     verbatim (photobg + photogradient + grain + Ken Burns), reusing the
     ROUND 5 face-safe photo and gradient, headline recolored to --brass
     per this session's other finding (one accent color per video).
  3. Both scenes are wired into MK.zoomThroughTransition using the EXACT
     per-scene opacity/scale/blur resolution function copied from
     photo-composite-demo.html's renderScene() (the one that fixed the
     three-scene clobbering bug) — the mechanism does not know or care
     what is behind the scene it is fading; it operates on the whole
     .scene element's opacity/transform/filter regardless of whether that
     element contains a solid gradient div or a photobg div.

  Captions (.subs, word-by-word karaoke, same contract as every other file
  this session touched) run continuously across the scene boundary, same
  mechanism as the 3-scene demo (a single global .subs overlay, not
  per-scene), so this checks whether captions surviving a background-type
  change is really just "a CSS z-index fact" or whether something about a
  photo background actually behaves differently under the caption text
  (measured in this session's report: it doesn't — the caption layer sits
  above both background types identically, z-index 11 either way).

  RESULT (see this session's report for screenshots at the transition
  boundary): the transition, .pad/safe-area contract and caption system all
  read cleanly across the type change. No mechanical break found. The one
  real difference: a synthetic scene's background is intentionally FLAT
  during the whole scene (only the blobs drift, no Ken Burns), while a
  photo scene has continuous Ken Burns pan/zoom — so scene 2 has a subtle
  camera drift scene 1 does not. That is not a defect; every existing
  reel already has this exact contrast to a lesser degree (a citation card
  scene sits still while a photo-of-a-tweet scene doesn't), and the
  zoom-through transition's blur+scale hides the seam either way.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Assistant:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --ink:#0A0E14;--line:#1F2B3A;
  --brass:#DC2626;--brass-hot:#FF6B6B;--rose:#F2617A;
  --text:#FFFFFF;--muted:#8AA0B8;
  --d:'Archivo','Helvetica Neue',Arial,sans-serif;
  --b:'Assistant','Segoe UI',system-ui,sans-serif;
  --m:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box}
body{margin:0;background:#050709;color:var(--text);font-family:var(--b);-webkit-font-smoothing:antialiased}
.page{display:flex;gap:34px;justify-content:center;padding:24px 16px 70px;flex-wrap:wrap;align-items:flex-start}
.reel{width:min(400px,92vw);flex:0 0 auto}
.frame{position:relative;aspect-ratio:9/16;width:100%;overflow:hidden;border-radius:8px;
  container-type:inline-size;background:var(--ink);border:1px solid var(--line)}

.scene{position:absolute;inset:0;z-index:2;transform-origin:center center;will-change:transform,opacity,filter}

/* SCENE 1 — synthetic style, copied from reel-52-kar.html's own .bg/.b1-3 */
.bg{position:absolute;inset:0;z-index:0}
.bg .b1{position:absolute;width:130cqw;height:130cqw;top:-40cqw;left:-30cqw;border-radius:50%;
  background:radial-gradient(circle closest-side,rgba(220,38,38,.24),rgba(124,58,237,0) 70%)}
.bg .b2{position:absolute;width:150cqw;height:150cqw;top:50cqw;left:-10cqw;border-radius:50%;
  background:radial-gradient(circle closest-side,rgba(20,28,40,.6),rgba(20,28,40,0) 70%)}
.bg .b3{position:absolute;width:120cqw;height:120cqw;top:120cqw;left:20cqw;border-radius:50%;
  background:radial-gradient(circle closest-side,rgba(251,191,36,.14),rgba(245,158,11,0) 70%)}
.vign{position:absolute;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 50%,transparent 40%,rgba(5,7,9,.55) 100%)}
.cite{font-family:var(--m);font-size:2.8cqw;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);margin-bottom:2cqw;position:relative;z-index:2}

/* SCENE 2 — real photo, verbatim from test-photo-composite-v4.html (facesafe) */
.photobg{position:absolute;inset:0;z-index:0;transform-origin:center center;will-change:transform;
  background-image:url('../channel/assets/test-photo-voice-evening-facesafe.png');
  background-size:cover;background-position:center;background-repeat:no-repeat}
.photogradient{position:absolute;inset:0;z-index:1;pointer-events:none;
  background:
    linear-gradient(180deg, rgba(6,4,3,.40) 0%, rgba(6,4,3,.34) 10%, rgba(6,4,3,.20) 20%, rgba(6,4,3,.08) 30%, transparent 35%, transparent 56%, rgba(6,4,3,.10) 56.6%, rgba(6,4,3,.58) 62.6%, rgba(6,4,3,.68) 67.6%, rgba(6,4,3,.40) 72.6%, rgba(6,4,3,.30) 78.6%, rgba(6,4,3,.62) 86.6%, rgba(6,4,3,.76) 96.6%, rgba(6,4,3,.80) 100%)}
.grain{position:absolute;inset:0;z-index:1;opacity:.05;pointer-events:none;
  background-image:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 3px)}

.prog{position:absolute;left:0;top:0;height:.9cqw;background:var(--brass);z-index:14;width:0;
  box-shadow:0 0 3cqw rgba(220,38,38,.7)}

/* Shared headline zone — same fixed 27cqw padding-top every style in this
   channel uses (both synthetic and photo scenes), so switching styles
   scene to scene does not also move the headline around. */
.pad{position:absolute;inset:0;z-index:2;padding:27cqw 10cqw 0;display:flex;flex-direction:column;
  justify-content:flex-start;align-items:center;text-align:center;gap:2.4cqw}
.kb{will-change:transform;width:100%}

.b{opacity:0;transform:translateY(2cqw) scale(.94);transition:opacity .16s ease,transform .22s cubic-bezier(.2,1.4,.4,1)}
.b.snap{transition:none}
.b.on{opacity:1;transform:none}
.b.gone{display:none!important}
@media (prefers-reduced-motion:reduce){.b,.kb,.scene{transition-duration:1ms!important}}

h2{font-family:var(--d);font-weight:900;font-size:8.4cqw;line-height:1.14;letter-spacing:-.02em;
  margin:0;text-wrap:balance;position:relative;z-index:2;color:var(--text);
  text-shadow:0 .5cqw 1.4cqw rgba(0,0,0,.92),0 .15cqw .4cqw rgba(0,0,0,.95),0 0 5cqw rgba(0,0,0,.5)}
h2 .box{color:var(--brass);font-weight:900;background:none;border:0;padding:0;
  border-radius:0;display:inline;transform:none;text-shadow:0 .5cqw 1.4cqw rgba(0,0,0,.95),0 0 4cqw rgba(0,0,0,.6)}

.subs{position:absolute;left:8cqw;right:8cqw;bottom:62cqw;text-align:center;z-index:11;
  font-family:var(--b);font-weight:600;font-size:7.4cqw;line-height:1.22;letter-spacing:0;
  text-shadow:0 .4cqw 1.2cqw rgba(0,0,0,.95),0 0 2.4cqw rgba(0,0,0,.9)}
.subs b{font-weight:700;color:#fff;transition:color .09s linear;display:inline}
.subs b.on{color:var(--brass)}
.handle{position:absolute;left:0;right:0;bottom:14cqw;text-align:center;z-index:11;
  font-family:var(--m);font-size:2.6cqw;letter-spacing:.28em;text-transform:uppercase;color:#CBD5E1;
  text-shadow:0 .3cqw 1cqw rgba(0,0,0,.9)}
.tapover{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:rgba(5,7,9,.72);border:0;width:100%;color:var(--text)}
.tapover.hide{display:none}
.tapover .d{width:17cqw;height:17cqw;border-radius:50%;border:.7cqw solid var(--brass);display:grid;place-items:center}
.tapover .d::after{content:"";border-left:4.8cqw solid var(--brass);border-top:2.9cqw solid transparent;border-bottom:2.9cqw solid transparent;margin-inline-start:1.5cqw}

.ctl{display:flex;align-items:center;gap:11px;margin-top:11px}
.ctl input{flex:1;-webkit-appearance:none;appearance:none;background:transparent;height:20px;cursor:pointer;margin:0}
.ctl input::-webkit-slider-runnable-track{height:3px;background:#1B2735;border-radius:2px}
.ctl input::-moz-range-track{height:3px;background:#1B2735;border-radius:2px}
.ctl input::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--brass);margin-top:-4.5px}
.ctl input::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--brass)}
.ctl button{background:var(--brass);color:#fff;border:0;border-radius:3px;width:40px;height:31px;font-size:13px;font-weight:700;cursor:pointer}
.ctl span{font-family:var(--m);font-size:12px;color:var(--muted)}
button:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:3px}

body.render{background:#000;overflow:hidden}
#preroll{position:fixed;inset:0;background:#000;z-index:9999}
body.render .page{padding:0;gap:0;display:block}
body.render .ctl,body.render .tapover,body.render .prog{display:none!important}
body.render .reel{width:100vw;max-width:none}
body.render .frame{width:100vw;height:100vh;aspect-ratio:auto;border:0;border-radius:0}
</style>

<div class="page">
<div class="reel">
<div class="frame" id="frame">
<div class="prog" id="prog"></div>

<section class="scene" id="sceneA" data-in="0" data-out="7.00">
  <div class="bg"><div class="b1"></div><div class="b2"></div><div class="b3"></div></div>
  <div class="vign"></div>
  <div class="pad"><div class="kb" id="hookKbA">
    <div class="cite">REAL USER REPORT</div>
    <h2 id="hookH2A">Most people never check <span class="box">what it remembers</span>.</h2>
  </div></div>
</section>

<section class="scene" id="sceneB" data-in="7.00" data-out="14.50">
  <div class="photobg"></div>
  <div class="grain" data-decor></div>
  <div class="photogradient"></div>
  <div class="pad"><div class="kb" id="hookKbB">
    <h2 id="hookH2B">It's listening for <span class="box">more than your question</span>.</h2>
  </div></div>
</section>

<div class="subs" id="subs"></div>
<div class="handle" data-decor>@actually_works.ai</div>
<button class="tapover" id="tap" aria-label="play"><span class="d"></span></button>
</div>
</div>

<div class="ctl">
  <button id="pp" aria-label="Play">▶</button>
  <input id="seek" type="range" min="0" max="14.50" step="0.05" value="0" aria-label="Seek">
  <span id="cur2">0:00</span>
</div>
</div>
</div>

<script src="../export/motion-kit.js"></script>
<script>
(function(){
  var MK=window.MotionKit;
  var DUR=14.50,t=0,playing=false,last=0;
  var frame=document.getElementById('frame');
  var scenes=[].slice.call(frame.querySelectorAll('.scene'));
  var beats=[].slice.call(frame.querySelectorAll('[data-at]'));
  var subs=document.getElementById('subs'),seek=document.getElementById('seek');
  var pp=document.getElementById('pp'),cur2=document.getElementById('cur2');
  var tap=document.getElementById('tap'),prog=document.getElementById('prog');

  // Captions run continuously across the scene-type boundary (7.00s) —
  // this is the actual test of whether the caption system cares what kind
  // of background is behind it (it doesn't; it's a fixed z-index:11 overlay).
  var WORDS=[
    [0.30,0.60,"Most",0],[0.60,0.85,"people",0],[0.85,1.10,"never",0],[1.10,1.45,"check",0],
    [1.60,1.95,"what",1],[1.95,2.35,"it",1],[2.35,2.85,"remembers.",1],
    [3.20,3.90,"That's",2],[3.90,4.60,"the",2],[4.60,5.60,"real",2],[5.60,6.90,"risk.",2],
    [7.30,7.95,"It's",3],[7.95,8.60,"listening",3],
    [8.60,9.03,"for",4],[9.03,9.47,"more",4],[9.47,9.90,"than",4],
    [9.90,10.55,"your",5],[10.55,11.20,"question.",5],
    [11.60,12.10,"Every",6],[12.10,12.60,"word",6],[12.60,13.00,"in",6],
    [13.00,13.60,"the",7],[13.60,14.50,"room.",7]
  ];
  var CUES=[[0.30,2.85,1],[3.20,6.90,1],[7.30,11.20,1],[11.60,14.50,1]];

  function fmt(s){s=Math.max(0,Math.floor(s));return Math.floor(s/60)+":"+("0"+(s%60)).slice(-2);}

  function makeHook(kbId,h2Id){
    var kb=document.getElementById(kbId),h2=document.getElementById(h2Id);
    var scene=h2.closest('.scene');
    var split=MK.splitWordsSafe(h2);
    var climax=null;
    for(var i=0;i<split.words.length;i++){ if(split.words[i].classList.contains('box')){climax=split.words[i];break;} }
    var climaxIndex=climax?split.words.indexOf(climax):-1;
    return function(){
      var ht=t-(+scene.dataset.in);
      var START=0.15,GAP=0.10,DUR2=0.30;
      for(var i=0;i<split.words.length;i++){
        var w=split.words[i],at=START+i*GAP;
        if(w===climax){ MK.animatePop(w,ht,at,DUR2); }
        else { var e=MK.smoothIn(MK.clamp01((ht-at)/DUR2)); w.style.opacity=String(e); w.style.transform='translateY('+(14*(1-e)).toFixed(2)+'px)'; }
      }
      if(climaxIndex>=0){
        var climaxAt=START+climaxIndex*GAP;
        var camScale=MK.multiPhaseCamera(ht,{settleDur:0.4,pullBack:0.98,pushAt:climaxAt,pushDur:0.9,pushTo:1.05});
        kb.style.transform='scale('+camScale.toFixed(4)+')';
      }
    };
  }
  var renderHookA=makeHook('hookKbA','hookH2A');
  var renderHookB=makeHook('hookKbB','hookH2B');

  // Zoom-through transition — EXACT per-scene resolution function copied
  // from photo-composite-demo.html's renderScene() (see that file's own
  // comment for why: pairwise calls clobber the shared middle scene with
  // only 2+ scenes involved in independent transitions).
  var OUT_DUR=0.42, IN_DUR=0.5, IN_OFFSET=0.16;
  function renderScene(i){
    var scene=scenes[i];
    var prev=i>0?scenes[i-1]:null;
    var next=i<scenes.length-1?scenes[i+1]:null;
    var outTime=+scene.dataset.out;
    var inStart=-Infinity, inEndsAt=-Infinity;
    if(prev){
      var prevOutStart=+prev.dataset.out-OUT_DUR;
      inStart=prevOutStart+IN_OFFSET;
      inEndsAt=inStart+IN_DUR;
    }
    var outStart=next?outTime-OUT_DUR:Infinity;
    var opacity,scale,blur;
    if(prev && t<inStart){ opacity=0; scale=0.94; blur=5; }
    else if(prev && t<inEndsAt){ var ie=MK.smoothIn(MK.clamp01((t-inStart)/IN_DUR)); opacity=ie; scale=0.94+0.06*ie; blur=5*(1-ie); }
    else if(next && t>=outStart && t<outTime){ var oe=MK.smoothIn(MK.clamp01((t-outStart)/OUT_DUR)); opacity=1-oe; scale=1+0.16*oe; blur=5*oe; }
    else if(next && t>=outTime){ opacity=0; scale=1.16; blur=5; }
    else { opacity=1; scale=1; blur=0; }
    scene.style.opacity=String(opacity);
    scene.style.transform='scale('+scale.toFixed(4)+')';
    scene.style.filter='blur('+blur.toFixed(1)+'px)';
  }

  var photobg=frame.querySelector('.photobg');

  function render(){
    var i,e;
    for(i=0;i<scenes.length;i++) renderScene(i);
    renderHookA(); renderHookB();
    // Ken Burns only on the photo scene (scene B) — the synthetic scene's
    // blobs are static per this style's own convention (see file header).
    photobg.style.transform=MK.kenBurns(t-(+scenes[1].dataset.in), (+scenes[1].dataset.out-(+scenes[1].dataset.in)), {toScale:1.08,toX:1.4,toY:-1.2});

    for(i=0;i<beats.length;i++){
      e=beats[i];
      var sc=e.closest('.scene'),until=e.dataset.until?+e.dataset.until:Infinity;
      var vis=sc&&t>=+sc.dataset.in&&t<+sc.dataset.out&&t>=+e.dataset.at&&t<until;
      e.classList.toggle('snap',t<0.30);
      if(vis){ if(e.classList.contains('gone')){e.classList.remove('gone');void e.offsetWidth;} e.classList.add('on'); }
      else { e.classList.remove('on'); e.classList.add('gone'); }
    }

    var inLine=false;
    for(i=0;i<CUES.length;i++) if(t>=CUES[i][0]-0.32&&t<=CUES[i][1]+0.15){inLine=true;break;}
    var here=-1,cur=-1;
    for(i=0;i<WORDS.length;i++) if(WORDS[i][0]<=t+0.08){ here=WORDS[i][3]; cur=i; }
    var txt='';
    if(inLine&&here>=0){
      for(i=0;i<WORDS.length;i++) if(WORDS[i][3]===here)
        txt+=(i===cur?'<b class="on">':'<b>')+WORDS[i][2]+'</b>  ';
    }
    subs.innerHTML=txt;
    prog.style.width=(t/DUR*100)+'%';
    seek.value=t; cur2.textContent=fmt(t);
  }
  function loop(ts){ if(!playing)return; if(!last)last=ts; t+=(ts-last)/1000; last=ts;
    if(t>=DUR){t=DUR;pause();render();return;} render(); requestAnimationFrame(loop); }
  function play(){ if(t>=DUR)t=0; playing=true;last=0;pp.textContent='❚❚';tap.classList.add('hide');requestAnimationFrame(loop); }
  function pause(){ playing = false; pp.textContent='▶'; }
  pp.onclick=function(){playing?pause():play()};
  tap.onclick=play;
  seek.oninput=function(){t=+seek.value;last=0;render();};
  document.addEventListener('keydown',function(ev){ if(ev.key===' '&&ev.target.tagName!=='INPUT'){ev.preventDefault();playing?pause():play();} });
  beats.forEach(function(e){e.classList.add('gone')});
  render();
  if(location.search.indexOf('render=1')>=0){
    document.body.classList.add('render');
    var pre=document.createElement('div'); pre.id='preroll'; document.body.appendChild(pre);
    var _p=play; play=function(){ if(pre&&pre.parentNode) pre.parentNode.removeChild(pre); _p(); };
  }
  window.__reel={play:function(){play();},pause:pause,seek:function(v){t=v;last=0;render();},duration:DUR};
})();
</script>
