<script>
window.buildScene_3=function(tl,T0,DUR){
 const E1="power3.out",ED="sine.inOut",BK="back.out(1.2)";
 const at=f=>T0+DUR*f;
 tl.set('#s3',{opacity:1,visibility:'visible'},T0);
 tl.set('#s3 .w',{opacity:0},T0);
 tl.set('#card3',{opacity:1,y:0,scale:1,transformOrigin:'50% 100%'},T0);
 tl.set(['#i40','#i41','#i42'],{opacity:0},T0);
 tl.set('#mk3',{opacity:0,scaleX:0},T0);
 tl.set('#q3',{opacity:0,scale:.4},T0);
 tl.set('#cg3',{transformOrigin:'210px 235px'},T0);
 tl.set('#hd_3',{transformOrigin:'210px 190px'},T0);
 tl.set('#bl3',{transformOrigin:'210px 112px'},T0);
 tl.set('#mo3',{transformOrigin:'210px 162px'},T0);
 // camera drift
 tl.fromTo('#cam3',{scale:1,x:-6,y:5},{scale:1.03,x:7,y:-7,duration:DUR,ease:ED},T0);
 // headline words, uneven
 const ts=[0,0.07,0.2,0.27,0.36,0.46,0.52,0.6];
 [...document.querySelectorAll('#s3 .w')].forEach((el,i)=>{
  if(i==1) tl.fromTo(el,{opacity:0,y:40,scale:1.02},{opacity:1,y:0,scale:1,duration:DUR*.2,ease:"expo.out"},at(ts[i]));
  else tl.fromTo(el,{opacity:0,y:32},{opacity:1,y:0,duration:DUR*.13,ease:E1},at(ts[i]));
 });
 // card is on screen from frame 0, drifts in with a small settle
 tl.fromTo('#card3',{y:30,scale:.97,rotation:-.6},{y:0,scale:1,rotation:0,duration:DUR*.22,ease:BK},T0);
 tl.fromTo('#card3',{rotation:-.4},{rotation:.5,duration:DUR*.9,ease:ED},at(0.15));
 // items pop with uneven offsets and each sways on its own period
 [['#i40',0,-6],['#i41',.035,7],['#i42',.075,-5]].forEach(([id,f,x],k)=>{
  tl.fromTo(id,{opacity:0,x:x*9,y:24,scale:.94},{opacity:1,x:0,y:0,scale:1,duration:DUR*.2,ease:BK},at(f));
  tl.fromTo(id,{y:-2},{y:3,duration:DUR*(.23+k*.07),ease:ED,repeat:3,yoyo:true},at(.2+f));
 });
 // character rises, breathes, looks, reacts
 tl.fromTo('#ch3',{y:70,opacity:0},{y:0,opacity:1,duration:DUR*.24,ease:"expo.out"},at(0.02));
 tl.fromTo('#cg3',{scaleY:1},{scaleY:1.022,duration:DUR*.2,ease:ED,repeat:4,yoyo:true},at(0.2));
 tl.fromTo('#hd_3',{rotation:-2.5},{rotation:2.5,duration:DUR*.34,ease:ED,repeat:2,yoyo:true},at(0.12));
 // eyes scan the list (pupils drift up, then right, then settle on item 2)
 tl.to('#pu3',{y:-12,x:-4,duration:DUR*.12,ease:ED},at(0.2));
 tl.to('#pu3',{y:-6,x:5,duration:DUR*.12,ease:ED},at(0.34));
 tl.to('#pu3',{y:-10,x:0,duration:DUR*.1,ease:ED},at(0.5));
 // blink 1 and 2
 [.4,.78].forEach(f=>{tl.to('#bl3',{scaleY:.08,duration:DUR*.025,ease:"power2.in"},at(f));tl.to('#bl3',{scaleY:1,duration:DUR*.04,ease:"power2.out"},at(f+.028));});
 // marker lands on item 2, eyebrows shoot up, mouth opens, question mark pops
 tl.fromTo('#mk3',{opacity:0,scaleX:0},{opacity:1,scaleX:1,duration:DUR*.2,ease:"power3.out"},at(0.5));
 tl.fromTo('#i41',{scale:1},{scale:1.03,duration:DUR*.16,ease:BK},at(0.52));
 tl.to('#eb0',{y:-16,rotation:-8,transformOrigin:'165px 78px',duration:DUR*.14,ease:BK},at(0.52));
 tl.to('#eb1',{y:-22,rotation:8,transformOrigin:'255px 78px',duration:DUR*.14,ease:BK},at(0.55));
 tl.to('#mo3',{scaleX:.62,scaleY:2.6,duration:DUR*.14,ease:BK},at(0.55));
 tl.fromTo('#q3',{opacity:0,scale:.4,y:20,rotation:-14},{opacity:1,scale:1,y:0,rotation:8,duration:DUR*.2,ease:BK},at(0.6));
 tl.fromTo('#q3',{y:-4},{y:6,duration:DUR*.2,ease:ED,repeat:3,yoyo:true},at(0.82));
 // marker pulses softly so the end is never still
 tl.fromTo('#mk3',{backgroundColor:'rgba(229,72,77,.18)'},{backgroundColor:'rgba(229,72,77,.38)',duration:DUR*.16,ease:ED,repeat:3,yoyo:true},at(0.72));
};
