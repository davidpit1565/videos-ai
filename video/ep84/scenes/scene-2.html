<script>
window.buildScene_2=function(tl,T0,DUR){
 const E1="power3.out",ED="sine.inOut",BK="back.out(1.2)";
 const at=f=>T0+DUR*f;
 tl.set('#s2',{opacity:1,visibility:'visible'},T0);
 tl.set('#s2 .w',{opacity:0},T0);
 // camera drift
 tl.fromTo('#cam2',{scale:1,x:6,y:-5},{scale:1.03,x:-6,y:6,duration:DUR,ease:ED},T0);

 // headline words
 const ws=[...document.querySelectorAll('#s2 .w')];
 const ts=[0,0.1,0.18,0.4,0.5];
 ws.forEach((el,i)=>{
  const t=at(ts[i]);
  if(i==4) tl.fromTo(el,{opacity:0,y:50,scale:1.22},{opacity:1,y:0,scale:1,duration:DUR*.24,ease:"back.out(1.2)"},t);
  else tl.fromTo(el,{opacity:0,y:34},{opacity:1,y:0,duration:DUR*.16,ease:E1},t);
 });

 // notes: constant flutter, own period and phase (wrapper), bounded to DUR
 const sway=(id,cx,cy,amp,per,ph,ya)=>{
  let t=ph,k=0;
  tl.set(id,{svgOrigin:cx+' '+cy},T0);
  while(t<DUR-.05){
   const sgn=(k%2?-1:1), d=per*(.85+.3*((k*37)%7)/7);
   tl.to(id,{rotation:sgn*amp*(.8+.4*((k*5)%3)/3),y:-sgn*ya,duration:d,ease:ED},T0+t);
   t+=d*.92;k++;
  }
 };
 sway('#nw1',140,150,3.2,.62,0,4);
 sway('#nw2',460,110,2.6,.74,.1,5);
 sway('#nw3',760,160,3.4,.55,.05,4);

 // bubble gets grabbed and dragged (cursor carries identical tweens)
 const drag=(sel)=>{
  tl.to(sel,{x:490,duration:DUR*.46,ease:"power2.inOut"},at(.05));
  tl.to(sel,{y:-95,duration:DUR*.2,ease:"sine.out"},at(.05));
  tl.to(sel,{y:62,duration:DUR*.28,ease:"power2.in"},at(.25));
 };
 tl.set('#bub2',{svgOrigin:'230 445'},T0);
 tl.set('#cur2',{x:0,y:0},T0);
 drag('#bub2');
 // cursor: same path, then leaves
 tl.to('#cur2',{x:490,duration:DUR*.46,ease:"power2.inOut"},at(.05));
 tl.to('#cur2',{y:-95,duration:DUR*.2,ease:"sine.out"},at(.05));
 tl.to('#cur2',{y:-40,duration:DUR*.28,ease:"power2.in"},at(.25));
 tl.to('#cur2',{x:600,y:-170,opacity:0,duration:DUR*.28,ease:"power2.in"},at(.58));
 // grab ripple at frame start
 tl.fromTo('#rip2',{opacity:.9,scale:.6,svgOrigin:'345 395'},{opacity:0,scale:2.4,duration:DUR*.16,ease:"power2.out"},at(.02));
 // bubble tilt while carried, then crumple into the can
 tl.fromTo('#bub2',{rotation:0},{rotation:-9,duration:DUR*.16,ease:ED},at(.06));
 tl.to('#bub2',{rotation:10,scale:.6,duration:DUR*.3,ease:ED},at(.22));
 tl.to('#bub2',{scaleX:.34,scaleY:.2,rotation:22,duration:DUR*.16,ease:"power2.in"},at(.5));
 tl.to('#bub2',{opacity:0,duration:DUR*.06,ease:ED},at(.62));
 // lid opens before arrival, bounces shut a little after
 tl.set('#lid2',{svgOrigin:'622 408'},T0);
 tl.to('#lid2',{rotation:-62,duration:DUR*.2,ease:"back.out(1.4)"},at(.22));
 tl.to('#lid2',{rotation:-22,duration:DUR*.2,ease:"back.inOut(1.2)"},at(.62));
 // can squashes when the bubble lands
 tl.set('#tc2',{svgOrigin:'730 604'},T0);
 tl.to('#tc2',{scaleY:.94,scaleX:1.04,duration:DUR*.07,ease:"power2.out"},at(.56));
 tl.to('#tc2',{scaleY:1,scaleX:1,duration:DUR*.22,ease:"elastic.out(1,.5)"},at(.63));
 // paper bits puff
 tl.set('.bt',{opacity:0,scale:.3,svgOrigin:'730 410'},T0);
 const vec=[[-70,-120,200],[60,-150,-160],[-20,-170,120],[100,-90,-220],[-110,-70,260],[30,-190,-100]];
 [...document.querySelectorAll('#s2 .bt')].forEach((el,i)=>{
  const t=at(.6+i*.012);
  tl.fromTo(el,{opacity:1,scale:.4,x:0,y:0,rotation:0},{x:vec[i][0],y:vec[i][1],rotation:vec[i][2],scale:1,duration:DUR*.2,ease:"power2.out"},t);
  tl.to(el,{y:vec[i][1]+50,opacity:0,duration:DUR*.16,ease:"power2.in"},t+DUR*.2);
 });

 // faces: watch the bubble, blink, then go smug
 const pup=(id,dx0,dy0,dx1,dy1,dx2,dy2)=>{
  tl.set(id,{x:dx0,y:dy0},T0);
  tl.to(id,{x:dx1,y:dy1,duration:DUR*.4,ease:"power2.inOut"},at(.1));
  tl.to(id,{x:dx2,y:dy2,duration:DUR*.16,ease:"back.out(1.2)"},at(.62));
 };
 pup('#p1a,#p1b',5,5,9,2,6,3);
 pup('#p2a,#p2b',-3,5,7,3,-5,4);
 pup('#p3a,#p3b',-7,5,-3,5,-6,4);
 // lids: blinks (0 to 1 to 0) then smug half-lids (.55)
 const blink=(l,t)=>{ // l = ids
  tl.set(l,{opacity:1},T0);
  tl.fromTo(l,{scaleY:0,transformOrigin:'50% 0%'},{scaleY:1,duration:DUR*.035,ease:"power2.in"},at(t));
  tl.to(l,{scaleY:0,duration:DUR*.05,ease:"power2.out"},at(t+.04));
 };
 tl.set('#l1a,#l1b,#l2a,#l2b,#l3a,#l3b',{scaleY:0,transformOrigin:'50% 0%'},T0);
 blink('#l1a,#l1b',.3);blink('#l2a,#l2b',.17);blink('#l3a,#l3b',.43);
 const smug=(l,m,mn,b,t)=>{
  tl.to(l,{scaleY:.55,duration:DUR*.1,ease:"power2.out"},at(t));
  tl.to(mn,{opacity:0,duration:DUR*.06,ease:ED},at(t));
  tl.to(m,{opacity:1,duration:DUR*.1,ease:ED},at(t));
  tl.to(b,{opacity:1,duration:DUR*.1,ease:ED},at(t+.02));
 };
 smug('#l1a,#l1b','#m1s','#m1n','#b1',.64);
 smug('#l2a,#l2b','#m2s','#m2n','#b2',.69);
 smug('#l3a,#l3b','#m3s','#m3n','#b3',.74);
 // after smug, one lazy re-blink back to half-lid
 [['#l1a,#l1b',.9],['#l3a,#l3b',.93]].forEach(([l,t])=>{
  tl.to(l,{scaleY:1,duration:DUR*.03,ease:"power2.in"},at(t));
  tl.to(l,{scaleY:.55,duration:DUR*.05,ease:"power2.out"},at(t+.035));
 });

 // notes hop in a cascade when the bubble lands, then drift to fill the space
 [['#nb1',.58],['#nb2',.62],['#nb3',.66]].forEach(([id,t],i)=>{
  tl.to(id,{y:-26,duration:DUR*.07,ease:"power2.out"},at(t));
  tl.to(id,{y:0,duration:DUR*.2,ease:"back.out(2.2)"},at(t+.07));
 });
 tl.to('#nb1',{x:60,duration:DUR*.4,ease:"sine.inOut"},at(.62));
 tl.to('#nb2',{x:-10,duration:DUR*.4,ease:"sine.inOut"},at(.64));
 tl.to('#nb3',{x:-70,duration:DUR*.4,ease:"sine.inOut"},at(.66));
 tl.to('#nb1',{scale:1.06,svgOrigin:'140 150',duration:DUR*.3,ease:ED},at(.7));
 tl.to('#nb2',{scale:1.05,svgOrigin:'460 110',duration:DUR*.3,ease:ED},at(.72));
 tl.to('#nb3',{scale:1.06,svgOrigin:'760 160',duration:DUR*.3,ease:ED},at(.74));
};
</script>
