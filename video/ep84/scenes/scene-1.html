<script>
window.buildScene_1=function(tl,T0,DUR){
 const E1="power3.out",ED="sine.inOut";
 const U=DUR*1.05; // illustration timeline scales with the scene: landing at ~57% of DUR, second beat at ~84%
 const at=f=>T0+U*f;
 tl.set('#s1',{opacity:1,visibility:'visible'},T0);
 tl.fromTo('#cam1',{scale:1,x:6,y:-5},{scale:1.03,x:-6,y:6,duration:DUR,ease:ED},T0);

 // ---- hook words: all five in the first ~0.4 s (fast soft ease), KEPT and TRASHED! slam in big.
 const ws=[...document.querySelectorAll('#s1 .w')];
 const wt=[0,.03,.08,.12,.06];
 ws.forEach((el,i)=>{
  if(i===0) tl.fromTo(el,{opacity:.6,y:14},{opacity:1,y:0,duration:.3,ease:"expo.out"},T0);
  else if(el.classList.contains('pill')) tl.fromTo(el,{opacity:.5,y:34,scale:.9},{opacity:1,y:0,scale:1,duration:.38,ease:"power3.out"},T0+wt[i]);
  else tl.fromTo(el,{opacity:.5,y:22},{opacity:1,y:0,duration:.3,ease:"power3.out"},T0+wt[i]);
 });
 tl.set('#s1 .w',{opacity:.5},T0);
 // the real ChatGPT badge is there from frame 0, settles and keeps bobbing
 tl.fromTo('#bd1',{rotation:-7,scale:.92,y:6},{rotation:0,scale:1,y:0,duration:.45,ease:"back.out(1.2)"},T0);
 tl.to('#bd1',{y:-6,rotation:2,duration:.62,ease:ED,yoyo:true,repeat:Math.ceil(DUR/.62)},T0+.45);

 // ---- notes: constant flutter (own period/phase)
 const sway=(id,cx,cy,amp,per,ph,ya)=>{
  let t=ph,k=0;
  tl.set(id,{svgOrigin:cx+' '+cy},T0);
  while(t<DUR-.05){
   const sgn=(k%2?-1:1), d=per*(.85+.3*((k*37)%7)/7);
   tl.to(id,{rotation:sgn*amp*(.8+.4*((k*5)%3)/3),y:-sgn*ya,duration:d,ease:ED},T0+t);
   t+=d*.92;k++;
  }
 };
 sway('#hnw1',140,150,3.2,.5,0,4);
 sway('#hnw2',460,110,2.6,.6,.08,5);
 sway('#hnw3',760,160,3.4,.45,.04,4);

 // ---- the trashed chat is already in flight on frame 0, spins into the open can
 tl.set('#bub1',{svgOrigin:'230 445',x:150,y:-80,rotation:-16,scale:1.32},T0);
 tl.to('#bub1',{x:490,duration:U*.5,ease:"power1.inOut"},T0);
 tl.to('#bub1',{y:-120,duration:U*.16,ease:"sine.out"},T0);
 tl.to('#bub1',{y:64,duration:U*.34,ease:"power2.in"},at(.16));
 tl.to('#bub1',{rotation:12,scale:.86,duration:U*.4,ease:ED},T0+.02);
 tl.to('#bub1',{scaleX:.34,scaleY:.2,rotation:24,duration:U*.14,ease:"power2.in"},at(.5));
 tl.to('#bub1',{opacity:0,duration:U*.05,ease:ED},at(.62));
 tl.fromTo('#x1',{scale:.7,svgOrigin:'390 365'},{scale:1.08,duration:.5,ease:"back.out(1.6)"},T0);
 tl.fromTo('#spd1',{opacity:.9,x:0},{opacity:0,x:-30,duration:U*.3,ease:"power2.out"},T0);
 // lid: already open on frame 0, flaps shut a bit after landing
 tl.set('#lid1',{svgOrigin:'622 408'},T0);
 tl.fromTo('#lid1',{rotation:-38},{rotation:-46,duration:U*.3,ease:ED},T0);
 tl.to('#lid1',{rotation:-12,duration:U*.22,ease:"back.inOut(1.2)"},at(.6));
 // can squashes on landing, soft elastic settle
 tl.set('#tc1',{svgOrigin:'730 604'},T0);
 tl.to('#tc1',{scaleY:.94,scaleX:1.04,duration:U*.07,ease:"power2.out"},at(.54));
 tl.to('#tc1',{scaleY:1,scaleX:1,duration:U*.26,ease:"elastic.out(1,.5)"},at(.61));
 // paper bits puff
 tl.set('#s1 .bt',{opacity:0,scale:.3,svgOrigin:'730 410'},T0);
 const vec=[[-70,-120,200],[60,-150,-160],[-20,-170,120],[100,-90,-220],[-110,-70,260],[30,-190,-100]];
 [...document.querySelectorAll('#s1 .bt')].forEach((el,i)=>{
  const t=at(.58+i*.012);
  tl.fromTo(el,{opacity:1,scale:.4,x:0,y:0,rotation:0},{x:vec[i][0]*1.5,y:vec[i][1]*1.4,rotation:vec[i][2],scale:2.4,duration:U*.2,ease:"power2.out"},t);
  tl.to(el,{y:vec[i][1]*1.4+60,opacity:0,duration:U*.16,ease:"power2.in"},t+U*.2);
 });

 // ---- faces look at the viewer on frame 0, glance at the falling chat, blink, go smug
 const pup=(id,dx1,dy1,dx2,dy2)=>{
  tl.set(id,{x:0,y:1},T0);
  tl.to(id,{x:dx1,y:dy1,duration:U*.3,ease:"power2.inOut"},at(.14));
  tl.to(id,{x:dx2,y:dy2,duration:U*.16,ease:"back.out(1.2)"},at(.58));
 };
 pup('#hp1a,#hp1b',7,4,0,3);
 pup('#hp2a,#hp2b',5,3,0,3);
 pup('#hp3a,#hp3b',-3,4,-1,3);
 const blink=(l,t)=>{
  tl.set(l,{opacity:1},T0);
  tl.fromTo(l,{scaleY:0,transformOrigin:'50% 0%'},{scaleY:1,duration:U*.035,ease:"power2.in"},at(t));
  tl.to(l,{scaleY:0,duration:U*.05,ease:"power2.out"},at(t+.04));
 };
 tl.set('#hl1a,#hl1b,#hl2a,#hl2b,#hl3a,#hl3b',{scaleY:0,transformOrigin:'50% 0%'},T0);
 blink('#hl1a,#hl1b',.3);blink('#hl2a,#hl2b',.2);blink('#hl3a,#hl3b',.42);
 const smug=(l,m,mn,b,t)=>{
  tl.to(l,{scaleY:.55,duration:U*.1,ease:"power2.out"},at(t));
  tl.to(mn,{opacity:0,duration:U*.06,ease:ED},at(t));
  tl.to(m,{opacity:1,duration:U*.1,ease:ED},at(t));
  tl.to(b,{opacity:1,duration:U*.1,ease:ED},at(t+.02));
 };
 smug('#hl1a,#hl1b','#hm1s','#hm1n','#hb1',.62);
 smug('#hl2a,#hl2b','#hm2s','#hm2n','#hb2',.67);
 smug('#hl3a,#hl3b','#hm3s','#hm3n','#hb3',.72);
 [['#hl1a,#hl1b',.88],['#hl3a,#hl3b',.92]].forEach(([l,t])=>{
  tl.to(l,{scaleY:1,duration:U*.03,ease:"power2.in"},at(t));
  tl.to(l,{scaleY:.55,duration:U*.05,ease:"power2.out"},at(t+.035));
 });

 // ---- notes hop in a cascade on landing and drift apart
 [['#hnb1',.56],['#hnb2',.6],['#hnb3',.64]].forEach(([id,t])=>{
  tl.to(id,{y:-26,duration:U*.07,ease:"power2.out"},at(t));
  tl.to(id,{y:0,duration:U*.2,ease:"back.out(2.2)"},at(t+.07));
 });
 tl.to('#hnb1',{x:50,duration:U*.42,ease:ED},at(.6));
 tl.to('#hnb2',{x:-10,duration:U*.42,ease:ED},at(.62));
 tl.to('#hnb3',{x:-60,duration:U*.42,ease:ED},at(.64));
 tl.to('#hnb1',{scale:1.06,svgOrigin:'140 150',duration:U*.3,ease:ED},at(.68));
 tl.to('#hnb2',{scale:1.05,svgOrigin:'460 110',duration:U*.3,ease:ED},at(.7));
 tl.to('#hnb3',{scale:1.06,svgOrigin:'760 160',duration:U*.3,ease:ED},at(.72));
 // ---- beat 1 (landing, ~1.5 s): lime burst + TRASHED! pulse
 tl.set('#burst1',{svgOrigin:'730 500',opacity:0},T0);
 tl.fromTo('#burst1',{opacity:.95,scale:.3},{opacity:0,scale:2.3,duration:U*.2,ease:"power2.out"},at(.54));
 const pill=document.querySelector('#s1 .w[data-w="4"]'), kept=document.querySelector('#s1 .w[data-w="1"]');
 tl.to(pill,{scale:1.045,duration:U*.07,ease:"sine.out"},at(.55));
 tl.to(pill,{scale:1,duration:U*.16,ease:"sine.inOut"},at(.62));
 // ---- beat 2 (~2.5 s): notes hop again, lid pops, KEPT pulses
 [['#hnb1',.80],['#hnb2',.825],['#hnb3',.85]].forEach(([id,t])=>{
  tl.to(id,{y:-16,duration:U*.05,ease:"power2.out"},at(t));
  tl.to(id,{y:0,duration:U*.12,ease:"back.out(2)"},at(t+.05));
 });
 tl.to('#lid1',{rotation:-34,duration:U*.05,ease:"power2.out"},at(.81));
 tl.to('#lid1',{rotation:-12,duration:U*.12,ease:"back.out(2)"},at(.86));
 tl.to(kept,{scale:1.05,duration:U*.06,ease:"sine.out"},at(.82));
 tl.to(kept,{scale:1,duration:U*.14,ease:"sine.inOut"},at(.88));
 // idle after: pupils glance, can wobbles
 tl.to('#hp1a,#hp1b,#hp2a,#hp2b,#hp3a,#hp3b',{x:-5,duration:U*.12,ease:ED},at(1.08));
 tl.to('#hp1a,#hp1b,#hp2a,#hp2b,#hp3a,#hp3b',{x:4,duration:U*.14,ease:ED},at(1.22));
 tl.to('#tc1',{rotation:1.5,duration:U*.2,ease:ED,yoyo:true,repeat:3},at(1.0));
};
</script>
