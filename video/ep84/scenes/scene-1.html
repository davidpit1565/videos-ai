<script>
window.buildScene_1=function(tl,T0,DUR){
 const ED="sine.inOut", at=f=>T0+DUR*f;
 tl.set('#s1',{opacity:1,visibility:'visible'},T0);
 tl.set('#s1 .w',{opacity:0},T0);
 // camera drift
 tl.fromTo('#cam1',{scale:1,x:-8,y:6},{scale:1.03,x:9,y:-8,duration:DUR,ease:ED},T0);
 // headline words, uneven stagger over ~60% of DUR
 const off=[0.0,0.07,0.16,0.24,0.36,0.47];
 [...document.querySelectorAll('#s1 .w')].forEach((el,i)=>{
  const t=at(off[i]*0.95), pill=el.classList.contains('pill');
  if(pill) tl.fromTo(el,{opacity:0,y:36,scale:1.14},{opacity:1,y:0,scale:1,duration:DUR*0.2,ease:"back.out(1.2)"},t);
  else tl.fromTo(el,{opacity:0,y:34},{opacity:1,y:0,duration:DUR*0.17,ease:"expo.out"},t);
 });
 // proof already on screen at frame 0: badge + bubble + first notes in partial pop
 tl.fromTo('#bd',{opacity:1,scale:.9,rotation:-6},{opacity:1,scale:1,rotation:0,duration:DUR*0.2,ease:"back.out(1.2)"},T0);
 tl.fromTo('#bub',{opacity:1,y:24,scale:.94,transformOrigin:'20% 100%'},{opacity:1,y:0,scale:1,duration:DUR*0.22,ease:"back.out(1.2)"},T0+0.02);
 tl.to('#bub',{y:-7,duration:DUR*0.3,ease:ED,yoyo:true,repeat:3},at(0.22));
 tl.to('#bd',{y:-6,rotation:2,duration:DUR*0.26,ease:ED,yoyo:true,repeat:3},at(0.2));
 tl.fromTo('#bd .ring',{opacity:.9,scale:1},{opacity:0,scale:1.25,duration:DUR*0.3,ease:"sine.out",repeat:2,repeatDelay:DUR*0.05},at(0.12));
 // typing dots wave
 [...document.querySelectorAll('#bdots i')].forEach((d,i)=>tl.fromTo(d,{y:0},{y:-12,duration:0.3+i*0.04,ease:ED,yoyo:true,repeat:Math.ceil(DUR/0.7)},T0+i*0.11));
 // notes: sprout from badge, soft overshoot; first two already mid-pop at frame 0
 const N=[
  {id:'#n1',fx:-560,fy:60,r:7,at:0.00,ph:0,per:1.15},
  {id:'#n3',fx:-60,fy:-290,r:-8,at:0.03,ph:.3,per:1.5},
  {id:'#n2',fx:-640,fy:-120,r:-5,at:0.22,ph:.7,per:1.3},
  {id:'#n4',fx:-260,fy:-330,r:5,at:0.4,ph:.1,per:1.7}];
 N.forEach((n,i)=>{
  const t=at(n.at);
  tl.fromTo(n.id,{opacity:1,x:n.fx*0.42,y:n.fy*0.42,scale:i<2?.55:.15,rotation:n.r*3},{opacity:1,x:0,y:0,scale:1,rotation:n.r,duration:DUR*(0.3+i*0.03),ease:"back.out(1.2)"},t);
  const fl=n.id+' .fl', reps=Math.ceil(DUR/n.per);
  tl.fromTo(fl,{rotation:-2.6,y:-3},{rotation:2.6,y:5,duration:n.per,ease:ED,yoyo:true,repeat:reps},T0+n.ph*0.3);
 });
 // spark pops
 tl.fromTo('#sp1',{opacity:0,scale:.2,rotation:-30},{opacity:1,scale:1,rotation:15,duration:DUR*0.2,ease:"back.out(1.2)"},at(0.2));
 tl.to('#sp1',{scale:.6,opacity:.3,duration:DUR*0.25,ease:ED,yoyo:true,repeat:2},at(0.4));
 tl.fromTo('#sp2',{opacity:0,scale:.2},{opacity:1,scale:1,rotation:-20,duration:DUR*0.2,ease:"back.out(1.2)"},at(0.5));
 tl.to('#sp2',{scale:.5,opacity:.3,duration:DUR*0.2,ease:ED,yoyo:true,repeat:2},at(0.7));
 // pen enters, wobbles and scribbles on note 2
 tl.fromTo('#pen',{opacity:0,x:80,y:70,rotation:10},{opacity:1,x:0,y:0,rotation:0,duration:DUR*0.28,ease:"back.out(1.2)"},at(0.16));
 const pk=[[-14,6,-3],[6,-8,2],[-24,4,-4],[10,-5,3],[-6,8,-2],[-18,-3,3]];
 pk.forEach((k,i)=>tl.to('#pen',{x:k[0],y:k[1],rotation:k[2],duration:DUR*(0.1+0.015*(i%3)),ease:ED},at(0.4+i*0.095)));
 tl.fromTo('#scrp',{strokeDashoffset:320},{strokeDashoffset:0,duration:DUR*0.5,ease:"sine.inOut"},at(0.36));
 // pen eyes: blink + look at viewer / at note, brow raise
 tl.fromTo('#pen .ey',{scaleY:1,transformOrigin:'50% 50%'},{scaleY:.08,duration:0.09,ease:"power2.inOut",yoyo:true,repeat:1},T0+1.15);
 tl.fromTo('#pen .ey',{scaleY:1},{scaleY:.08,duration:0.09,ease:"power2.inOut",yoyo:true,repeat:1},T0+2.55);
 tl.to('#pen .pp',{x:-5,y:4,duration:0.35,ease:ED},at(0.3));
 tl.to('#pen .pp',{x:5,y:-1,duration:0.4,ease:ED},at(0.62));
 tl.fromTo('#brw',{y:0},{y:-6,duration:0.3,ease:"back.out(1.2)"},at(0.55));
 tl.to('#brw',{y:0,duration:0.5,ease:ED},at(0.8));
 tl.fromTo('#cap1',{opacity:0},{opacity:.85,duration:DUR*0.2,ease:ED},at(0.45));
};
</script>
