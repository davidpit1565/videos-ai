<script>
window.buildScene_7=function(tl,T0,DUR){
 const ED="sine.inOut",BK="back.out(1.2)";
 const at=f=>T0+DUR*f;
 tl.set('#s7',{opacity:1,visibility:'visible'},T0);
 tl.set('#s7 .w',{opacity:0},T0);
 // camera drift
 tl.fromTo('#cam7',{scale:1,x:-6,y:5},{scale:1.03,x:7,y:-7,duration:DUR,ease:ED},T0);
 // headline words, uneven offsets
 const ws=[...document.querySelectorAll('#s7 .w')];
 const ts=[0.02,0.11,0.19,0.24,0.36];
 ws.forEach((el,i)=>{
  if(i==4) tl.fromTo(el,{opacity:0,y:44,scale:1.25},{opacity:1,y:0,scale:1,duration:DUR*.24,ease:"expo.out"},at(ts[i]));
  else tl.fromTo(el,{opacity:0,y:34},{opacity:1,y:0,duration:DUR*.15,ease:"power3.out"},at(ts[i]));
 });
 // frame-0 proof: friend, phone with chatgpt badge and first bubbles already there
 tl.set('#fr7',{transformOrigin:'160px 580px'},T0);
 tl.fromTo('#ph7',{y:30,rotation:-3,svgOrigin:'700 300',opacity:1},{y:0,rotation:0,svgOrigin:'700 300',duration:DUR*.28,ease:BK},T0);
 tl.fromTo('#fr7',{x:-40},{x:0,duration:DUR*.26,ease:"expo.out"},T0);
 // breathing and phone sway all scene
 tl.fromTo('#body7',{scaleY:1,transformOrigin:'160px 580px'},{scaleY:1.022,duration:DUR*.34,ease:ED,yoyo:true,repeat:2},T0);
 tl.fromTo('#head7',{rotation:-3,svgOrigin:'160 350'},{rotation:4,svgOrigin:'160 350',duration:DUR*.4,ease:ED,yoyo:true,repeat:2},T0);
 tl.fromTo('#ph7',{rotation:-.8,svgOrigin:'700 300'},{rotation:.9,svgOrigin:'700 300',duration:DUR*.45,ease:ED,yoyo:true,repeat:2},at(0.28));
 tl.fromTo('#bdg7',{scale:1,svgOrigin:'700 84'},{scale:1.1,svgOrigin:'700 84',duration:DUR*.2,ease:ED,yoyo:true,repeat:4},T0);
 // blinks (about every 2.5 s of real time) + eyebrows react
 [0.18,0.74].forEach(f=>{
  tl.to('#eyes7',{scaleY:.08,svgOrigin:'160 250',duration:.07,ease:"power2.in"},at(f));
  tl.to('#eyes7',{scaleY:1,svgOrigin:'160 250',duration:.12,ease:"power2.out"},at(f)+.07);
 });
 tl.fromTo('#brL7',{y:0},{y:-8,duration:DUR*.12,ease:ED,yoyo:true,repeat:3},at(0.1));
 tl.fromTo('#brR7',{y:0},{y:-9,duration:DUR*.14,ease:ED,yoyo:true,repeat:3},at(0.13));
 // talking mouth, uneven
 [[0,.07],[.09,.06],[.19,.08],[.3,.05],[.38,.09],[.5,.06],[.58,.07],[.67,.05]].forEach(([f,d],i)=>{
  tl.fromTo('#mouth7',{scaleY:.45,svgOrigin:'160 283'},{scaleY:1,svgOrigin:'160 283',duration:DUR*d,ease:ED,yoyo:true,repeat:1},at(f));
 });
 // thumbs tapping, varying rhythm
 tl.fromTo('#thL7',{y:0},{y:-9,duration:.2,ease:ED,yoyo:true,repeat:Math.floor(DUR/.4)},T0);
 tl.fromTo('#thR7',{y:0},{y:-8,duration:.27,ease:ED,yoyo:true,repeat:Math.floor(DUR/.54)},T0+.1);
 tl.fromTo('#phn7',{rotation:0,svgOrigin:'231 482'},{rotation:3,svgOrigin:'231 482',duration:.5,ease:ED,yoyo:true,repeat:Math.floor(DUR/.5)},T0);
 // chat bubbles inside the phone (first two already visible at frame 0)
 const mbs=[...document.querySelectorAll('#s7 .mb')];
 const mt=[0,0.02,0.1,0.17,0.25,0.35,0.44,0.53];
 mbs.forEach((el,i)=>{
  const right=(i%2==0);
  tl.fromTo(el,{opacity:i<2?1:0,scale:i<2?.9:.5,svgOrigin:(right?'844':'556')+' '+(+el.dataset.y+22)},{opacity:1,scale:1,duration:DUR*.13,ease:BK},at(mt[i]));
 });
 tl.to('#msgs7',{y:-60,duration:DUR*.16,ease:"power2.inOut"},at(0.3));
 tl.to('#msgs7',{y:-176,duration:DUR*.2,ease:"power2.inOut"},at(0.52));
 tl.fromTo('#dots7',{opacity:0,y:20},{opacity:1,y:0,duration:DUR*.1,ease:"power2.out"},at(0.64));
 // flying chatter bubbles from friend to phone, each its own arc
 const fb=[...document.querySelectorAll('#s7 .fb')];
 const fs=[0.02,0.12,0.22,0.34,0.46], fd=[.2,.24,.19,.23,.21], fy=[-150,-110,-170,-120,-140], fe=[20,60,-10,80,40];
 fb.forEach((el,i)=>{
  const x0=250,y0=270,x1=560,y1=210+fe[i];
  tl.fromTo(el,{opacity:0,scale:.4,x:x0,y:y0,svgOrigin:'0 0'},{opacity:1,scale:1,duration:DUR*.06,ease:BK},at(fs[i]));
  tl.fromTo(el,{x:x0},{x:x1,duration:DUR*fd[i],ease:"sine.inOut"},at(fs[i]));
  tl.fromTo(el,{y:y0},{y:y0+fy[i],duration:DUR*fd[i]*.5,ease:"sine.out"},at(fs[i]));
  tl.to(el,{y:y1,duration:DUR*fd[i]*.5,ease:"sine.in"},at(fs[i]+fd[i]*.5));
  tl.to(el,{opacity:0,scale:.6,duration:DUR*.05,ease:"power2.in"},at(fs[i]+fd[i]*.92));
 });
 // post card slides in, plane flies from it to the phone
 tl.fromTo('#card7',{opacity:0,y:90,rotation:6,svgOrigin:'395 526'},{opacity:1,y:0,rotation:-3,svgOrigin:'395 526',duration:DUR*.22,ease:BK},at(0.5));
 tl.to('#card7',{rotation:2,svgOrigin:'395 526',duration:DUR*.4,ease:ED,yoyo:true,repeat:1},at(0.72));
 tl.set('#pl7',{x:395,y:488,opacity:0},T0);

 tl.fromTo('#pl7',{opacity:0,scale:.5,svgOrigin:'0 0',x:395,y:490},{opacity:1,scale:1,duration:DUR*.07,ease:BK},at(0.66));

 tl.fromTo('#pl7',{y:490},{y:340,duration:DUR*.13,ease:"sine.out"},at(0.68));
 tl.to('#pl7',{y:150,duration:DUR*.13,ease:"sine.in"},at(0.81));
 tl.fromTo('#plr7',{rotation:-20,svgOrigin:'0 0'},{rotation:-45,svgOrigin:'0 0',duration:DUR*.13,ease:ED,yoyo:true,repeat:1},at(0.68));
 tl.to('#pl7',{opacity:0,scale:.4,duration:DUR*.06,ease:"power2.in"},at(0.92));
