<script>
window.buildScene_6=function(tl,T0,DUR){
 const ED="sine.inOut",BO="back.out(1.2)";
 const at=f=>T0+DUR*f;
 tl.set('#s6',{opacity:1,visibility:'visible'},T0);
 tl.set('#s6 .w',{opacity:0},T0);
 tl.set('#mem6',{opacity:1,scale:.94,rotation:-1.5},T0);
 tl.set('#cab6',{opacity:0,x:70},T0);
 tl.set('#gh6',{opacity:0,svgOrigin:'220 250',x:0,y:-205,scale:.15},T0);
 tl.set('#cal6',{opacity:0,y:22,scale:.94},T0);
 tl.set('#hero6',{opacity:0,scale:.78,y:30,rotation:-3},T0);
 tl.set('#may6',{opacity:0,scale:.5,rotation:-14},T0);
 tl.set('#s6 .mote',{opacity:0},T0);
 tl.set('#pg2,#pg3,#pg4,#pg5',{opacity:0},T0);
 tl.set('#bd6 .pg:first-child',{opacity:0},T0);
 tl.set('#pg1,#pg2,#pg3,#pg4,#pg5',{rotationX:0,transformPerspective:700,transformOrigin:'50% 0%'},T0);
 // camera drift all scene
 tl.fromTo('#cam6',{scale:1,x:-6,y:5},{scale:1.03,x:7,y:-7,duration:DUR,ease:ED},T0);
 // headline words, uneven rhythm, over ~60%
 const ws=[...document.querySelectorAll('#s6 .w')], ts=[0.02,0.105,0.21,0.3,0.4,0.5];
 ws.forEach((el,i)=>{
  if(i==3) tl.fromTo(el,{opacity:0,y:40,scale:1.18},{opacity:1,y:0,scale:1,duration:DUR*.2,ease:"expo.out"},at(ts[i]));
  else tl.fromTo(el,{opacity:0,y:32},{opacity:1,y:0,duration:DUR*.15,ease:"power3.out"},at(ts[i]));
 });
 // empty memory card: already there, settles with a soft overshoot, then sways
 tl.to('#mem6',{scale:1,rotation:0,duration:DUR*.2,ease:BO},T0);
 tl.fromTo('#mem6',{y:-4},{y:5,duration:DUR*.32,ease:ED,yoyo:true,repeat:3},at(.18));
 tl.fromTo('#ok6',{scale:.6,rotation:-20},{scale:1,rotation:0,duration:DUR*.16,ease:"back.out(1.6)"},at(.06));
 tl.to('#ok6',{rotation:6,duration:DUR*.3,ease:ED,yoyo:true,repeat:3},at(.25));
 // drawer chest slides in, front pulls open
 tl.to('#cab6',{opacity:1,x:0,duration:DUR*.2,ease:"expo.out"},at(.05));
 tl.to('#dr6',{y:36,duration:DUR*.17,ease:BO},at(.24));
 tl.fromTo('#cab6',{rotation:0},{rotation:-.8,duration:DUR*.4,ease:ED,yoyo:true,repeat:2},at(.3));
 // ghost file rises out, grows, then bobs
 tl.to('#gh6',{opacity:1,duration:DUR*.1,ease:ED},at(.27));
 tl.to('#gh6',{y:-262,scale:.66,duration:DUR*.3,ease:BO},at(.27));
 tl.fromTo('#gb6',{y:2},{y:-12,duration:.62,ease:ED,yoyo:true,repeat:Math.ceil(DUR*.7/.62)},at(.5));
 tl.fromTo('#gb6',{rotation:-1.5,svgOrigin:'220 250'},{rotation:2,duration:.9,ease:ED,yoyo:true,repeat:Math.ceil(DUR*.7/.9)},at(.5));
 // eyes: glance at card, then at calendar, blink twice, brows rise
 tl.to('#pL6,#pR6',{x:-9,duration:DUR*.08,ease:ED},at(.42));
 tl.to('#pL6,#pR6',{x:8,y:3,duration:DUR*.09,ease:ED},at(.58));
 tl.to('#pL6,#pR6',{x:0,y:0,duration:DUR*.1,ease:ED},at(.8));
 [.47,.74,.93].forEach(f=>tl.to('#eL6,#eR6',{scaleY:.08,duration:.07,ease:"sine.in",yoyo:true,repeat:1},at(f)));
 tl.to('#brow6',{y:-9,duration:DUR*.07,ease:"power2.out"},at(.62));
 tl.to('#brow6',{y:0,duration:DUR*.12,ease:ED},at(.82));
 // dust motes drift up out of the drawer
 [['#m1',.34,-80],['#m2',.4,-110],['#m3',.46,-70]].forEach(([s,f,dy])=>{
  tl.fromTo(s,{opacity:0,y:60,scale:.4},{opacity:1,y:0,scale:1,duration:DUR*.1,ease:"power2.out"},at(f));
  tl.to(s,{y:dy,x:'+=14',opacity:0,duration:DUR*.28,ease:ED},at(f+.1));
 });
 // calendar pops up, pages flip away with uneven timing
 tl.to('#cal6',{opacity:1,y:0,scale:1,duration:DUR*.16,ease:BO},at(.3));
 [['#pg1',.4],['#pg2',.47],['#pg3',.535],['#pg4',.6],['#pg5',.655]].forEach(([s,f],i)=>{
  const d=DUR*(.13-i*.006);
  tl.to(s,{rotationX:-172,duration:d,ease:"power2.in"},at(f));
  tl.set(s,{opacity:0},at(f)+d*.45);
  tl.set(i<4?'#pg'+(i+2):'#bd6 .pg:first-child',{opacity:1},at(f)+d*.45);
 });
 tl.fromTo('#cal6',{rotation:-1.2},{rotation:1.2,duration:DUR*.3,ease:ED,yoyo:true,repeat:3},at(.4));
 // hero: UP TO 30 DAYS arrives with a soft overshoot, then breathes
 tl.to('#hero6',{opacity:1,scale:1,y:0,rotation:0,duration:DUR*.2,ease:BO},at(.62));
 tl.fromTo('#hero6',{scale:1},{scale:1.025,duration:DUR*.22,ease:ED,yoyo:true,repeat:2},at(.84));
 tl.to('#may6',{opacity:1,scale:1,rotation:5,duration:DUR*.14,ease:"back.out(1.8)"},at(.78));
 tl.to('#may6',{rotation:-2,y:-4,duration:DUR*.2,ease:ED,yoyo:true,repeat:1},at(.9));
};
</script>
