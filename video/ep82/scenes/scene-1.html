<script>
window.buildScene_1=function(tl,T0,DUR){
 const t=f=>T0+DUR*f, d=f=>DUR*f, q=s=>document.querySelector(s), qa=s=>[...document.querySelectorAll(s)];
 const S="#s1 ";
 tl.set('#s1',{opacity:1,visibility:'visible'},T0);
 // initial states
 tl.set(S+".w",{opacity:0},T0);
 tl.set(S+"#pend",{rotation:-8},T0);
 tl.set(S+"#qc",{opacity:0,x:1100},T0);
 tl.set(S+"#q",{opacity:0,scale:.5},T0);
 tl.set(S+".sh",{opacity:0},T0);
 // camera drift (runs past the end so it never freezes)
 tl.fromTo(S+"#s1drift",{scale:1,x:-8,y:6},{scale:1.035,x:10,y:-8,duration:d(1.4),ease:"sine.inOut"},T0);
 // tile: alive before impact
 tl.fromTo(S+"#tile,"+S+"#tshadow",{scale:.96},{scale:1.03,duration:d(.22),ease:"sine.inOut",transformOrigin:"50% 50%"},T0);
 // headline words (synced roughly to speech)
 const wt=[.02,.10,.18,.27,.35,.50,.58];
 qa(S+".w").forEach(el=>{const k=+el.dataset.w, slam=el.classList.contains("pill")||el.classList.contains("sel");
  if(slam) tl.fromTo(el,{opacity:0,y:40,scale:1.16},{opacity:1,y:0,scale:1,duration:d(.2),ease:"expo.out"},t(wt[k]));
  else tl.fromTo(el,{opacity:0,y:44},{opacity:1,y:0,duration:d(.15),ease:"power3.out"},t(wt[k]));});
 // wrecking ball swing in
 const tI=.22;
 tl.fromTo(S+"#pend",{rotation:-8},{rotation:47,duration:d(tI),ease:"power2.in",transformOrigin:"0 0"},t(0));
 // impact: tile pushed, cracks
 tl.to(S+"#tile,"+S+"#crk",{x:-16,duration:d(.03),ease:"power2.out"},t(tI));
 tl.to(S+"#tshadow",{opacity:0,duration:d(.03)},t(tI));
 qa(S+"#crk path").forEach((p,i)=>tl.to(p,{strokeDashoffset:0,duration:d(.05),ease:"power2.out"},t(tI+.004+i*.007)));
 // recoil of the ball
 tl.to(S+"#pend",{rotation:16,duration:d(.12),ease:"power2.out"},t(tI+.02));
 tl.to(S+"#pend",{rotation:-4,duration:d(.14),ease:"power2.inOut"},t(tI+.14));
 tl.to(S+"#pend",{opacity:0,duration:d(.04),ease:"power1.in"},t(tI+.25));
 // break
 const tB=.27;
 tl.set(S+"#tile,"+S+"#crk",{opacity:0},t(tB));
 const V=[[-290,-60,-95],[-120,-80,-55],[130,-50,85],[250,160,120],[-40,250,-140],[-330,130,-110],[-170,170,40]];
 V.forEach((v,i)=>{const e="#sh"+i, st=t(tB)+i*.012;
  tl.set(S+e,{opacity:1,x:-16},st);
  tl.to(S+e,{x:v[0],y:v[1],rotation:v[2],duration:d(.3),ease:"power3.out"},st);
  tl.to(S+e,{y:v[1]+190+i*14,rotation:v[2]*1.25,duration:d(.22),ease:"power2.in"},st+d(.2));
  tl.to(S+e,{opacity:0,duration:d(.1),ease:"power1.in"},st+d(.28));});
 // flash + shake
 tl.fromTo(S+"#flash",{opacity:0},{opacity:.5,duration:d(.025),ease:"power2.out"},t(tI+.005));
 tl.to(S+"#flash",{opacity:0,duration:d(.13),ease:"power2.out"},t(tI+.03));
 [[-16,8],[12,-9],[-8,5],[4,-3],[0,0]].forEach((p,i)=>tl.to(S+"#s1shk",{x:p[0],y:p[1],duration:d(.03),ease:"sine.inOut"},t(tI+i*.03)));
 // quality card
 tl.to(S+"#qc",{opacity:1,x:0,duration:d(.14),ease:"power3.out"},t(.36));
 tl.to(S+"#qpA",{strokeDashoffset:0,duration:d(.2),ease:"power2.inOut"},t(.44));
 tl.to(S+"#qpB",{strokeDashoffset:0,duration:d(.24),ease:"power2.in"},t(.66));
 tl.to(S+"#qpA",{stroke:"#E5484D",duration:d(.1),ease:"sine.inOut"},t(.62));
 tl.to(S+"#qaU",{opacity:0,duration:d(.06),ease:"sine.inOut"},t(.64));
 tl.to(S+"#qaD",{opacity:1,duration:d(.08),ease:"sine.inOut"},t(.66));
 tl.to(S+"#qdot",{attr:{r:14},duration:d(.1),ease:"back.out(1.4)"},t(.88));
 // question mark settles in the accent
 tl.fromTo(S+"#q",{opacity:0,scale:.5,rotation:-12},{opacity:1,scale:1,rotation:-4,duration:d(.2),ease:"back.out(1.3)"},t(.46));
 tl.to(S+"#q",{rotation:3,y:-8,duration:d(.8),ease:"sine.inOut"},t(.66));
 tl.to(S+"#qc",{y:-6,duration:d(.8),ease:"sine.inOut"},t(.7));
};
</script>
