<div class="scn clip" id="s5" data-start="0" data-duration="__D5__" data-track-index="1"><div class="cam" id="c5">
 <div class="nb" id="n5">2</div>
 <div class="dt" id="d5">March 26</div>
 <div class="grp" id="g5" style="top:432px">

 </div>
 <div class="bug" id="bug5">BUG</div>
</div></div>
<script>
window.buildScene_5=function(tl,T0,DUR){
 const q=s=>document.querySelector(s), qa=s=>[...document.querySelectorAll(s)];
 const at=f=>T0+DUR*f;
 tl.set('#s5',{opacity:1,visibility:'visible'},T0);
 // seeded rng
 let a=82;const R=()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
 const cb=q('#cb5');
 // dust particles per old line
 ['a','b','c','d'].forEach(k=>{const ln=q('#l5'+k);const top=parseFloat(ln.style.top);
  for(let i=0;i<7;i++){const d=document.createElement('div');d.className='dust';d.dataset.k=k;d.style.left=(60+R()*760)+'px';d.style.top=(top+14+R()*28)+'px';cb.appendChild(d);}});
 tl.set(['#n5','#d5','#cb5','#bug5','#bb5'],{opacity:0},T0);
 tl.set('#n5',{scale:.6,rotation:-8},T0);
 tl.set('#d5',{x:-30},T0);
 tl.set('#cb5',{y:60,scale:.96},T0);
 tl.set('#bug5',{scale:2,rotation:-18},T0);
 tl.set('#bb5',{y:14,scale:.85,transformOrigin:'0% 100%'},T0);
 qa('#s5 .ln').forEach(l=>tl.set(l,{opacity:0,x:-24},T0));
 // camera drift for the whole scene
 tl.fromTo('#c5',{scale:1,x:-10,y:6},{scale:1.03,x:12,y:-8,duration:DUR,ease:'sine.inOut'},T0);
 // badge + date
 tl.to('#n5',{opacity:1,scale:1,rotation:-4,duration:DUR*.16,ease:'back.out(1.3)'},at(.01));
 tl.to('#d5',{opacity:1,x:0,duration:DUR*.16,ease:'power3.out'},at(.06));
 // headline words
 const wt=[.05,.10,.15,.20,.36,.46,.52,.58];
 qa('#s5 .w').forEach(el=>{const k=+el.dataset.w;const slam=el.classList.contains('pill');
  if(slam) tl.fromTo(el,{opacity:0,y:40,scale:1.18},{opacity:1,y:0,scale:1,duration:DUR*.2,ease:'expo.out'},at(wt[k]));
  else tl.fromTo(el,{opacity:0,y:40},{opacity:1,y:0,duration:DUR*.17,ease:'power3.out'},at(wt[k]));});
 // card in
 tl.to('#cb5',{opacity:1,y:0,scale:1,duration:DUR*.2,ease:'power3.out'},at(.08));
 ['a','b','c','d','e'].forEach((k,i)=>tl.to('#l5'+k,{opacity:1,x:0,duration:DUR*.13,ease:'power3.out'},at(.14+i*.045)));
 // BUG sticker slaps
 tl.to('#bug5',{opacity:1,scale:1,rotation:7,duration:DUR*.1,ease:'expo.out'},at(.34));
 tl.to('#cb5',{x:6,duration:DUR*.03,ease:'sine.inOut',yoyo:true,repeat:1},at(.38));
 // dissolve top down, landing on "forget"
 ['a','b','c','d'].forEach((k,i)=>{const t=.43+i*.06;
  tl.to('#l5'+k,{opacity:0,filter:'blur(8px)',y:-14,x:36,duration:DUR*.13,ease:'power2.in'},at(t));
  qa('#s5 .dust[data-k="'+k+'"]').forEach(d=>{
   tl.fromTo(d,{opacity:0,x:0,y:0,scale:1},{opacity:.9,duration:DUR*.03,ease:'sine.out'},at(t+.01));
   tl.to(d,{x:40+R()*120,y:-30-R()*70,opacity:0,scale:.3,duration:DUR*.16,ease:'power2.out'},at(t+.04));});
 });
 // newest line pulses
 tl.to('#l5e',{scale:1.025,duration:DUR*.1,ease:'sine.inOut',yoyo:true,repeat:1,transformOrigin:'50% 50%'},at(.7));
 // reply bubble: moves to fill the gap, confusion
 tl.to('#bb5',{opacity:1,y:0,scale:1,duration:DUR*.14,ease:'back.out(1.2)'},at(.72));
 tl.to('#q5',{rotation:-4,duration:DUR*.12,ease:'sine.inOut',yoyo:true,repeat:3,transformOrigin:'50% 50%'},at(.8));
 // slow final drift on bug sticker
 tl.to('#bug5',{rotation:5,duration:DUR*.5,ease:'sine.inOut'},at(.5));
};
</script>
