<style>
#s4{--acc:#D97757;--good:#2FBF71;--bad:#E5484D;--mid:#F2A33A}
#s4 .w{color:var(--ink)}#s4 .w.sel{color:var(--paper)}#s4 #v4b{background:var(--mid);opacity:0}
#s4 .pill{background:var(--acc)}
#s4 .b1{position:absolute;left:85px;top:652px;width:150px;height:150px;border-radius:44px;background:var(--acc);border:7px solid var(--ink);box-shadow:9px 9px 0 var(--ink);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:120px;letter-spacing:-.04em;opacity:0;padding-bottom:8px}
#s4 .dt{position:absolute;right:90px;top:672px;background:var(--white);border:6px solid var(--ink);border-radius:26px;box-shadow:7px 7px 0 var(--ink);font-weight:900;font-size:46px;padding:10px 28px;opacity:0;letter-spacing:-.02em}
#s4 #c4{position:absolute;left:65px;top:805px;width:950px;height:420px;background:var(--cd);border-radius:32px;border:2px solid #2A2C34;box-shadow:0 30px 60px rgba(0,0,0,.25);opacity:0;color:var(--cink)}
#s4 .hd{position:absolute;left:36px;top:26px;right:36px;height:56px;display:flex;align-items:center;gap:18px;font-weight:800;font-size:40px;color:var(--cink)}
#s4 .hd i{width:54px;height:54px;background:var(--white);border-radius:14px;display:flex;align-items:center;justify-content:center}
#s4 .hd i img{width:34px;height:34px}
#s4 .hd em{margin-left:auto;font-style:normal;font-family:JBM,monospace;font-weight:500;font-size:22px;color:#8A8B93;border:2px solid #3A3C45;border-radius:12px;padding:4px 12px}
#s4 .trk{position:absolute;left:70px;top:162px;width:810px;height:16px;border-radius:8px;background:#2B2D36}
#s4 .fil{position:absolute;left:0;top:0;height:16px;width:810px;border-radius:8px;background:var(--good)}
#s4 .stop{position:absolute;top:-8px;width:32px;height:32px;margin-left:-16px;border-radius:50%;background:#2B2D36;border:4px solid #14151A}
#s4 .knob{position:absolute;left:880px;top:170px;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:var(--good);border:6px solid var(--white);box-shadow:0 6px 18px rgba(0,0,0,.5)}
#s4 .lb{position:absolute;top:208px;font-family:JBM,monospace;font-weight:700;font-size:28px;color:#8A8B93;width:120px;margin-left:-60px;text-align:center}
#s4 .val{position:absolute;right:36px;top:92px;font-weight:900;font-size:34px;border-radius:16px;padding:4px 18px;color:var(--ink);background:var(--good)}
#s4 .th{position:absolute;left:70px;top:270px;font-family:JBM,monospace;font-weight:700;font-size:26px;color:#8A8B93}
#s4 .tb{position:absolute;left:70px;top:312px;width:810px;height:26px;border-radius:13px;background:#2B2D36;overflow:hidden}
#s4 .tf{position:absolute;left:0;top:0;height:26px;width:810px;border-radius:13px;background:var(--acc)}
#s4 .src{position:absolute;left:70px;right:70px;bottom:44px;text-align:center;font-weight:500;font-size:26px;color:#7D7E86}
</style>
<div class="scn clip" id="s4" data-start="0" data-duration="__D4__" data-track-index="1"><div class="cam" id="cam4">
 <div class="grp" id="g4" style="top:295px">
  <div class="row"><span class="w s92 lt" data-w="0">The</span><span class="w s92 lt" data-w="1">default</span></div>
  <div class="row"><span class="w s100" data-w="2">thinking</span><span class="w s100" data-w="3">effort</span></div>
  <div class="row"><span class="w s92" data-w="4" style="margin-top:6px">high</span><span class="w s92 lt" data-w="5" style="margin-top:6px">&rarr;</span><span class="w sel s100" data-w="6" style="margin-top:6px">medium</span></div>
 </div>
 <div class="b1" id="b4">1</div>
 <div class="dt" id="d4">March 4</div>
 <div id="c4">
  <div class="hd"><i><img src="assets/claude.svg"></i>Effort<em>re-created</em></div>
  <div class="val" id="v4">HIGH</div><div class="val" id="v4b">MEDIUM</div>
  <div class="trk"><div class="fil" id="f4"></div>
   <div class="stop" style="left:0"></div><div class="stop" style="left:405px"></div><div class="stop" style="left:810px"></div></div>
  <div class="lb" style="left:95px">low</div><div class="lb" style="left:475px">medium</div><div class="lb" style="left:845px">high</div>
  <div class="knob" id="k4"></div>
  <div class="th">thinking</div>
  <div class="tb"><div class="tf" id="t4"></div></div>
  <div class="src">Anthropic report, Claude Code</div>
 </div>
</div></div>
<script>
window.buildScene_4=function(tl,T0,DUR){
 const E1="power3.out",E2="power2.inOut",ED="sine.inOut",EB="back.out(1.2)";
 const at=f=>T0+DUR*f;
 tl.set('#s4',{opacity:1,visibility:'visible'},T0);
 tl.set('#s4 .w',{opacity:0},T0);
 tl.set('#b4,#d4,#c4,#v4b',{opacity:0},T0);tl.set('#v4',{opacity:1},T0);
 tl.set('#k4',{left:880,backgroundColor:'#2FBF71'},T0);
 tl.set('#f4',{width:810,backgroundColor:'#2FBF71'},T0);
 tl.set('#t4',{width:810},T0);
 // camera drift across the whole scene
 tl.fromTo('#cam4',{scale:1,x:-10,y:6},{scale:1.03,x:10,y:-8,duration:DUR,ease:ED},T0);
 // headline words
 const ws=[...document.querySelectorAll('#s4 .w')];
 ws.forEach((el,i)=>{
  const t=at(0.03+i*0.05), slam=el.classList.contains('sel');
  if(slam) tl.fromTo(el,{opacity:0,y:40,scale:1.15},{opacity:1,y:0,scale:1,duration:DUR*0.2,ease:"expo.out"},t);
  else tl.fromTo(el,{opacity:0,y:36},{opacity:1,y:0,duration:DUR*0.14,ease:E1},t);
 });
 // badge, date, card
 tl.fromTo('#b4',{opacity:0,scale:.7,rotation:-8},{opacity:1,scale:1,rotation:-3,duration:DUR*0.16,ease:EB},at(0.0));
 tl.fromTo('#d4',{opacity:0,scale:.75,rotation:6},{opacity:1,scale:1,rotation:3,duration:DUR*0.16,ease:EB},at(0.08));
 tl.fromTo('#c4',{opacity:0,y:60},{opacity:1,y:0,duration:DUR*0.2,ease:E1},at(0.1));
 // knob drop high -> medium (about 0.4 DUR long, centred on the middle)
 const m=at(0.36), md=DUR*0.4;
 tl.to('#k4',{left:475,duration:md,ease:E2},m);
 tl.to('#f4',{width:405,duration:md,ease:E2},m);
 tl.to('#t4',{width:405,duration:md,ease:E2},m);
 tl.to('#k4',{backgroundColor:'#F2A33A',duration:md*0.8,ease:ED},m);
 tl.to('#f4',{backgroundColor:'#F2A33A',duration:md*0.8,ease:ED},m);
 tl.to('#k4',{scale:1.15,duration:md*0.5,ease:ED,yoyo:true,repeat:1},m);
 tl.to('#v4',{opacity:0,duration:md*0.4,ease:'power2.inOut'},m+md*0.3);
 tl.to('#v4b',{opacity:1,duration:md*0.5,ease:E1},m+md*0.7);
 // slow tail drift on the knob and bar so it never freezes
 tl.to('#k4',{y:-3,duration:DUR*0.3,ease:ED,yoyo:true,repeat:1},at(0.78));
 tl.to('#t4',{width:395,duration:DUR*0.3,ease:ED,yoyo:true,repeat:1},at(0.78));
};
</script>
