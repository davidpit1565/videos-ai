<style>

<div class="scn clip" id="s2" data-start="0" data-duration="__D2__" data-track-index="1"><div class="cam" id="c2">

<script>
window.buildScene_2=function(tl,T0,DUR){
 const q=s=>document.querySelector(s), qa=s=>[...document.querySelectorAll(s)], t=f=>T0+DUR*f;
 tl.set('#s2',{opacity:1,visibility:'visible'},T0);
 tl.set('#s2 .w',{opacity:0},T0);
 tl.set('#d2',{opacity:0,y:140,scale:.97},T0);
 tl.set('#st2',{opacity:0,scale:1.05,rotation:-14},T0);
 tl.set('#q2 span',{backgroundSize:'0% 100%'},T0);
 const ws=qa('#s2 .w');
 ws.forEach((el,i)=>{const slam=el.classList.contains('sel');
  const a=t(.03+.3*i/ws.length);
  if(slam) tl.fromTo(el,{opacity:0,y:40,scale:1.15},{opacity:1,y:0,scale:1,duration:Math.max(.5,DUR*.2),ease:'expo.out'},a);
  else tl.fromTo(el,{opacity:0,y:44},{opacity:1,y:0,duration:Math.max(.45,DUR*.16),ease:'power3.out'},a);});
 tl.to('#d2',{opacity:1,y:0,scale:1,duration:DUR*.28,ease:'power3.out'},t(.1));
 const sp=qa('#q2 span');
 sp.forEach((el,i)=>{tl.to(el,{backgroundSize:'100% 100%',duration:DUR*.11,ease:'power2.inOut'},t(.3+.42*i/sp.length));});
 tl.to('#st2',{opacity:1,scale:1,rotation:-8,duration:DUR*.22,ease:'back.out(1.2)'},t(.68));
 tl.to('#st2',{rotation:-6.5,y:-4,duration:DUR*.3,ease:'sine.inOut'},t(.9));
 tl.fromTo('#c2',{scale:1,x:-12,y:6},{scale:1.035,x:12,y:-8,duration:DUR*1.15,ease:'sine.inOut'},T0);
};
</script>
