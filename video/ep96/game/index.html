<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cat vs Vacuum</title>
<style>html,body{margin:0;height:100%;background:#ecebe5;display:flex;align-items:center;justify-content:center}canvas{width:min(96vw,880px);border:4px solid #0f0f0f;border-radius:8px;box-shadow:12px 12px 0 #0f0f0f;touch-action:manipulation}</style></head>
<body><canvas id="c" width="880" height="760"></canvas><script src="game.js"></script><script>
const g=CatGame.make(document.getElementById('c'));let jump=false,last=performance.now();
function press(){if(g.state().over){g.reset();return}jump=true}
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();press()}});addEventListener('pointerdown',press);
(function loop(n){const dt=Math.min(.033,(n-last)/1000);last=n;g.step(dt,jump);jump=false;g.draw();requestAnimationFrame(loop)})(last);
</script></body></html>
