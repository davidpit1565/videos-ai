<!-- ep86 v2 hook C: "I asked AI to hide my test secret. Would it snitch?" Frame 0 shows the first headline readable; at "Would" it is replaced by WOULD IT SNITCH? and the three real logos get a "?". -->
<style>
#s1{opacity:1;visibility:visible} /* frame 0 = CSS state: readable before the timeline renders */
#s1 #h1a .w{opacity:1}
#s1 .tl{position:absolute;top:860px;width:220px;height:220px;background:var(--white);border:6px solid var(--ink);border-radius:56px;box-shadow:9px 9px 0 var(--ink);display:flex;align-items:center;justify-content:center}
#s1 .tl img{width:60%;height:60%;display:block}
#s1 .qm{position:absolute;left:150px;top:-44px;width:104px;height:104px;border-radius:52px;background:var(--acc);border:6px solid var(--ink);box-shadow:6px 6px 0 var(--ink);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:76px;line-height:1;padding-bottom:6px;color:var(--ink);opacity:0}
</style>
<div class="scn clip" id="s1" data-start="0" data-duration="__D1__" data-track-index="1"><div class="cam" id="c1">
 <div class="grp" id="h1a" style="top:300px">
  <div class="row"><span class="w s112 bk">I</span><span class="w s112 bk">ASKED</span><span class="w s112 bk">AI</span></div>
  <div class="row"><span class="w s112 bk">TO</span><span class="w s112 bk">HIDE</span><span class="w s112 bk">MY</span></div>
  <div class="row"><span class="w pill s100" style="margin-top:14px">TEST SECRET &#x1F92B;</span></div>
 </div>
 <div class="grp" id="h1b" style="top:330px">
  <div class="row"><span class="w s150 bk">WOULD</span><span class="w s150 bk">IT</span></div>
  <div class="row"><span class="w pill s150" style="margin-top:16px">SNITCH?</span></div>
 </div>
 <div class="tl" id="t1a" style="left:130px"><img src="assets/chatgpt.svg"><div class="qm">?</div></div>
 <div class="tl" id="t1b" style="left:430px"><img src="assets/gemini.svg"><div class="qm">?</div></div>
 <div class="tl" id="t1c" style="left:730px"><img src="assets/claude.svg"><div class="qm">?</div></div>
</div></div>
<script>
/* ep86 v2 scenes 1-4 helper (same copy in each of these files; guarded) */
window.__e86h=window.__e86h||{
 // absolute time of word i of narration line n (voice/words.json via cues), else a fraction of the line, else of the scene
 wAt:function(n,i,frac,T0,DUR){const L=((window.__CUES||{}).lines)||[],ln=L[n-1];
  if(ln&&ln.words&&ln.words[i])return ln.words[i][0]; if(ln)return ln.start+(ln.end-ln.start)*frac; return T0+DUR*frac;},
 // word-by-word entrance; f0=true: already readable at frame 0 (only a soft settle)
 words:function(tl,els,at,f0,step){step=step||.05;
  els.forEach((el,k)=>{const slam=el.classList.contains('pill')||el.classList.contains('sel')||el.classList.contains('red');const a=at+k*step;
   if(f0){ if(slam) tl.to(el,{scale:1.07,duration:.35,ease:'sine.inOut',yoyo:true,repeat:1},at+.15);
           else tl.to(el,{y:-6,duration:1.2,ease:'sine.inOut'},at); }
   else if(slam) tl.fromTo(el,{opacity:0,y:36,scale:1.16},{opacity:1,y:0,scale:1,duration:.5,ease:'expo.out'},a);
   else tl.fromTo(el,{opacity:0,y:40},{opacity:1,y:0,duration:.45,ease:'power3.out'},a);});},
 // slow camera drift past the scene end so nothing freezes
 drift:function(tl,sel,T0,DUR,f0){tl.fromTo(sel,f0?{scale:1,x:0,y:0}:{scale:1,x:-10,y:6},{scale:1.035,x:10,y:-8,duration:DUR+1,ease:'sine.inOut',transformOrigin:'540px 760px'},T0);}
};
window.buildScene_1=function(tl,T0,DUR){
 const h=window.__e86h, qa=s=>[...document.querySelectorAll(s)];
 tl.set('#s1',{opacity:1,visibility:'visible'},T0);
 h.drift(tl,'#c1',T0,DUR,true);
 h.words(tl,qa('#h1a .w'),T0,true);
 tl.set(qa('#h1b .w'),{opacity:0},T0); tl.set('#h1a',{opacity:1,y:0},T0);
 ['#t1a','#t1b','#t1c'].forEach((s,i)=>{
  tl.to(s,{y:i%2?-8:6,rotation:i%2?2:-2,duration:Math.max(.8,DUR-.1),ease:'sine.inOut'},T0+.05*i);
 });
 tl.to('#h1a .pill',{rotation:-2,duration:1.2,ease:'sine.inOut'},T0+.7);
 // "Would it snitch?"
 const tt=h.wAt(1,8,.6,T0,DUR);
 tl.to('#h1a',{opacity:0,y:-40,duration:.3,ease:'power2.in'},tt-.2);
 h.words(tl,qa('#h1b .w'),tt+.05,false,.08);
 tl.to('#h1b .pill',{rotation:-2,y:-4,duration:Math.max(.6,T0+DUR-tt-.5),ease:'sine.inOut'},tt+.55);
 ['#t1a','#t1b','#t1c'].forEach((s,i)=>{
  tl.fromTo(s+' .qm',{opacity:0,scale:.3,rotation:-30},{opacity:1,scale:1,rotation:8,duration:.55,ease:'back.out(1.7)'},tt+.25+i*.1);
  tl.to(s+' .qm',{rotation:-6,duration:.8,ease:'sine.inOut',yoyo:true,repeat:1},tt+.8+i*.1);
 });
};
</script>
