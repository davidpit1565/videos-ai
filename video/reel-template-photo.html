<title>Reel template — real-photo composite starter, wired to the real pipeline</title>
<!--
  Copy this file to start a new episode's build.html for the "real-photo composite"
  style — real full-res photo backgrounds instead of the channel's all-CSS look —
  approved by David this session ("much better!!") after test-photo-composite-v2/v3/
  v4.html and photo-composite-demo.html proved it out. This file is that style's
  version of video/reel-template.html: a real starter build wired to the real
  production pipeline, not another disposable test.

  WHAT THIS FILE ALREADY WIRES IN, so a new episode doesn't have to rediscover it:
    - the SHARED FIXED HEADLINE ZONE (padding-top:27cqw, ~291.6px, h2 8.4cqw) —
      verified consistent across three real, different photos this session (a night
      phone shot, a daylight kitchen shot, an evening living-room shot). Every scene
      in a photo-composite episode uses this SAME zone; do not move it per-photo —
      see channel/photo-composite-recipe.md for why that reads as sloppy.
    - ONE accent color for the WHOLE episode, not one per scene. David's own direct
      correction this session, made by watching the three-scene demo back to back and
      comparing it against a real shipped episode: per-scene color switching (ember/
      rust/rose depending on each photo's own palette) read as "three different videos
      stitched together," not one branded piece. Pick ONE hex for --accent below and
      use it in every scene.
    - Ken Burns motion (MotionKit.kenBurns) on every scene's photo layer — a slow,
      subtle pan/zoom, direction chosen per THAT SCENE's real photo (read the photo,
      don't copy another scene's numbers — see motion-kit.js's kenBurns() header for
      the sign convention and channel/photo-composite-recipe.md for the reasoning).
    - Non-box word emphasis: the climax phrase is a color/weight shift on real text,
      never an opaque rectangle/chip. That was the actual fix that made the photo
      style read as a real photo instead of "the same AI template" (round 1 vs round
      2 of this session's testing) — see channel/photo-composite-recipe.md.
    - Zoom-through scene transitions (motion-recipes.md recipe 4) between every
      photo scene, resolved PER SCENE from its own in/out transition windows (the
      approach photo-composite-demo.html landed on after an earlier pairwise version
      clobbered the middle scene's resting state — see renderScene() below).
    - No separate caption track — the fixed headline IS the caption. Standing rule
      since episode 54's third round of direct feedback: a full static headline and a
      second word-by-word caption underneath it just show the same sentence twice at
      once. This template has no .subs div. Instead each headline word pops/brightens
      in place exactly when its narration word is spoken
      (MotionKit.animateWordEmphasis), driven by export/headline_sync.py, which
      derives the same per-word timing export/karaoke.py uses from real Whisper
      alignment — never a hand-typed timestamp guess. This file only defines CUES (a
      full-sentence line per scene, same contract as reel-template.html, used for the
      alignment window) and a placeholder per-scene WORD_WINDOWS array (all nulls)
      headline_sync.py's regex replaces; it holds no hand-authored window data. A
      real episode always
      runs the real pipeline (export/produce.sh -> audio/word_stamps.py ->
      export/headline_sync.py) against real Whisper alignment.

  ================================================================================
  MANDATORY PRE-CHECK — DO NOT SKIP, same standing as check_setup_guide.py's gate
  ================================================================================
  Every real photo used in this style MUST go through real face/subject detection
  and export/detect_photo_safe_zone.py BEFORE its headline/caption placement is
  finalized. This is not a suggestion — it is a hard requirement, exactly like
  export/check_setup_guide.py refusing to ship an episode with no real setup guide.
  The exact sequence (see export/detect_photo_safe_zone.py's own header, which this
  restates so it is not missed):
    1. mcp__Adobe__adobe_mandatory_init()                      # once per conversation
    2. python3 export/detect_photo_safe_zone.py prepare <photo.png>
       -> prints the exact next Adobe upload + image_select_subject calls to run
    3. Run those calls (an operator/agent turn, not a script) to get a real
       normalized {x,y,w,h} face/subject bbox back from image_select_subject.
    4. python3 export/detect_photo_safe_zone.py recommend <photo.png> --bbox x,y,w,h
       -> real, PIL-measured brightness per candidate zone, a gradient-peak-alpha
       recommendation, and a plain flag if the subject's bbox conflicts with either
       the fixed headline zone above or the bottom:62cqw caption anchor.
  If the recommendation reports a conflict (the fixed zone overlaps the detected
  subject), the real fix used this session was Adobe's image_generative_expand
  (outpaint) + image_crop_to_bounds to push the subject clear of the zone, then
  RE-RUNNING image_select_subject + detect_photo_safe_zone.py on the RESULT to
  confirm the conflict is actually gone — not assumed fixed. See
  test-photo-composite-v4.html's own header for the full worked example (round 5)
  and channel/photo-composite-recipe.md for the standing rule this generalizes to.
  Skipping this and eyeballing a photo's placement is exactly the "guessed, not
  measured" failure mode CLAUDE.md's "measure, don't guess" rule exists to catch.
  ================================================================================

  STILL NOT WIRED IN, on purpose (be honest about it, don't claim otherwise):
  per-sentence / per-few-sentences photo swapping (a different real photo landing on
  each new sentence or two within a single scene, not just once per scene) was
  discussed this session but is NOT implemented anywhere, including here — every
  scene below still shows exactly one photo for its whole duration. Building it for
  real means roughly 4x the per-scene work this template already documents above
  (source/license a photo, upload it, run real face detection, run
  detect_photo_safe_zone.py, re-derive gradient + Ken Burns direction) multiplied by
  however many sentences a scene would need to cover instead of once per scene. See
  channel/photo-composite-recipe.md's own "not yet built" section.

  Real full-res photo assets go in channel/assets/ — see channel/assets/test-photo-
  *-fullres.png for the naming/resolution convention this style already uses (real
  1080x1920 photos, no crop needed if sourced at that aspect).

  Same technical contract as every reel in this repo: .pad/.b/.b.on/.b.gone,
  [data-in]/[data-out]/[data-at], window.MotionKit, window.__reel, safe-area
  conventions (top 14%/269px, bottom 35%/672px, sides 6%/65px on 1080x1920) — verify
  with `node export/safe_check.js <this file>`.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Assistant:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --ink:#0A0E14;--line:#1F2B3A;
  /* ONE accent for the whole episode — replace this hex only, per episode. Never
     switch it scene to scene (see the file header's ROUND 5 CORRECTION note). */
  --accent:#DC2626;
  --text:#FFFFFF;--muted:#8AA0B8;
  --d:'Archivo','Helvetica Neue',Arial,sans-serif;
  --b:'Assistant','Segoe UI',system-ui,sans-serif;
  --m:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box}
body{margin:0;background:#050709;color:var(--text);font-family:var(--b);-webkit-font-smoothing:antialiased}
.page{display:flex;gap:34px;justify-content:center;padding:24px 16px 70px;flex-wrap:wrap;align-items:flex-start}
.reel{width:min(400px,92vw);flex:0 0 auto}
.frame{position:relative;aspect-ratio:9/16;width:100%;overflow:hidden;border-radius:8px;
  container-type:inline-size;background:var(--ink);border:1px solid var(--line)}

.scene{position:absolute;inset:0;z-index:2;will-change:opacity,transform,filter}
/* Real photo background, full-bleed cover. Source at 1080x1920 (this channel's only
   reel format) shows the whole photo uncropped with no letterboxing. */
.photobg{position:absolute;inset:0;z-index:0;transform-origin:center center;will-change:transform;
  background-size:cover;background-position:center;background-repeat:no-repeat}
@media (prefers-reduced-motion:reduce){.photobg{transition:none!important}}
.grain{position:absolute;inset:0;z-index:1;opacity:.05;pointer-events:none;
  background-image:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 3px)}

/* PLACEHOLDER gradient, shared shape across every scene per the fixed-zone rule —
   only the PEAK opacity should differ per scene, and that peak must be the real
   PIL-measured brightness from detect_photo_safe_zone.py's "recommend" output
   (gradient_alpha_for_brightness), never a guessed number. Replace .60 below with
   that measured value per scene; keep the stop percentages identical across scenes
   so the darkened band's edge lands at the same y in every scene (see
   channel/photo-composite-recipe.md). */
.photogradient{position:absolute;inset:0;z-index:1;pointer-events:none;
  background:
    linear-gradient(180deg, rgba(4,4,4,.60) 0%, rgba(4,4,4,.50) 12%, rgba(4,4,4,.28) 24%, rgba(4,4,4,.08) 34%, transparent 40%, transparent 50%, rgba(4,4,4,.14) 57%, rgba(4,4,4,.48) 66%, rgba(4,4,4,.72) 76%, rgba(4,4,4,.80) 100%)}
.prog{position:absolute;left:0;top:0;height:.9cqw;background:var(--accent);z-index:14;width:0;
  box-shadow:0 0 3cqw rgba(220,38,38,.7)}

/* Fixed headline zone — SAME padding-top/font-size in every scene, on purpose. See
   the file header: this is the shared zone verified across three real, different
   photos this session. Do not override per scene unless a real
   detect_photo_safe_zone.py run says this exact photo's subject conflicts with it
   AND a re-generation/re-crop attempt (see the MANDATORY PRE-CHECK above) could not
   clear the conflict — in that case, document the exception the same explicit way
   test-photo-composite-v4.html's file header does, don't silently move it. */
.pad{position:absolute;inset:0;z-index:2;padding:27cqw 10cqw 0;display:flex;flex-direction:column;
  justify-content:flex-start;align-items:center;text-align:center;gap:2.4cqw}
.kb{will-change:transform;width:100%}

.b{opacity:0;transform:translateY(2cqw) scale(.94);transition:opacity .16s ease,transform .22s cubic-bezier(.2,1.4,.4,1)}
.b.snap{transition:none}
.b.on{opacity:1;transform:none}
.b.gone{display:none!important}
@media (prefers-reduced-motion:reduce){.b,.kb{transition-duration:1ms!important}}

h2{font-family:var(--d);font-weight:900;font-size:8.4cqw;line-height:1.14;letter-spacing:-.02em;
  margin:0;text-wrap:balance;position:relative;z-index:2;color:var(--text);
  text-shadow:0 .5cqw 1.4cqw rgba(0,0,0,.92),0 .15cqw .4cqw rgba(0,0,0,.95),0 0 5cqw rgba(0,0,0,.5)}
/* Breathing room so a word mid-emphasis-pop (MK.animateWordEmphasis scales it up in
   place) never visually touches its neighbor — see video/reel-54.html's own header
   for the real glued-word defect this fixes. */
h2 .wd{margin:0 .08em}
/* Emphasis = color+weight shift only, no background shape, no border, no rotation —
   this is the "no opaque box" fix that made the photo style actually read as a real
   photo (see channel/photo-composite-recipe.md). Still named .box so
   MotionKit.splitWordsSafe() treats it as one atomic climax word for the reveal/pop
   animation, same convention as v2/v3/v4/demo. */
h2 .box{color:var(--accent);font-weight:900;background:none;border:0;padding:0;
  border-radius:0;display:inline;transform:none;text-shadow:0 .5cqw 1.4cqw rgba(0,0,0,.95),0 0 4cqw rgba(0,0,0,.6)}

.handle{position:absolute;left:0;right:0;bottom:14cqw;text-align:center;z-index:11;
  font-family:var(--m);font-size:2.6cqw;letter-spacing:.28em;text-transform:uppercase;color:#CBD5E1;
  text-shadow:0 .3cqw 1cqw rgba(0,0,0,.9)}
.tapover{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:rgba(5,7,9,.72);border:0;width:100%;color:var(--text)}
.tapover.hide{display:none}
.tapover .d{width:17cqw;height:17cqw;border-radius:50%;border:.7cqw solid var(--accent);display:grid;place-items:center}
.tapover .d::after{content:"";border-left:4.8cqw solid var(--accent);border-top:2.9cqw solid transparent;border-bottom:2.9cqw solid transparent;margin-inline-start:1.5cqw}

.ctl{display:flex;align-items:center;gap:11px;margin-top:11px}
.ctl input{flex:1;-webkit-appearance:none;appearance:none;background:transparent;height:20px;cursor:pointer;margin:0}
.ctl input::-webkit-slider-runnable-track{height:3px;background:#1B2735;border-radius:2px}
.ctl input::-moz-range-track{height:3px;background:#1B2735;border-radius:2px}
.ctl input::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--accent);margin-top:-4.5px}
.ctl input::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--accent)}
.ctl button{background:var(--accent);color:#fff;border:0;border-radius:3px;width:40px;height:31px;font-size:13px;font-weight:700;cursor:pointer}
.ctl span{font-family:var(--m);font-size:12px;color:var(--muted)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

body.render{background:#000;overflow:hidden}
#preroll{position:fixed;inset:0;background:#000;z-index:9999}
body.render .page{padding:0;gap:0;display:block}
body.render .ctl,body.render .tapover,body.render .prog{display:none!important}
body.render .reel{width:100vw;max-width:none}
body.render .frame{width:100vw;height:100vh;aspect-ratio:auto;border:0;border-radius:0}
</style>

<div class="page">
<div class="reel">
<div class="frame" id="frame">
<div class="prog" id="prog"></div>

<!-- Scene 1 — replace photobgA's background-image with a real, face-checked photo
     (see the MANDATORY PRE-CHECK above) and the placeholder headline text. -->
<section class="scene" data-in="0" data-out="7.50">
  <!-- PLACEHOLDER: channel/assets/<real-photo-A>.png — must be 1080x1920, must have
       passed the mandatory face-detection + detect_photo_safe_zone.py check above. -->
  <div class="photobg" id="photobgA" style="background-image:url('../channel/assets/REPLACE-scene-a-photo.png')"></div>
  <div class="grain" data-decor></div>
  <div class="photogradient"></div>
  <div class="pad"><div class="kb" id="hookKbA">
    <h2 id="hookH2A">Replace this — a real hook, <span class="box">the climax phrase goes here</span>.</h2>
  </div></div>
</section>

<!-- Scene 2 -->
<section class="scene" data-in="7.50" data-out="15.00">
  <div class="photobg" id="photobgB" style="background-image:url('../channel/assets/REPLACE-scene-b-photo.png')"></div>
  <div class="grain" data-decor></div>
  <div class="photogradient"></div>
  <div class="pad"><div class="kb" id="hookKbB">
    <h2 id="hookH2B">Replace this too — <span class="box">second scene's climax</span>.</h2>
  </div></div>
</section>

<!-- Scene 3 -->
<section class="scene" data-in="15.00" data-out="22.50">
  <div class="photobg" id="photobgC" style="background-image:url('../channel/assets/REPLACE-scene-c-photo.png')"></div>
  <div class="grain" data-decor></div>
  <div class="photogradient"></div>
  <div class="pad"><div class="kb" id="hookKbC">
    <h2 id="hookH2C">Last one — <span class="box">third scene's climax</span>.</h2>
  </div></div>
</section>

<div class="handle" data-decor>@actually_works.ai</div>
<button class="tapover" id="tap" aria-label="play"><span class="d"></span></button>
</div>
</div>

<div class="ctl">
  <button id="pp" aria-label="Play">▶</button>
  <input id="seek" type="range" min="0" max="22.50" step="0.05" value="0" aria-label="Seek">
  <span id="cur2">0:00</span>
</div>
</div>
</div>

<script src="../export/motion-kit.js"></script>
<script>
(function(){
  var MK=window.MotionKit;
  var DUR=22.50,t=0,playing=false,last=0;
  var frame=document.getElementById('frame');
  var scenes=[].slice.call(frame.querySelectorAll('.scene'));
  var seek=document.getElementById('seek');
  var pp=document.getElementById('pp'),cur2=document.getElementById('cur2');
  var tap=document.getElementById('tap'),prog=document.getElementById('prog');

  // Placeholder full-sentence lines — replace per episode, same contract as every
  // other reel's CUES array (see video/reel-template.html). This is the alignment
  // window export/headline_sync.py matches real Whisper word stamps against; it is
  // NOT a caption track (this style has none — the headline itself is the caption).
  var CUES=[
    [0.30,3.80,"Replace me — scene A caption line."],
    [7.80,11.30,"Replace me — scene B caption line."],
    [15.30,18.80,"Replace me — scene C caption line."]
  ];
  // Per-scene, per-headline-word [start,end] narration windows — replace per episode.
  // export/headline_sync.py fills this from real Whisper alignment; the placeholder
  // below (all null) just holds every word at rest with no emphasis, so this file
  // still runs standalone before the real pipeline has touched it.
  var WORD_WINDOWS=[[null,null,null,null,null,null,null],[null,null,null,null,null],[null,null,null,null,null]];

  function fmt(s){s=Math.max(0,Math.floor(s));return Math.floor(s/60)+":"+("0"+(s%60)).slice(-2);}

  // Ken Burns per scene — direction MUST be re-derived from each scene's own real
  // photo (read where its actual subject sits), never copied from another scene.
  // See motion-kit.js's kenBurns() header for the sign convention: positive X
  // reveals more of the image's LEFT (crops right), positive Y reveals more of the
  // TOP (crops bottom). These placeholder values are a small, safe default (subtle
  // zoom, near-zero pan) — replace per scene once the real photo is in place.
  var photobgA=document.getElementById('photobgA');
  var photobgB=document.getElementById('photobgB');
  var photobgC=document.getElementById('photobgC');
  var KB_A={toScale:1.07,toX:0,toY:0.8};
  var KB_B={toScale:1.07,toX:0,toY:0.8};
  var KB_C={toScale:1.07,toX:0,toY:0.8};

  // Hook word-by-word reveal + climax spotlight — same mechanism as
  // test-photo-composite-v2/v3/v4.html and photo-composite-demo.html's makeHook().
  // MK.splitWordsSafe() walks the h2's live DOM instead of retyping it as a string,
  // so the .box climax phrase survives as one atomic unit (never split, never
  // unwrapped) while every other word gets its own reveal span.
  function makeHook(kbId,h2Id,sceneIdx){
    var kb=document.getElementById(kbId);
    var h2=document.getElementById(h2Id);
    var scene=h2.closest('.scene');
    var split=MK.splitWordsSafe(h2);
    var climax=null;
    for(var i=0;i<split.words.length;i++){
      if(split.words[i].classList.contains('box')){ climax=split.words[i]; break; }
    }
    var climaxIndex=climax?split.words.indexOf(climax):-1;
    var windows=WORD_WINDOWS[sceneIdx]||[];
    return function render(){
      var ht=t-(+scene.dataset.in);
      var START=0.15,GAP=0.10,WDUR=0.30;
      for(var i=0;i<split.words.length;i++){
        var w=split.words[i],at=START+i*GAP;
        var entranceT=(ht-at)/WDUR;
        if(entranceT<1){
          if(w===climax){
            MK.animatePop(w,ht,at,WDUR);
          } else {
            var e=MK.smoothIn(MK.clamp01(entranceT));
            w.style.opacity=String(e);
            w.style.transform='translateY('+(14*(1-e)).toFixed(2)+'px)';
          }
        } else {
          // Entrance is done — hold the word fully revealed and let its own matched
          // narration window (if any) pop/brighten it in place. This is what replaces
          // the separate word-by-word caption track for this style (see
          // MK.animateWordEmphasis's header and channel/motion-recipes.md recipe 6).
          w.style.opacity='1';
          var win=windows[i];
          MK.animateWordEmphasis(w,t,win?win[0]:null,win?win[1]:null);
        }
      }
      if(climaxIndex>=0){
        var climaxAt=START+climaxIndex*GAP;
        var camScale=MK.multiPhaseCamera(ht,{settleDur:0.4,pullBack:0.98,pushAt:climaxAt,pushDur:0.9,pushTo:1.05});
        kb.style.transform='scale('+camScale.toFixed(4)+')';
      }
    };
  }
  var renderHookA=makeHook('hookKbA','hookH2A',0);
  var renderHookB=makeHook('hookKbB','hookH2B',1);
  var renderHookC=makeHook('hookKbC','hookH2C',2);

  // Zoom-through transition (motion-recipes.md recipe 4) between every scene,
  // resolved PER SCENE from its own in/out transition windows — NOT as
  // independent pairwise MK.zoomThroughTransition() calls. photo-composite-demo.html
  // found the real bug in the pairwise version: with 3+ scenes, the middle scene is
  // the inEl of one pair AND the outEl of the next, so the second pairwise call's
  // "resting" branches unconditionally overwrite whatever the first call already
  // set for that same middle scene, even at times nowhere near the second
  // transition — that clobbering showed scene B's photo at t=0 in an early version.
  // This resolves each scene's own opacity/transform/filter from its own incoming
  // and outgoing windows exactly once, so nothing conflicts.
  var OUT_DUR=0.42, IN_DUR=0.5, IN_OFFSET=0.16;
  function renderScene(i){
    var scene=scenes[i];
    var prev=i>0?scenes[i-1]:null;
    var next=i<scenes.length-1?scenes[i+1]:null;
    var outTime=+scene.dataset.out;
    var inStart=-Infinity, inEndsAt=-Infinity;
    if(prev){
      var prevOutStart=+prev.dataset.out-OUT_DUR;
      inStart=prevOutStart+IN_OFFSET;
      inEndsAt=inStart+IN_DUR;
    }
    var outStart=next?outTime-OUT_DUR:Infinity;

    var opacity,scale,blur;
    if(prev && t<inStart){
      opacity=0; scale=0.94; blur=5;
    } else if(prev && t<inEndsAt){
      var ie=MK.smoothIn(MK.clamp01((t-inStart)/IN_DUR));
      opacity=ie; scale=0.94+0.06*ie; blur=5*(1-ie);
    } else if(next && t>=outStart && t<outTime){
      var oe=MK.smoothIn(MK.clamp01((t-outStart)/OUT_DUR));
      opacity=1-oe; scale=1+0.16*oe; blur=5*oe;
    } else if(next && t>=outTime){
      opacity=0; scale=1.16; blur=5;
    } else {
      opacity=1; scale=1; blur=0;
    }
    scene.style.opacity=String(opacity);
    scene.style.transform='scale('+scale.toFixed(4)+')';
    scene.style.filter='blur('+blur.toFixed(1)+'px)';
  }
  function renderTransitions(){
    for(var i=0;i<scenes.length;i++) renderScene(i);
  }

  function render(){
    renderTransitions();
    renderHookA();
    renderHookB();
    renderHookC();

    photobgA.style.transform=MK.kenBurns(t-(+scenes[0].dataset.in),+scenes[0].dataset.out-(+scenes[0].dataset.in),KB_A);
    photobgB.style.transform=MK.kenBurns(t-(+scenes[1].dataset.in),+scenes[1].dataset.out-(+scenes[1].dataset.in),KB_B);
    photobgC.style.transform=MK.kenBurns(t-(+scenes[2].dataset.in),+scenes[2].dataset.out-(+scenes[2].dataset.in),KB_C);

    prog.style.width=(t/DUR*100)+'%';
    seek.value=t; cur2.textContent=fmt(t);
  }
  function loop(ts){ if(!playing)return; if(!last)last=ts; t+=(ts-last)/1000; last=ts;
    if(t>=DUR){t=DUR;pause();render();return;} render(); requestAnimationFrame(loop); }
  function play(){ if(t>=DUR)t=0; playing=true;last=0;pp.textContent='❚❚';tap.classList.add('hide');requestAnimationFrame(loop); }
  function pause(){ playing=false; pp.textContent='▶'; }
  pp.onclick=function(){playing?pause():play()};
  tap.onclick=play;
  seek.oninput=function(){t=+seek.value;last=0;render();};
  document.addEventListener('keydown',function(ev){ if(ev.key===' '&&ev.target.tagName!=='INPUT'){ev.preventDefault();playing?pause():play();} });
  render();
